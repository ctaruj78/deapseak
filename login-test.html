<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Входу - DeapSeaK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 30px; font-size: 24px; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
        }
        .log-item {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        .log-item.error {
            border-left-color: #dc3545;
            color: #dc3545;
        }
        .log-item.success {
            border-left-color: #28a745;
            color: #28a745;
        }
        .test-users {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        .test-users h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        .user-btn {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .user-btn:hover { background: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Тест Входу в систему</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="admin@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" value="admin123" required>
            </div>
            
            <button type="submit">Увійти</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div id="log" class="log"></div>
        
        <div class="test-users">
            <h3>🧪 Швидкі тести:</h3>
            <button class="user-btn" onclick="loginAs('admin@example.com', 'admin123')">
                👨‍💼 Admin
            </button>
            <button class="user-btn" onclick="loginAs('dispatcher1@example.com', 'dispatcher123')">
                📞 Диспетчер
            </button>
            <button class="user-btn" onclick="loginAs('tech1@example.com', 'tech123')">
                🔧 Технік
            </button>
            <button class="user-btn" onclick="loginAs('client1@example.com', 'client123')">
                👤 Клієнт
            </button>
        </div>
    </div>

    <script>
        const logDiv = document.getElementById('log');
        const messageDiv = document.getElementById('message');
        const form = document.getElementById('loginForm');

        function addLog(message, type = 'info') {
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.textContent = `[${new Date().toLocaleTimeString('uk-UA')}] ${message}`;
            logDiv.appendChild(item);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        async function performLogin(email, password) {
            try {
                addLog(`🔐 Спроба входу для: ${email}`);
                
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email,
                        password
                    })
                });

                addLog(`📊 HTTP Status: ${response.status}`);
                const data = await response.json();
                
                addLog(`📝 Response: ${JSON.stringify(data).substring(0, 100)}...`);

                if (response.ok && data.success) {
                    addLog(`✅ Успішна авторизація!`, 'success');
                    addLog(`🔑 Token отримано: ${data.token.substring(0, 20)}...`, 'success');
                    addLog(`👤 Користувач: ${data.user.username} (${data.user.role})`, 'success');
                    
                    showMessage(`✅ Успіх! Ви авторизовані як ${data.user.firstName || data.user.username}`, 'success');
                    
                    // Зберігаємо дані
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    addLog(`💾 Дані збережено в localStorage`);
                } else {
                    addLog(`❌ Помилка: ${data.message || data.error}`, 'error');
                    showMessage(`❌ ${data.message || data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Критична помилка: ${error.message}`, 'error');
                showMessage(`❌ Помилка: ${error.message}`, 'error');
            }
        }

        function loginAs(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            performLogin(email, password);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            performLogin(email, password);
        });

        // Діагностика при завантаженні
        window.addEventListener('load', () => {
            addLog('✅ Сторінка завантажена');
            addLog(`🌐 Хост: ${window.location.hostname}:${window.location.port}`);
            addLog(`🔌 API: http://localhost:3001`);
        });
    </script>
</body>
</html>
