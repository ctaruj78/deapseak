<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>✅ QRCodeJS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; }
        .test-box {
            background: #f8f9fa;
            padding: 30px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
        }
        #qr1, #qr2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            min-height: 200px;
        }
        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { background: #5568d3; }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ QRCodeJS Test</h1>
        <p style="text-align: center; color: #666;">Тестування бібліотеки qrcodejs (та сама що в common.js)</p>

        <div class="test-box">
            <h3>Тест 1: Простий текст</h3>
            <div id="qr1"></div>
            <button onclick="test1()">Генерувати QR 1</button>
        </div>

        <div class="test-box">
            <h3>Тест 2: JSON дані (як в lifts.js)</h3>
            <div id="qr2"></div>
            <button onclick="test2()">Генерувати QR 2</button>
        </div>

        <div class="log" id="log"></div>
    </div>

    <!-- Завантаження qrcodejs -->
    <script src="/assets/libs/qrcodejs.min.js"></script>
    
    <script>
        const logDiv = document.getElementById('log');
        
        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        // Перевірка бібліотеки
        setTimeout(() => {
            if (typeof QRCode !== 'undefined') {
                log('✅ QRCode доступний!', 'success');
                log('  typeof QRCode: ' + typeof QRCode);
                log('  QRCode.prototype: ' + Object.keys(QRCode.prototype).join(', '));
            } else {
                log('❌ QRCode НЕ завантажився!', 'error');
            }
        }, 500);

        function test1() {
            log('--- ТЕСТ 1: Простий текст ---');
            const qr1 = document.getElementById('qr1');
            qr1.innerHTML = '';
            
            try {
                log('Створення: new QRCode(element, {text, width, height})');
                
                new QRCode(qr1, {
                    text: 'LIFT-TEST-' + Date.now(),
                    width: 200,
                    height: 200
                });
                
                log('✅ Конструктор виконався', 'success');
                
                setTimeout(() => {
                    log('Перевірка DOM через 200мс:');
                    log('  children: ' + qr1.children.length);
                    log('  innerHTML length: ' + qr1.innerHTML.length);
                    
                    if (qr1.children.length > 0) {
                        const img = qr1.querySelector('img');
                        const canvas = qr1.querySelector('canvas');
                        
                        if (img) {
                            log('  ✅ Знайдено IMG!', 'success');
                            log('    width: ' + img.width);
                            log('    height: ' + img.height);
                            log('    src length: ' + (img.src ? img.src.length : 0));
                        } else if (canvas) {
                            log('  ✅ Знайдено CANVAS!', 'success');
                            log('    width: ' + canvas.width);
                            log('    height: ' + canvas.height);
                        } else {
                            log('  ⚠️ Невідомий елемент: ' + qr1.children[0].tagName);
                        }
                    } else {
                        log('  ❌ Елемент НЕ створився!', 'error');
                    }
                }, 200);
                
            } catch (error) {
                log('❌ ПОМИЛКА: ' + error.message, 'error');
            }
        }

        function test2() {
            log('--- ТЕСТ 2: JSON дані (як в lifts.js) ---');
            const qr2 = document.getElementById('qr2');
            qr2.innerHTML = '';
            
            try {
                const data = JSON.stringify({ 
                    id: 'LIFT-001', 
                    model: 'Test Model',
                    timestamp: Date.now()
                });
                
                log('JSON data: ' + data.substring(0, 50) + '...');
                
                new QRCode(qr2, {
                    text: data,
                    width: 200,
                    height: 200
                });
                
                log('✅ Конструктор виконався', 'success');
                
                setTimeout(() => {
                    log('Перевірка DOM через 200мс:');
                    log('  children: ' + qr2.children.length);
                    
                    if (qr2.children.length > 0) {
                        log('  ✅ QR код створено!', 'success');
                    } else {
                        log('  ❌ QR код НЕ створився!', 'error');
                    }
                }, 200);
                
            } catch (error) {
                log('❌ ПОМИЛКА: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
