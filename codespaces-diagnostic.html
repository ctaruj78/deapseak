<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Діагностика Codespaces - DeapSeaK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; margin-bottom: 20px; }
        .diagnostic {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .diagnostic strong {
            display: block;
            margin-bottom: 5px;
            color: #667eea;
        }
        .diagnostic code {
            display: block;
            margin-top: 5px;
            word-break: break-all;
        }
        .success { border-left-color: #28a745; }
        .success strong { color: #28a745; }
        .error { border-left-color: #dc3545; }
        .error strong { color: #dc3545; }
        .test-btn {
            display: inline-block;
            margin: 10px 5px;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .test-btn:hover { background: #764ba2; }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #fff9e6;
            border-radius: 5px;
            display: none;
        }
        .result.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Діагностика GitHub Codespaces</h1>
        
        <div id="diagnostics"></div>
        
        <div style="margin-top: 30px;">
            <h2>🧪 Тести</h2>
            <button class="test-btn" onclick="testAPI()">Тест API</button>
            <button class="test-btn" onclick="testLogin()">Тест Входу</button>
            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        function addDiagnostic(title, value, isOk = true) {
            const container = document.getElementById('diagnostics');
            const div = document.createElement('div');
            div.className = `diagnostic ${isOk ? 'success' : 'error'}`;
            div.innerHTML = `<strong>${title}</strong><code>${value}</code>`;
            container.appendChild(div);
        }

        function showResult(text, isOk = true) {
            const result = document.getElementById('result');
            result.textContent = text;
            result.className = `result show ${isOk ? 'success' : 'error'}`;
        }

        // Діагностика при завантаженні
        window.addEventListener('load', () => {
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;
            const port = window.location.port;
            
            addDiagnostic('Поточний hostname', hostname);
            addDiagnostic('Поточний протокол', protocol);
            addDiagnostic('Поточний порт', port);
            
            let apiUrl = '';
            if (hostname.includes('.app.github.dev')) {
                apiUrl = protocol + '//' + hostname.replace('-8080.', '-3001.') + '/api/health';
                addDiagnostic('Тип: GitHub Codespaces', '✅ Виявлено');
            } else if (port === '8080') {
                apiUrl = 'http://localhost:3001/api/health';
                addDiagnostic('Тип: Локальна розробка', '✅ Виявлено');
            } else {
                apiUrl = '/api/health';
                addDiagnostic('Тип: Невідомо', '⚠️ Невизначено');
            }
            
            addDiagnostic('API URL', apiUrl);
        });

        async function testAPI() {
            showResult('Тестування...', true);
            try {
                const hostname = window.location.hostname;
                const protocol = window.location.protocol;
                let apiUrl = '';
                
                if (hostname.includes('.app.github.dev')) {
                    apiUrl = protocol + '//' + hostname.replace('-8080.', '-3001.') + '/api/health';
                } else {
                    apiUrl = 'http://localhost:3001/api/health';
                }
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ API доступний!\nСтатус: ${data.status}\nURL: ${apiUrl}`, true);
                } else {
                    showResult(`❌ API недоступний\nСтатус: ${response.status}\nURL: ${apiUrl}`, false);
                }
            } catch (error) {
                showResult(`❌ Помилка: ${error.message}`, false);
            }
        }

        async function testLogin() {
            showResult('Тестування входу...', true);
            try {
                const hostname = window.location.hostname;
                const protocol = window.location.protocol;
                let apiUrl = '';
                
                if (hostname.includes('.app.github.dev')) {
                    apiUrl = protocol + '//' + hostname.replace('-8080.', '-3001.') + '/api/auth/login';
                } else {
                    apiUrl = 'http://localhost:3001/api/auth/login';
                }
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@example.com',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showResult(`✅ Вхід успішний!\nК-во: ${data.user.username}\nРоль: ${data.user.role}`, true);
                } else {
                    showResult(`❌ Вхід не пройшов\n${data.message || data.error}`, false);
                }
            } catch (error) {
                showResult(`❌ Помилка: ${error.message}`, false);
            }
        }
    </script>
</body>
</html>
