<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Діагностика логіну</title>
    <script src="security.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .test-result { 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 8px; 
            border-left: 4px solid;
        }
        .success { background-color: #d4edda; border-left-color: #28a745; }
        .error { background-color: #f8d7da; border-left-color: #dc3545; }
        .info { background-color: #d1ecf1; border-left-color: #17a2b8; }
        .warning { background-color: #fff3cd; border-left-color: #ffc107; }
        button { 
            padding: 12px 20px; 
            margin: 8px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .primary { background-color: #007bff; color: white; }
        .success-btn { background-color: #28a745; color: white; }
        .danger { background-color: #dc3545; color: white; }
        input { 
            padding: 10px; 
            margin: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            width: 200px;
        }
        pre { 
            background: #f8f9fa; 
            padding: 10px; 
            border-radius: 4px; 
            overflow-x: auto; 
            font-size: 12px;
        }
        .status-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Діагностика логіну DeapSeaK</h1>
        
        <div class="status-box">
            <h3>📊 Системний статус:</h3>
            <p id="system-status">Перевіряємо...</p>
        </div>

        <div class="test-result info">
            <h3>🧪 Швидкий тест логіну:</h3>
            <input type="text" id="test-username" placeholder="Username" value="admin">
            <input type="password" id="test-password" placeholder="Password" value="admin123">
            <br>
            <button class="primary" onclick="testLogin()">Тестувати логін</button>
            <button class="success-btn" onclick="testAPI()">Тест API</button>
            <button class="danger" onclick="clearLogs()">Очистити логи</button>
        </div>

        <div class="test-result">
            <h3>🔧 Діагностичні тести:</h3>
            <button class="primary" onclick="testAuthManager()">Перевірити AuthManager</button>
            <button class="primary" onclick="testLoginForm()">Перевірити форму логіну</button>
            <button class="primary" onclick="testRedirection()">Перевірити перенаправлення</button>
        </div>
        
        <div id="results"></div>
    </div>
    
    <script>
        let logs = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            updateResults();
            console.log(`[${timestamp}] ${message}`);
        }
        
        function updateResults() {
            const container = document.getElementById('results');
            container.innerHTML = logs.map(l => 
                `<div class="test-result ${l.type}">
                    <strong>[${l.timestamp}]</strong> ${l.message}
                </div>`
            ).join('');
        }
        
        function updateSystemStatus() {
            const statusEl = document.getElementById('system-status');
            
            let status = '✅ Система ініціалізована<br>';
            
            // Перевірка AuthManager
            if (typeof AuthManager !== 'undefined') {
                status += '✅ AuthManager завантажено<br>';
                
                const isAuth = AuthManager.isAuthenticated();
                const user = AuthManager.getCurrentUser();
                
                if (isAuth && user) {
                    status += `✅ Користувач авторизований: <strong>${user.username}</strong> (${user.role})`;
                } else {
                    status += '❌ Користувач не авторизований';
                }
            } else {
                status += '❌ AuthManager НЕ завантажено!';
            }
            
            statusEl.innerHTML = status;
        }
        
        async function testAPI() {
            log('🔄 Тестуємо API...', 'info');
            
            const username = document.getElementById('test-username').value;
            const password = document.getElementById('test-password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log(`✅ API працює! Токен отримано для ${data.user.username} (${data.user.role})`, 'success');
                    log(`📝 Токен: ${data.token.substring(0, 50)}...`, 'info');
                } else {
                    log(`❌ API помилка: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Помилка запиту до API: ${error.message}`, 'error');
            }
        }
        
        async function testLogin() {
            log('🔄 Тестуємо повний процес логіну...', 'info');
            
            const username = document.getElementById('test-username').value;
            const password = document.getElementById('test-password').value;
            
            if (!username || !password) {
                log('❌ Введіть username та password', 'error');
                return;
            }
            
            try {
                log(`📤 Відправляємо запит: username=${username}`, 'info');
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: username,
                        email: username, // Підтримуємо обидва поля
                        password: password
                    })
                });
                
                const data = await response.json();
                log(`📨 Відповідь сервера: ${JSON.stringify(data, null, 2)}`, 'info');
                
                if (response.ok && data.success) {
                    log('✅ Логін успішний!', 'success');
                    
                    // Тестуємо AuthManager
                    if (typeof AuthManager !== 'undefined') {
                        AuthManager.login(data.token, data.user);
                        log('✅ AuthManager оновлено', 'success');
                        
                        // Тестуємо перенаправлення
                        const expectedRedirect = getExpectedRedirect(data.user.role);
                        log(`🎯 Очікуване перенаправлення: ${expectedRedirect}`, 'info');
                        
                        updateSystemStatus();
                    } else {
                        log('❌ AuthManager недоступний', 'error');
                    }
                } else {
                    log(`❌ Помилка логіну: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Критична помилка: ${error.message}`, 'error');
            }
        }
        
        function getExpectedRedirect(role) {
            switch (role) {
                case 'admin': return 'pages/admin/admin-dashboard.html';
                case 'dispatcher': return 'pages/dispatcher/dashboard.html';
                case 'tech': case 'technician': return 'pages/tech/dashboard.html';
                case 'client': return 'pages/client/dashboard.html';
                default: return 'pages/admin/admin-dashboard.html';
            }
        }
        
        function testAuthManager() {
            log('🔄 Тестуємо AuthManager...', 'info');
            
            if (typeof AuthManager === 'undefined') {
                log('❌ AuthManager не завантажено! Перевірте security.js', 'error');
                return;
            }
            
            log('✅ AuthManager завантажено', 'success');
            
            const methods = ['isAuthenticated', 'getCurrentUser', 'login', 'logout', 'fetchWithAuth'];
            methods.forEach(method => {
                if (typeof AuthManager[method] === 'function') {
                    log(`✅ Метод AuthManager.${method}() доступний`, 'success');
                } else {
                    log(`❌ Метод AuthManager.${method}() ВІДСУТНІЙ`, 'error');
                }
            });
        }
        
        function testLoginForm() {
            log('🔄 Перевіряємо форму логіну на /login.html...', 'info');
            
            // Перевіряємо поля форми
            const usernameField = document.getElementById('username') || 
                                document.getElementById('email') ||
                                document.querySelector('input[name="username"]') ||
                                document.querySelector('input[name="email"]');
                                
            const passwordField = document.getElementById('password') ||
                                document.querySelector('input[name="password"]');
                                
            if (usernameField) {
                log(`✅ Поле username/email знайдено: id="${usernameField.id}"`, 'success');
            } else {
                log('❌ Поле username/email НЕ ЗНАЙДЕНО на цій сторінці', 'error');
                log('ℹ️ Цей тест працює тільки на сторінці login.html', 'warning');
            }
            
            if (passwordField) {
                log(`✅ Поле password знайдено: id="${passwordField.id}"`, 'success');
            } else {
                log('❌ Поле password НЕ ЗНАЙДЕНО на цій сторінці', 'error');
            }
        }
        
        async function testRedirection() {
            log('🔄 Тестуємо доступність сторінок перенаправлення...', 'info');
            
            const pages = [
                { role: 'admin', path: 'pages/admin/admin-dashboard.html' },
                { role: 'dispatcher', path: 'pages/dispatcher/dashboard.html' },
                { role: 'tech', path: 'pages/tech/dashboard.html' },
                { role: 'client', path: 'pages/client/dashboard.html' }
            ];
            
            for (const page of pages) {
                try {
                    const response = await fetch(page.path, { method: 'HEAD' });
                    if (response.ok) {
                        log(`✅ ${page.role.toUpperCase()}: ${page.path} доступна`, 'success');
                    } else {
                        log(`❌ ${page.role.toUpperCase()}: ${page.path} недоступна (${response.status})`, 'error');
                    }
                } catch (error) {
                    log(`❌ ${page.role.toUpperCase()}: Помилка доступу до ${page.path}`, 'error');
                }
                
                // Невелика затримка між запитами
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }
        
        function clearLogs() {
            logs = [];
            updateResults();
            log('🧹 Логи очищено', 'info');
        }
        
        // Ініціалізація
        document.addEventListener('DOMContentLoaded', () => {
            updateSystemStatus();
            log('🚀 Діагностика логіну ініціалізована', 'success');
        });
        
        // Оновлення статусу кожні 3 секунди
        setInterval(updateSystemStatus, 3000);
    </script>
</body>
</html>
