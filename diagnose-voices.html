<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Діагностика Голосів</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .voice { padding: 10px; margin: 5px 0; border-left: 4px solid #007acc; background: #252526; }
        .pt-PT { border-left-color: #4caf50; }
        .pt-BR { border-left-color: #ff9800; }
        .selected { background: #37373d; font-weight: bold; }
        pre { background: #1e1e1e; padding: 10px; border: 1px solid #3c3c3c; }
    </style>
</head>
<body>
    <h1>🔍 Діагностика Португальських Голосів</h1>
    <div id="info"></div>
    <h2>Доступні pt-* голоси:</h2>
    <div id="voices"></div>
    <h2>Логіка вибору:</h2>
    <pre id="logic"></pre>
    
    <script>
        function diagnose() {
            const voices = window.speechSynthesis.getVoices();
            const ptVoices = voices.filter(v => v.lang.startsWith('pt'));
            
            // Info
            document.getElementById('info').innerHTML = `
                <p>Всього голосів у системі: ${voices.length}</p>
                <p>Португальських голосів: ${ptVoices.length}</p>
                <hr>
            `;
            
            // Voices list
            let html = '';
            ptVoices.forEach((v, i) => {
                const isPtPT = v.lang === 'pt-PT';
                const isPtBR = v.lang === 'pt-BR' || v.lang.includes('BR');
                const className = isPtPT ? 'pt-PT' : (isPtBR ? 'pt-BR' : '');
                
                html += `<div class="voice ${className}">
                    ${i + 1}. <strong>${v.name}</strong><br>
                    Lang: ${v.lang} | Local: ${v.localService} | Default: ${v.default}
                </div>`;
            });
            document.getElementById('voices').innerHTML = html || '<p>❌ Португальських голосів не знайдено!</p>';
            
            // Selection logic
            const portugueseVoice = voices.find(voice => 
                voice.lang === 'pt-PT' || 
                (voice.lang.startsWith('pt') && !voice.lang.includes('BR') && voice.name.toLowerCase().includes('portugal'))
            );
            
            const anyPortuguese = voices.find(voice => 
                voice.lang.startsWith('pt') && !voice.lang.includes('BR')
            );
            
            let logicHtml = '<strong>КРОК 1:</strong> Pesquisar pt-PT або "portugal" (без BR)\n';
            if (portugueseVoice) {
                logicHtml += `✅ ЗНАЙДЕНО: ${portugueseVoice.name} (${portugueseVoice.lang})\n\n`;
                logicHtml += '<strong>РЕЗУЛЬТАТ:</strong> Буде використано цей голос ✅';
                
                // Highlight in list
                const items = document.querySelectorAll('.voice');
                items.forEach((item, i) => {
                    if (ptVoices[i].name === portugueseVoice.name) {
                        item.classList.add('selected');
                        item.innerHTML += '<br><span style="color: #4caf50;">👈 ВИБРАНИЙ</span>';
                    }
                });
            } else {
                logicHtml += '❌ НЕ ЗНАЙДЕНО\n\n';
                logicHtml += '<strong>КРОК 2:</strong> Pesquisar будь-якого португальського (крім BR)\n';
                
                if (anyPortuguese) {
                    logicHtml += `⚠️ ЗНАЙДЕНО АЛЬТЕРНАТИВУ: ${anyPortuguese.name} (${anyPortuguese.lang})\n\n`;
                    logicHtml += '<strong>РЕЗУЛЬТАТ:</strong> Буде використано альтернативу ⚠️';
                    
                    const items = document.querySelectorAll('.voice');
                    items.forEach((item, i) => {
                        if (ptVoices[i].name === anyPortuguese.name) {
                            item.classList.add('selected');
                            item.innerHTML += '<br><span style="color: #ff9800;">👈 АЛЬТЕРНАТИВА</span>';
                        }
                    });
                } else {
                    logicHtml += '❌ НЕ ЗНАЙДЕНО\n\n';
                    logicHtml += '<strong>РЕЗУЛЬТАТ:</strong> Буде використано системний голос (може бути pt-BR!) ❌';
                }
            }
            
            document.getElementById('logic').textContent = logicHtml;
            
            // Show in console
            console.log('=== ДІАГНОСТИКА ГОЛОСІВ ===');
            console.log('Португальські голоси:', ptVoices);
            console.log('Вибраний:', portugueseVoice || anyPortuguese || 'системний');
        }
        
        // Load voices
        window.speechSynthesis.getVoices();
        setTimeout(diagnose, 500);
        window.speechSynthesis.onvoiceschanged = () => {
            setTimeout(diagnose, 100);
        };
    </script>
</body>
</html>
