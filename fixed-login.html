<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Виправлений логін</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="hold-transition login-page bg-light">
    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="index.html"><i class="fas fa-elevator text-primary"></i> <b>LiftMaster Pro</b></a>
            <p style="font-size: 12px; color: #666;">Виправлена версія - без кешу</p>
        </div>
        
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Увійдіть для початку сесії</p>
                
                <form id="login-form">
                    <div class="input-group mb-3">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Логін (admin)" required autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-user"></span></div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Пароль (admin123)" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-sign-in-alt"></i> Увійти
                            </button>
                        </div>
                    </div>
                </form>
                
                <p class="mb-1 mt-3">
                    <a href="forgot-password.html">Забули пароль?</a>
                </p>
                <p class="mb-0">
                    <a href="register.html" class="text-center">Зареєструвати новий обліковий запис</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        console.log('🚀 Виправлена версія логіну завантажена:', new Date().toISOString());
        console.log('🌍 Current location:', window.location);
        console.log('📡 Current port:', window.location.port);
        
        // Формування URL для Codespaces
        function getApiUrl() {
            const hostname = window.location.hostname;
            console.log('🔍 Визначаємо API URL для hostname:', hostname);
            
            // Перевіряємо чи це GitHub Codespaces
            if (hostname.includes('.app.github.dev')) {
                // Формуємо URL для Codespaces: замінюємо порт у hostname
                const apiUrl = window.location.protocol + '//' + 
                              hostname.replace('-8080.', '-3001.') + 
                              '/api/auth/login';
                console.log('✅ GitHub Codespaces URL:', apiUrl);
                return apiUrl;
            }
            // Локальна розробка
            else if (window.location.port === '8080') {
                const url = 'http://localhost:3002/api/auth/login';
                console.log('✅ Локальний URL:', url);
                return url;
            } else {
                const url = '/api/auth/login';
                console.log('✅ Відносний URL:', url);
                return url;
            }
        }
        
        // Показ повідомлень
        function showMessage(message, type = 'error') {
            let alertDiv = document.getElementById('login-message');
            if (!alertDiv) {
                alertDiv = document.createElement('div');
                alertDiv.id = 'login-message';
                alertDiv.className = `alert alert-${type === 'error' ? 'danger' : 'success'}`;
                alertDiv.style.margin = '10px 0';
                document.querySelector('.login-card-body').insertBefore(alertDiv, document.querySelector('form'));
            }
            
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }
        
        // Обробка форми
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            console.log('🔐 Початок логіну - v3.0:', new Date().toISOString());
            console.log('👤 Username:', username);
            console.log('🔑 Password length:', password.length);
            
            if (!username || !password) {
                showMessage('Введіть логін та пароль');
                return;
            }
            
            const apiUrl = getApiUrl();
            console.log('🌐 Використовуємо URL:', apiUrl);
            
            try {
                console.log('📤 Відправляємо запит...');
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                console.log('📨 Отримали відповідь:');
                console.log('  - Status:', response.status);
                console.log('  - OK:', response.ok);
                console.log('  - URL:', response.url);
                
                const data = await response.json();
                console.log('📄 Дані відповіді:', data);
                
                if (response.ok && data.success) {
                    showMessage('Успішний логін! Перенаправлення...', 'success');
                    console.log('✅ Логін успішний!');
                    
                    // Збереження в localStorage
                    localStorage.setItem('liftmanager_jwt', data.token);
                    localStorage.setItem('liftmanager_user', JSON.stringify(data.user));
                    
                    // Перенаправлення
                    setTimeout(() => {
                        const role = data.user.role;
                        let redirectUrl;
                        
                        switch (role) {
                            case 'admin':
                                redirectUrl = 'pages/admin/admin-dashboard.html';
                                break;
                            case 'dispatcher':
                                redirectUrl = 'pages/dispatcher/dashboard.html';
                                break;
                            case 'tech':
                            case 'technician':
                                redirectUrl = 'pages/tech/dashboard.html';
                                break;
                            case 'client':
                                redirectUrl = 'pages/client/dashboard.html';
                                break;
                            default:
                                redirectUrl = 'pages/admin/admin-dashboard.html';
                        }
                        
                        console.log('🎯 Перенаправлення на:', redirectUrl);
                        window.location.href = redirectUrl;
                    }, 1500);
                    
                } else {
                    showMessage(data.message || 'Помилка авторизації');
                    console.error('❌ Помилка авторизації:', data);
                }
                
            } catch (error) {
                console.error('❌ Критична помилка:', error);
                showMessage('Помилка з\'єднання з сервером: ' + error.message);
            }
        });
        
        // Тест при завантаженні
        setTimeout(() => {
            console.log('🧪 Автотест URL генерації:');
            const testUrl = getApiUrl();
            console.log('🎯 Згенерований URL:', testUrl);
        }, 1000);
    </script>
</body>
</html>
