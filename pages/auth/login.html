<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Lift Management System</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../../assets/img/logo.png" alt="Lift Management System">
                <h1>Вхід в систему</h1>
                <p>Введіть ваші облікові дані для доступу</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Електронна пошта</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkmark"></span>
                        Запам'ятати мене
                    </label>
                    <a href="forgot-password.html">Забули пароль?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <span class="btn-text">Увійти</span>
                    <span class="btn-loading" style="display: none;">⏳</span>
                </button>
            </form>

            <div class="auth-divider">
                <span>або</span>
            </div>

            <div class="social-auth">
                <button class="btn btn-social btn-google">
                    <img src="../../assets/img/icons/google.png" alt="Google">
                    Увійти через Google
                </button>
                <button class="btn btn-social btn-microsoft">
                    <img src="../../assets/img/icons/microsoft.png" alt="Microsoft">
                    Увійти через Microsoft
                </button>
            </div>

            <div class="auth-footer">
                <p>Ще не маєте акаунта? <a href="register.html">Зареєструватися</a></p>
            </div>
        </div>

        <div class="auth-features">
            <div class="feature-item">
                <div class="feature-icon">🔧</div>
                <h3>Управління ліфтами</h3>
                <p>Ефективне керування парком ліфтів</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <h3>Моніторинг у реальному часі</h3>
                <p>Отримуйте дані про стан ліфтів онлайн</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🤖</div>
                <h3>AI асистент</h3>
                <p>Інтелектуальний помічник для техніків</p>
            </div>
        </div>
    </div>

    <div class="auth-notification" id="notification" style="display: none;">
        <div class="notification-content">
            <span class="notification-icon" id="notificationIcon"></span>
            <p id="notificationMessage"></p>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
</body>
</html>
