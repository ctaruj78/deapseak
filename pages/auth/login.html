<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - FestLift</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="/plugins/adminlte/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/plugins/bootstrap/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <style>
        /* === PRODUCTION LOGIN ANIMATIONS === */

        body.login-page {
            background: #0c1a35 !important;
            overflow: hidden;
            position: relative;
        }

        /* Floating background blobs */
        .fl-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
            animation: blobFloat ease-in-out infinite;
        }
        .fl-blob-1 {
            width: 520px; height: 520px;
            background: #1565c0;
            top: -120px; left: -120px;
            animation-duration: 22s;
        }
        .fl-blob-2 {
            width: 420px; height: 420px;
            background: #6a1b9a;
            bottom: -100px; right: -80px;
            animation-duration: 28s;
            animation-direction: reverse;
        }
        .fl-blob-3 {
            width: 280px; height: 280px;
            background: #0097a7;
            top: 45%; left: 55%;
            animation-duration: 18s;
        }
        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%       { transform: translate(28px, -28px) scale(1.06); }
            66%       { transform: translate(-18px, 18px) scale(0.94); }
        }

        /* Card entrance */
        .login-box {
            position: relative;
            z-index: 1;
            animation: cardEnter 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(48px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Card glass-feel */
        .login-box .card {
            background: rgba(255, 255, 255, 0.97) !important;
            border: none !important;
            border-radius: 14px !important;
            overflow: hidden;
        }
        .login-box .card-header.bg-primary {
            background: linear-gradient(135deg, #1565c0, #6a1b9a) !important;
            border-radius: 0 !important;
            padding: 20px !important;
        }

        /* Logo */
        .login-logo a {
            color: #fff !important;
            font-size: 1.9rem;
            text-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .login-logo a b { color: #fff; }
        .login-logo .fa-elevator {
            display: inline-block;
            animation: liftMove 3.5s ease-in-out infinite;
        }
        @keyframes liftMove {
            0%, 100% { transform: translateY(0); }
            25%       { transform: translateY(-8px); }
            50%       { transform: translateY(-3px); }
            75%       { transform: translateY(-10px); }
        }

        /* Button shine sweep */
        .btn-primary {
            background: linear-gradient(135deg, #1565c0, #6a1b9a) !important;
            border: none !important;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s, transform 0.15s;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(21, 101, 192, 0.5) !important;
            transform: translateY(-1px);
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%; left: -80%;
            width: 55%; height: 200%;
            background: rgba(255, 255, 255, 0.18);
            transform: skewX(-20deg);
            transition: left 0.5s ease;
        }
        .btn-primary:hover::after { left: 130%; }

        /* Input focus glow */
        .form-control:focus {
            border-color: #1565c0 !important;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15) !important;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        /* Card body subtle */
        .login-box .card-body { padding: 28px !important; }
    </style>
</head>
<body class="hold-transition login-page bg-light">
    <!-- Animated background -->
    <div class="fl-blob fl-blob-1"></div>
    <div class="fl-blob fl-blob-2"></div>
    <div class="fl-blob fl-blob-3"></div>

    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="../../index.html"><i class="fas fa-elevator text-primary"></i> <b>FestLift</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Entrar no sistema</h3>
            </div>
            <div class="card-body">
                <form id="login-form">
                    <div class="input-group mb-3">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Email" required autofocus autocomplete="username">
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Palavra-passe" required autocomplete="current-password">
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Lembrar-me</label>
                            </div>
                        </div>
                        <div class="col-6 text-right">
                            <a href="forgot-password.html">Esqueceu a palavra-passe?</a>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <!-- jQuery (Must be first!) -->
    <script src="/plugins/jquery/jquery.min.js"></script>
    <!-- Config -->
    <script src="../../assets/js/config.js"></script>
    <!-- Bootstrap -->
    <script src="/plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE -->
    <script src="/plugins/adminlte/adminlte.min.js"></script>
    
    <!-- Sistema de autenticação -->
    <script src="../../assets/js/auth.js"></script>
    
    <script>
        // НЕГАЙНА ініціалізація (беdesde чекання DOMContentLoaded)
        function initLoginForm() {
            const loginForm = document.getElementById('login-form');
            
            // Deахист від подвійної ініціалізації
            if (window.__loginFormInitialized) {
                console.log('⚠️ Форма já inicializado, пропускаexisteмо');
                return;
            }
            
            // Se форма ainda не готова - чекаexisteмо
            if (!loginForm) {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initLoginForm, { once: true });
                }
                return;
            }
            
            // Atéзначаexisteмо що форма inicializado
            window.__loginFormInitialized = true;
            console.log('🔧 Ініціалізація форми loginу...');
            
            // Автоpreenchimento desde URL параметрів (para rapidamenteго тестування)
            const urlParams = new URLSearchParams(window.location.search);
            const emailFromUrl = urlParams.get('email');
            const passwordFromUrl = urlParams.get('password');
            const autoLoginRequested = emailFromUrl && passwordFromUrl;
            
            // Se pedidoано автоlogin - очищаємо auth-дані БЕЗ редіректу,
            // щоб не було "blink + reset" перед першим submit.
            if (autoLoginRequested) {
                console.log('🔄 Автоlogin pedidoано - оouщуexisteмо сeрі dados (silent)');
                const authKeys = [
                    'liftmanager_jwt', 'liftmanager_user', 'liftmanager_refresh',
                    'userData', 'lm_session', 'lm_user', 'token', 'authToken',
                    'lm_token', 'deapseak_token', 'user', 'currentUser'
                ];
                authKeys.forEach((key) => {
                    try {
                        localStorage.removeItem(key);
                        sessionStorage.removeItem(key);
                    } catch (e) {}
                });
                document.cookie = 'auth_token=; path=/; expires=Thu, 01 Jan 1970 00:00:01 GMT;';
            }
            
            if (emailFromUrl) {
                document.getElementById('email').value = decodeURIComponent(emailFromUrl);
                console.log('📧 Email автозаповнено desde URL');
            }
            if (passwordFromUrl) {
                document.getElementById('password').value = decodeURIComponent(passwordFromUrl);
                console.log('🔑 Password автозаповнено desde URL');
            }
            
            // Перевіряexisteмо ou utilizador já увійшов através de AuthManager
            // Додаexisteмо захист від циклу редиректів
            const redirecting = sessionStorage.getItem('redirecting');
            if (redirecting) {
                console.log('⚠️ Deапобігання циклу редиректів - оouщуexisteмо session');
                sessionStorage.removeItem('redirecting');
                // Оouщуexisteмо todos dados автентифікації
                if (typeof AuthManager !== 'undefined') {
                    localStorage.removeItem(AuthManager.TOKEN_KEY);
                    localStorage.removeItem(AuthManager.USER_KEY);
                }
            } else if (!autoLoginRequested && typeof AuthManager !== 'undefined' && AuthManager.isAuthenticated()) {
                const user = AuthManager.getCurrentUser();
                if (user && user.role) {
                    // Перевіряexisteмо ou utilizador хоче sair (se в URL existe параметр logout)
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('logout') === 'true') {
                        console.log('🚪 Utilizador хоче sair, оouщуexisteмо dados...');
                        AuthManager.logout();
                        return;
                    }
                    
                    console.log('✅ Utilizador já autorizado:', user.username, '(' + user.role + ')');
                    
                    // Atéказуexisteмо mensagem desde можливістю sair
                    const loginContainer = document.querySelector('.login-container');
                    if (loginContainer) {
                        loginContainer.innerHTML = `
                            <div style="text-align: center; padding: 40px;">
                                <i class="fas fa-user-check" style="font-size: 64px; color: #28a745; margin-bottom: 20px;"></i>
                                <h3>Já tem sessão iniciada</h3>
                                <p>Utilizador: <strong>${user.username}</strong></p>
                                <p>Função: <strong>${getRoleName(user.role)}</strong></p>
                                <div style="margin-top: 30px;">
                                    <button onclick="window.redirectUserByRole('${user.role}')" class="btn btn-primary btn-lg" style="margin: 5px;">
                                        <i class="fas fa-arrow-right"></i> Continuar para o painel
                                    </button>
                                    <button onclick="AuthManager.logout(); location.reload();" class="btn btn-outline-secondary btn-lg" style="margin: 5px;">
                                        <i class="fas fa-sign-out-alt"></i> Sair e escolher outra função
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                    
                    return; // Не робимо автоматичний редирект
                }
            }
            
            // Оouщуexisteмо сeрі dados se existe
            localStorage.removeItem('lm_session');
            localStorage.removeItem('lm_user');
            
            // Автоматичний submit se existe parâmetros в URL
            if (autoLoginRequested) {
                console.log('🚀 Автоматичний entrada através de 500ms...');
                setTimeout(() => {
                    console.log('📤 Відправка форми loginу...');
                    loginForm.requestSubmit();
                }, 500);
            }
            
            // Função перенаправлення за ролями (ГЛОБАЛЬНА)
            window.redirectUserByRole = function(role) {
                // Оouщуexisteмо sessionStorage após редиректу
                setTimeout(() => sessionStorage.removeItem('redirecting'), 100);
                
                // Виutilizовуexisteмо АБСОЛЮТНІ шляхи від кореня сайту
                switch (role) {
                    case 'admin':
                        window.location.replace('/pages/admin/admin-dashboard.html');
                        break;
                    case 'dispatcher':
                        window.location.replace('/pages/dispatcher/dashboard.html');
                        break;
                    case 'technician':
                    case 'tech':
                        window.location.replace('/pages/tech/dashboard.html');
                        break;
                    case 'client':
                        window.location.replace('/pages/client/dashboard.html');
                        break;
                    default:
                        window.location.replace('/pages/admin/admin-dashboard.html');
                }
            };
            
            // Continuar до панелі (para já авторизованих)
            function continueToPanel() {
                const user = AuthManager.getCurrentUser();
                if (user && user.role) {
                    sessionStorage.setItem('redirecting', 'true');
                    redirectUserByRole(user.role);
                }
            }
            
            // Sair e обрати іншу função
            function logoutAndChooseRole() {
                if (confirm('Tem a certeza que quer sair?')) {
                    AuthManager.logout();
                    location.reload();
                }
            }
            
            // Obter назву de função українською
            function getRoleName(role) {
                const roleNames = {
                    'admin': 'Administrador',
                    'dispatcher': 'Despachante',
                    'technician': 'Técnico',
                    'tech': 'Técnico',
                    'client': 'Cliente'
                };
                return roleNames[role] || role;
            }
            
            // Atéкаdesde повідомлень
            function showMessage(message, type = 'error') {
                let alertDiv = document.getElementById('login-message');
                if (!alertDiv) {
                    alertDiv = document.createElement('div');
                    alertDiv.id = 'login-message';
                    alertDiv.className = `alert alert-${type === 'error' ? 'danger' : 'success'}`;
                    loginForm.insertBefore(alertDiv, loginForm.firstChild);
                }
                
                alertDiv.textContent = message;
                alertDiv.style.display = 'block';
                
                // Автоматично ocultar através de 5 segundos
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
            
            // Processamento форми входу - ОСТАManutençãoЧНЕ ВИПРАВЛЕННЯ подвійного кліку
            let isSubmitting = false;
            let submitTimestamp = 0;
            
            const handleLogin = async (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                
                const now = Date.now();
                
                // ПОТРІЙНИЙ захист від подвійного кліку:
                // 1. Verificação прапорця
                // 2. Verificação data-атрибуe
                // 3. Verificação horaу осeннього submit (менше 1 segundosи = ігнор)
                if (isSubmitting || 
                    loginForm.dataset.processing === 'true' || 
                    (now - submitTimestamp) < 1000) {
                    console.log('⏸️ БЛОКУВАННЯ: Форма já обробляexisteться ou повторний клік занадто rapidamente');
                    return false;
                }
                
                // Всeновлюexisteмо todos прапорці
                isSubmitting = true;
                submitTimestamp = now;
                loginForm.dataset.processing = 'true';
                console.log('🔒 Форму DeАБЛОКОВАНО para обробки [' + new Date().toISOString() + ']');
                
                const submitButton = loginForm.querySelector('button[type="submit"]');
                const originalButtonText = submitButton.innerHTML;
                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrar...';
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                console.log('🔐 Форма loginу відправлена - v2.1.0 ' + new Date().toISOString());
                console.log('📝 Email:', email);
                console.log('🔑 Password length:', password ? password.length : 0);
                
                if (!email || !password) {
                    showMessage('Introduza o email e a palavra-passe');
                    isSubmitting = false;
                    loginForm.dataset.processing = 'false';
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalButtonText;
                    return false;
                }
                
                try {
                    console.log('🔐 Спроба входу para:', email);
                    
                    // Формування API URL para GitHub Codespaces e локальної розробки
                    let apiUrl;
                    const hostname = window.location.hostname;
                    
                    if (hostname.includes('.app.github.dev')) {
                        // GitHub Codespaces: unified-server на порту 5000
                        const baseUrl = window.location.protocol + '//' + hostname.replace(/(-\d+)(\.app\.github\.dev)/, '-5000$2');
                        apiUrl = baseUrl + '/api/auth/login';
                    } else if (window.location.port === '8080' || window.location.port === '3000' || window.location.hostname === 'localhost') {
                        // Локальна розробка - unified-server на порту 5000
                        apiUrl = 'http://localhost:5000/api/auth/login';
                    } else {
                        // Відносний шлях
                        apiUrl = '/api/auth/login';
                    }
                    
                    console.log('🌐 Pedido до:', apiUrl);
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            email: email,
                            password: password
                        })
                    });
                    
                    const data = await response.json();
                    console.log('📝 Resposta do servidor:', data);
                    console.log('✅ Response OK:', response.ok);
                    console.log('🔢 Status Code:', response.status);
                    
                    if (response.ok && data.success) {
                        // V2 API: отримуexisteмо token e user desde data
                        const token = data.data?.token || data.token;
                        const user = data.data?.user || data.user;
                        
                        console.log('💾 Deберігаю token:', token?.substring(0, 20) + '...');
                        console.log('👤 Deберігаю do utilizador:', user);
                        
                        // 🔄 Deберігаexisteмо refresh token para автоматичного atualização
                        const refreshToken = data.data?.refreshToken || data.refreshToken;
                        if (refreshToken) {
                            localStorage.setItem('liftmanager_refresh', refreshToken);
                            console.log('🔄 Refresh token guardado');
                        }
                        
                        // Deберігаexisteмо token у todosх формаeх para сумісності
                        localStorage.setItem('token', token);           // Головний token
                        localStorage.setItem('authToken', token);       // Для lifts-manager.js
                        localStorage.setItem('lm_token', token);        // Сeрий formato
                        localStorage.setItem('deapseak_token', token);  // V2 formato
                        localStorage.setItem('liftmanager_jwt', token); // AuthManager formato
                        
                        // Deберігаexisteмо do utilizador
                        localStorage.setItem('user', JSON.stringify(user));           // Головний
                        localStorage.setItem('userData', JSON.stringify(user));       // Для dispatcher/admin панелей
                        localStorage.setItem('lm_session', JSON.stringify(user));     // Сeрий formato
                        localStorage.setItem('liftmanager_user', JSON.stringify(user)); // AuthManager formato
                        
                        // ⚡ MULTI-TAB FIX: guardaмо também в sessionStorage (per-tab)
                        // Кожна вкладка матиме власний token → різні de função не конфліктують
                        sessionStorage.setItem('liftmanager_jwt', token);
                        sessionStorage.setItem('liftmanager_user', JSON.stringify(user));
                        
                        console.log('✅ Token guardado в localStorage + sessionStorage');
                        console.log('✅ userData guardado:', user.role, user.email);
                        
                        showMessage('Entrada com sucesso! A redirecionar...', 'success');
                        
                        // ⚠️ НЕ розблоковуexisteмо botão - utilizador перенаправляexisteться
                        // Це запобігаexiste повторному кліку під hora перенаправлення
                        
                        // Перевіряexisteмо ou existe збережене перенаправлення
                        const redirectUrl = sessionStorage.getItem('redirect_after_login');
                        
                        // 🔐 Se обліковий registo tem mustChangePassword — показуexisteмо модал
                        if (user.mustChangePassword) {
                            // Deберігаexisteмо, де após de alteração перейти
                            window.__mustChangeRedirectUrl  = redirectUrl;
                            window.__mustChangeUserRole     = user.role;
                            const modal = document.getElementById('mustChangePasswordModal');
                            if (modal) {
                                modal.style.display = 'flex';
                                document.getElementById('mcpEmail').value = user.email;
                                // Автозаповнюexisteмо atual palavra-passe — юзер agora mesmo його ввів
                                document.getElementById('mcpCurrent').value = document.getElementById('password').value;
                                showMessage('Bem-vindo! Por favor altere a sua palavra-passe temporária antes de começar.', 'warning');
                            }
                        } else {
                            // Normal entrada — перенаправляexisteмо através de 500мс
                            setTimeout(() => {
                                if (redirectUrl) {
                                    sessionStorage.removeItem('redirect_after_login');
                                    window.location.href = redirectUrl;
                                } else {
                                    redirectUserByRole(user.role);
                                }
                            }, 500);
                        }
                        
                    } else {
                        // Erro - розблоковуexisteмо форму
                        showMessage(data.message || 'Erro de login');
                        console.error('❌ Erro de login:', data);
                        isSubmitting = false;
                        loginForm.dataset.processing = 'false';
                        submitButton.disabled = false;
                        submitButton.innerHTML = originalButtonText;
                    }
                } catch (error) {
                    // Erro - розблоковуexisteмо форму
                    console.error('❌ Erro crítico входу:', error);
                    showMessage('Ocorreu um erro ao entrar. Verifique a ligação ao servidor.');
                    isSubmitting = false;
                    loginForm.dataset.processing = 'false';
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalButtonText;
                }
                
                return false;
            };
            
            // Прикріплюexisteмо обробник (ОДИН РАDe!)
            loginForm.removeEventListener('submit', handleLogin); // Видаляexisteмо попереdiasй se був
            loginForm.addEventListener('submit', handleLogin, { once: false }); // once: false mas desde ручним контролем
            
            // ДОДАТКОВИЙ захист: Блокуexisteмо botão submit при кліку
            const submitButton = loginForm.querySelector('button[type="submit"]');
            if (submitButton) {
                submitButton.addEventListener('click', function(e) {
                    if (isSubmitting || loginForm.dataset.processing === 'true') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        console.log('🚫 Клік bloqueado - форма já обробляexisteться');
                        return false;
                    }
                });
            }
            
            console.log('✅ Login form handler attached with double-click protection');
        }
        
        // Викликаexisteмо ініціалізацію imediatamente
        initLoginForm();
    </script>

    <!-- 🔐 Modal de alteração obrigatória de palavra-passe -->
    <div id="mustChangePasswordModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:12px;padding:36px 32px;max-width:440px;width:94%;box-shadow:0 8px 32px rgba(0,0,0,.25)">
        <div style="text-align:center;margin-bottom:20px">
          <span style="font-size:40px">🔐</span>
          <h3 style="color:#1a237e;margin:8px 0 4px">Altere a sua palavra-passe</h3>
          <p style="color:#666;font-size:14px;margin:0">A sua conta foi criada com uma palavra-passe temporária.<br>Por segurança, defina uma palavra-passe pessoal antes de continuar.</p>
        </div>
        <div id="mcpError" style="display:none;background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:10px 14px;margin-bottom:14px;color:#856404;font-size:14px"></div>
        <div style="margin-bottom:14px">
          <label style="font-weight:600;font-size:14px;color:#333">Palavra-passe temporária (que usou para entrar)</label>
          <input type="password" id="mcpCurrent" class="form-control" placeholder="Palavra-passe temporária" style="margin-top:5px">
        </div>
        <div style="margin-bottom:14px">
          <label style="font-weight:600;font-size:14px;color:#333">Nova palavra-passe</label>
          <input type="password" id="mcpNew" class="form-control" placeholder="Mínimo 8 caracteres" style="margin-top:5px">
        </div>
        <div style="margin-bottom:20px">
          <label style="font-weight:600;font-size:14px;color:#333">Confirmar nova palavra-passe</label>
          <input type="password" id="mcpConfirm" class="form-control" placeholder="Repita a nova palavra-passe" style="margin-top:5px">
        </div>
        <input type="hidden" id="mcpEmail">
        <button id="mcpSubmitBtn" onclick="submitMustChangePassword()" style="width:100%;background:#1565c0;color:#fff;border:none;border-radius:6px;padding:13px;font-size:16px;font-weight:bold;cursor:pointer">
          🔐 Guardar nova palavra-passe
        </button>
      </div>
    </div>

    <script>
    async function submitMustChangePassword() {
        const currentPwd = document.getElementById('mcpCurrent').value.trim();
        const newPwd     = document.getElementById('mcpNew').value.trim();
        const confirmPwd = document.getElementById('mcpConfirm').value.trim();
        const errBox     = document.getElementById('mcpError');
        const btn        = document.getElementById('mcpSubmitBtn');

        errBox.style.display = 'none';

        if (!currentPwd) { errBox.textContent = 'Introduza a palavra-passe temporária.'; errBox.style.display='block'; return; }
        if (newPwd.length < 8) { errBox.textContent = 'A nova palavra-passe deve ter pelo menos 8 caracteres.'; errBox.style.display='block'; return; }
        if (newPwd !== confirmPwd) { errBox.textContent = 'As palavras-passe não coincidem.'; errBox.style.display='block'; return; }
        if (newPwd === currentPwd) { errBox.textContent = 'A nova palavra-passe deve ser diferente da actual.'; errBox.style.display='block'; return; }

        btn.disabled = true;
        btn.textContent = 'A guardar...';

        const token = localStorage.getItem('authToken') || localStorage.getItem('token') || '';
        try {
            const res = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ currentPassword: currentPwd, newPassword: newPwd })
            });
            const data = await res.json();
            if (!res.ok || !data.success) {
                errBox.textContent = data.message || 'Erro ao alterar a palavra-passe.';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '🔐 Guardar nova palavra-passe';
                return;
            }

            // Sucesso — оновлюexisteмо userData в localStorage
            const storedUser = JSON.parse(localStorage.getItem('userData') || '{}');
            storedUser.mustChangePassword = false;
            ['userData','user','lm_session','liftmanager_user'].forEach(k => localStorage.setItem(k, JSON.stringify(storedUser)));

            document.getElementById('mustChangePasswordModal').style.display = 'none';
            // Перенаправляexisteмо
            const redirectUrl = window.__mustChangeRedirectUrl;
            setTimeout(() => {
                if (redirectUrl) { sessionStorage.removeItem('redirect_after_login'); window.location.href = redirectUrl; }
                else { redirectUserByRole(window.__mustChangeUserRole); }
            }, 300);
        } catch(e) {
            errBox.textContent = 'Erro de rede. Tente novamente.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '🔐 Guardar nova palavra-passe';
        }
    }
    </script>
<script src="../../assets/js/monitor.js"></script>
</body>
</html>
