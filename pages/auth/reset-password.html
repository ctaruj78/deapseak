<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Palavra-passe - FestLift</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="/plugins/adminlte/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/plugins/bootstrap/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body class="hold-transition login-page bg-light">
    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="../../index.html"><i class="fas fa-elevator text-primary"></i> <b>FestLift</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Redefinição de palavra-passe</h3>
            </div>
            <div class="card-body">
                <p class="login-box-msg">Introduza a nova palavra-passe para a sua conta.</p>
                
                <form id="reset-password-form">
                    <div class="input-group mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Nova palavra-passe" required minlength="6" autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    
                    <div class="input-group mb-3">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirmar palavra-passe" required minlength="6">
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    
                    <div class="alert alert-danger" id="reset-error" style="display: none;"></div>
                    <div class="alert alert-success" id="reset-success" style="display: none;"></div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-check"></i> Alterar palavra-passe
                    </button>
                </form>
                
                <div class="mt-3 text-center">
                    <span><a href="login.html"><i class="fas fa-arrow-left"></i> Voltar ao login</a></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- AdminLTE JS -->
    <script src="/plugins/adminlte/adminlte.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="/plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    
    <script>
        $(document).ready(function() {
            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                $('#reset-error').text('Link inválido para redefinição de palavra-passe').show();
                $('#reset-password-form').find('input, button').prop('disabled', true);
                return;
            }
            
            $('#reset-password-form').on('submit', async function(e) {
                e.preventDefault();
                
                const password = $('#password').val();
                const confirmPassword = $('#confirmPassword').val();
                const submitBtn = $(this).find('button[type="submit"]');
                
                // Validate passwords match
                if (password !== confirmPassword) {
                    $('#reset-error').text('As palavras-passe não coincidem').show();
                    $('#reset-success').hide();
                    return;
                }
                
                // Validate password length
                if (password.length < 6) {
                    $('#reset-error').text('A palavra-passe deve ter pelo menos 6 caracteres').show();
                    $('#reset-success').hide();
                    return;
                }
                
                // Disable button during request
                submitBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> A alterar...');
                
                try {
                    const response = await fetch(`${API_CONFIG.BASE_URL}/auth/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            token: token,
                            password: password 
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        $('#reset-success').text(data.message || 'Palavra-passe alterada com sucesso! A redirecionar para o login...').show();
                        $('#reset-error').hide();
                        $('#password, #confirmPassword').val(''); // Clear inputs
                        
                        // Redirect to login after 3 seconds
                        setTimeout(() => {
                            window.location.replace('/pages/auth/login.html');
                        }, 3000);
                    } else {
                        $('#reset-error').text(data.message || 'Ocorreu um erro. O link pode ser inválido ou ter expirado.').show();
                        $('#reset-success').hide();
                        submitBtn.prop('disabled', false).html('<i class="fas fa-check"></i> Alterar palavra-passe');
                    }
                } catch (error) {
                    console.error('Reset password error:', error);
                    $('#reset-error').text('Ocorreu um erro. Verifique a ligação à rede.').show();
                    $('#reset-success').hide();
                    submitBtn.prop('disabled', false).html('<i class="fas fa-check"></i> Alterar palavra-passe');
                }
            });
            
            // Real-time password match validation
            $('#confirmPassword').on('input', function() {
                const password = $('#password').val();
                const confirmPassword = $(this).val();
                
                if (confirmPassword && password !== confirmPassword) {
                    $(this).addClass('is-invalid');
                } else {
                    $(this).removeClass('is-invalid');
                }
            });
        });
    </script>
<script src="../../assets/js/monitor.js"></script>
</body>
</html>
