<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення пароля - Lift Management System</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../../assets/img/logo.png" alt="Lift Management System">
                <h1>Відновлення пароля</h1>
                <p>Введіть вашу електронну пошту для відновлення пароля</p>
            </div>

            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Електронна пошта</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Надіслати інструкції</button>
            </form>

            <div class="auth-footer">
                <p>Пам'ятаєте пароль? <a href="login.html">Увійти</a></p>
            </div>
        </div>
    </div>

    <div class="auth-notification" id="successMessage" style="display: none;">
        <div class="notification-content">
            <span class="icon">✅</span>
            <p>Інструкції щодо відновлення пароля були відправлені на вашу електронну пошту.</p>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
</body>
</html>
