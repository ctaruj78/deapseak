<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення паролю - FestLift</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="/plugins/adminlte/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/plugins/bootstrap/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body class="hold-transition login-page bg-light">
    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="../../index.html"><i class="fas fa-elevator text-primary"></i> <b>FestLift</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Відновлення паролю</h3>
            </div>
            <div class="card-body">
                <p class="login-box-msg">Якщо ви забули пароль, зверніться до адміністратора системи для отримання нового тимчасового паролю.</p>
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i> <strong>Примітка:</strong> Відновлення паролю здійснюється лише через адміністратора системи з міркувань безпеки.
                </div>
                
                <form id="forgot-password-form" style="display: none;">                
                    <div class="input-group mb-3">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Електронна пошта" required autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
                        </div>
                    </div>
                    
                    <div class="alert alert-danger" id="forgot-error" style="display: none;"></div>
                    <div class="alert alert-success" id="forgot-success" style="display: none;"></div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-paper-plane"></i> Надіслати інструкції
                    </button>
                </form>
                
                <div class="mt-3 text-center">
                    <span><a href="login.html"><i class="fas fa-arrow-left"></i> Повернутися до входу</a></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- AdminLTE JS -->
    <script src="/plugins/adminlte/adminlte.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="/plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    
    <script>
        $(document).ready(function() {
            $('#forgot-password-form').on('submit', async function(e) {
                e.preventDefault();
                
                const email = $('#email').val();
                const submitBtn = $(this).find('button[type="submit"]');
                
                // Disable button during request
                submitBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Надсилання...');
                
                try {
                    const response = await fetch(`${API_CONFIG.BASE_URL}/auth/forgot-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        $('#forgot-success').text(data.message || 'Інструкції з відновлення паролю надіслано на вашу електронну адресу').show();
                        $('#forgot-error').hide();
                        $('#email').val(''); // Clear input
                    } else {
                        $('#forgot-error').text(data.message || 'Сталася помилка. Спробуйте пізніше.').show();
                        $('#forgot-success').hide();
                    }
                } catch (error) {
                    console.error('Forgot password error:', error);
                    $('#forgot-error').text('Сталася помилка. Перевірте підключення до мережі.').show();
                    $('#forgot-success').hide();
                } finally {
                    // Re-enable button
                    submitBtn.prop('disabled', false).html('<i class="fas fa-paper-plane"></i> Надіслати інструкції');
                }
            });
        });
    </script>
</body>
</html>
