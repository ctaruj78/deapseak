<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - LiftMaster Pro</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <style>
        .login-logo a {
            color: #007bff;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .register-box {
            width: 450px;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0069d9;
            border-color: #0062cc;
        }
        .select2-container--default .select2-selection--single {
            height: calc(2.25rem + 2px);
            line-height: 1.5;
            padding: .375rem .75rem;
        }
    </style>
</head>
<body class="hold-transition register-page bg-light">
    <div class="register-box">
        <div class="login-logo mb-4">
            <a href="../../index.html"><i class="fas fa-elevator text-primary"></i> <b>LiftMaster Pro</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Реєстрація в системі</h3>
            </div>
            <div class="card-body">
                <form id="register-form">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="input-group mb-3">
                                <input type="text" id="firstName" name="firstName" class="form-control" placeholder="Ім'я" required>
                                <div class="input-group-append">
                                    <div class="input-group-text"><span class="fas fa-user"></span></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="input-group mb-3">
                                <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Прізвище" required>
                                <div class="input-group-append">
                                    <div class="input-group-text"><span class="fas fa-user"></span></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Електронна пошта" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Логін" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-user-circle"></span></div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Пароль" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Підтвердіть пароль" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    
                    <div class="input-group mb-3">
                        <select id="role" name="role" class="form-control" required>
                            <option value="" selected disabled>Оберіть вашу роль</option>
                            <option value="dispatcher">Диспетчер</option>
                            <option value="technician">Технік</option>
                            <option value="client">Клієнт</option>
                        </select>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-user-tag"></span></div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="Номер телефону" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-phone"></span></div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-8">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                                <label class="form-check-label" for="terms">
                                    Я погоджуюсь з <a href="#">умовами використання</a>
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="alert alert-danger" id="register-error" style="display: none;"></div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-user-plus"></i> Зареєструватися
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <span>Вже маєте обліковий запис? <a href="login.html">Увійти</a></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- AdminLTE JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    
    <script>
        $(document).ready(function() {
            let isProcessing = false; // Прапорець обробки
            
            // Проверка на совпадение паролей
            $('#register-form').on('submit', function(e) {
                e.preventDefault();
                e.stopPropagation(); // Зупиняємо поширення події
                
                // Перевіряємо чи форма вже обробляється
                if (isProcessing) {
                    console.log('⏸️ Форма вже обробляється, ігноруємо повторний submit');
                    return;
                }
                
                isProcessing = true;
                const $submitButton = $(this).find('button[type="submit"]');
                const originalButtonText = $submitButton.html();
                $submitButton.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Реєстрація...');
                
                const password = $('#password').val();
                const confirmPassword = $('#confirmPassword').val();
                
                if (password !== confirmPassword) {
                    $('#register-error').text('Паролі не співпадають!').show();
                    isProcessing = false;
                    $submitButton.prop('disabled', false).html(originalButtonText);
                    return;
                }
                
                // Сбор данных формы
                const formData = {
                    firstName: $('#firstName').val(),
                    lastName: $('#lastName').val(),
                    email: $('#email').val(),
                    username: $('#username').val(),
                    password: password,
                    role: $('#role').val(),
                    phone: $('#phone').val()
                };
                
                // Если мы в режиме разработки, используем локальное хранилище
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    // Простая симуляция регистрации
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    
                    // Проверка существующего пользователя
                    const userExists = users.some(user => user.username === formData.username || user.email === formData.email);
                    
                    if (userExists) {
                        $('#register-error').text('Користувач з таким логіном або email вже існує!').show();
                        isProcessing = false;
                        $submitButton.prop('disabled', false).html(originalButtonText);
                        return;
                    }
                    
                    // Добавляем пользователя в "базу данных"
                    formData.id = Date.now();
                    users.push(formData);
                    localStorage.setItem('users', JSON.stringify(users));
                    
                    alert('Реєстрація успішна! Тепер ви можете увійти в систему.');
                    window.location.href = 'login.html';
                } else {
                    // Реальный API запрос для регистрации
                    $.ajax({
                        url: '/api/register',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(formData),
                        success: function(response) {
                            if (response.success) {
                                alert('Реєстрація успішна! Тепер ви можете увійти в систему.');
                                window.location.href = 'login.html';
                            } else {
                                $('#register-error').text(response.message || 'Помилка реєстрації').show();
                            }
                        },
                        error: function(xhr) {
                            const message = xhr.responseJSON && xhr.responseJSON.message 
                                ? xhr.responseJSON.message 
                                : 'Сталася помилка під час реєстрації. Спробуйте пізніше.';
                            $('#register-error').text(message).show();
                        },
                        complete: function() {
                            isProcessing = false;
                            $submitButton.prop('disabled', false).html(originalButtonText);
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
