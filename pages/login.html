<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | LiftMaster Pro</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../plugins/fontawesome-free/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="index.html"><b>LiftMaster</b> Pro</a>
        </div>
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Введіть дані для входу</p>
                <form action="#" method="post">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="Логін" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" placeholder="Пароль" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-8">
                            <div class="icheck-primary">
                                <input type="checkbox" id="remember">
                                <label for="remember">Запам'ятати мене</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <button type="submit" class="btn btn-primary btn-block">Вхід</button>
                        </div>
                    </div>
                </form>
                <p class="mb-1 mt-3">
                    <a href="#">Забули пароль?</a>
                </p>
            </div>
        </div>
    </div>
    <footer class="main-footer text-center mt-4">
        <strong>&copy; 2025 LiftMaster Pro.</strong> Всі права захищені.
    </footer>
</body>
</html>
