<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeapSeaK - Універсальна CRM система</title>
    
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    
    <!-- Sweet Alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .crm-container {
            min-height: 100vh;
        }
        
        .content-wrapper {
            padding: 20px;
        }
        
        .role-badge {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        
        .role-badge.admin {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }
        
        .role-badge.dispatcher {
            background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
            color: #212529;
        }
        
        .role-badge.tech {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
        }
        
        .stats-card {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stats-card:hover {
            transform: translateY(-5px);
        }
        
        .forbidden-content {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }
        
        .forbidden-content i {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
        }
        
        /* Responsive navigation */
        @media (max-width: 768px) {
            .sidebar-mini .main-sidebar {
                width: 250px;
            }
        }
        
        /* QR функції з різним доступом */
        .qr-admin-only {
            display: none;
        }
        
        .qr-dispatcher-only {
            display: none;
        }
        
        .qr-tech-only {
            display: none;
        }
    </style>
    <script src="/assets/js/token-manager.js"></script>
    <script src="/assets/js/auth-interceptor.js"></script>
</head>
<body class="hold-transition sidebar-mini">
    <div class="wrapper crm-container">
        <!-- Навігаційна панель -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button">
                        <i class="fas fa-bars"></i>
                    </a>
                </li>
                <li class="nav-item d-none d-sm-inline-block">
                    <a href="#" class="nav-link" onclick="loadDashboard()">Головна</a>
                </li>
            </ul>

            <ul class="navbar-nav ml-auto">
                <!-- Користувач -->
                <li class="nav-item dropdown">
                    <a class="nav-link" data-toggle="dropdown" href="#">
                        <i class="far fa-user"></i> 
                        <span id="current-username">Користувач</span>
                        <span id="current-role-badge" class="role-badge">Гість</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <span class="dropdown-item dropdown-header" id="user-info">Інформація користувача</span>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item" onclick="showProfile()">
                            <i class="fas fa-user mr-2"></i> Профіль
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt mr-2"></i> Вихід
                        </a>
                    </div>
                </li>
            </ul>
        </nav>

        <!-- Бічна панель -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <!-- Логотип -->
            <a href="#" class="brand-link" onclick="loadDashboard()">
                <i class="fas fa-elevator brand-image img-circle elevation-3" style="opacity: .8; margin-left: 10px;"></i>
                <span class="brand-text font-weight-light">DeapSeaK CRM</span>
            </a>

            <!-- Бічна панель -->
            <div class="sidebar">
                <!-- Панель користувача -->
                <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                    <div class="image">
                        <img src="https://via.placeholder.com/160x160" class="img-circle elevation-2" alt="User Image" id="user-avatar">
                    </div>
                    <div class="info">
                        <a href="#" class="d-block" id="sidebar-username">Завантаження...</a>
                        <small id="sidebar-role" class="text-success">Роль</small>
                    </div>
                </div>

                <!-- Меню навігації -->
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" id="main-navigation">
                        <!-- Меню буде сгенеровано динамічно через JavaScript -->
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Основний контент -->
        <div class="content-wrapper">
            <div id="main-content">
                <!-- Контент буде завантажено динамічно -->
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                </div>
            </div>
        </div>

        <!-- Футер -->
        <footer class="main-footer">
            <strong>DeapSeaK CRM &copy; 2025</strong> - Універсальна система управління ліфтами
            <div class="float-right d-none d-sm-inline-block">
                <b>Версія</b> 2.0 (Unified)
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    
    <!-- Нові модулі -->
    <script src="/assets/js/crm-navigation.js"></script>
    
    <script>
    // Ініціалізуємо систему після завантаження всіх скриптів
    $(document).ready(function() {
        // Перевірка авторизації
        const token = localStorage.getItem('authToken');
        const userData = localStorage.getItem('userData');
        
        if (!token || !userData) {
            window.location.href = '/login.html';
            return;
        }
        
        // Ініціалізація завершена через crm-navigation.js
        window.crmSystem = new CRMUnified();
        
        // Налаштовуємо toastr
        toastr.options = {
            closeButton: true,
            debug: false,
            newestOnTop: true,
            progressBar: true,
            positionClass: "toast-top-right",
            preventDuplicates: false,
            onclick: null,
            showDuration: "300",
            hideDuration: "1000",
            timeOut: "5000",
            extendedTimeOut: "1000",
            showEasing: "swing",
            hideEasing: "linear",
            showMethod: "fadeIn",
            hideMethod: "fadeOut"
        };
        
        // Обробник для оновлення даних
        window.addEventListener('crmDataUpdated', function() {
            // Оновлюємо інтерфейс при зміні даних
            if (window.crmSystem && typeof window.crmSystem.refreshCurrentModule === 'function') {
                window.crmSystem.refreshCurrentModule();
            }
        });
        
        console.log('CRM система повністю ініціалізована з менеджером даних');
    });
    </script>
</body>
</html>
