<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Асистент - LiftMaster Pro</title>
    <link rel="stylesheet" href="../../assets/css/ai-assistant.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="ai-chat-container">
        <div class="ai-chat-header">
            <h4>AI Асистент</h4>
            <button class="ai-chat-close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="ai-chat-messages">
            <div class="ai-message ai-message-assistant">
                <div class="ai-message-content">
                    <div class="ai-message-text">Привіт! Я ваш AI асистент. Чим можу допомогти?</div>
                    <div class="ai-message-time">Зараз</div>
                </div>
            </div>
        </div>
        
        <div class="ai-chat-input">
            <textarea class="ai-message-input" placeholder="Напишіть повідомлення..."></textarea>
            <div class="ai-chat-actions">
                <button class="ai-send-message">
                    <i class="fas fa-paper-plane"></i> Надіслати
                </button>
                <button class="ai-voice-toggle">
                    <i class="fas fa-microphone"></i> Голос
                </button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/modules/ai-assistant.js"></script>
    <script>
        // Додатковий функціонал для сторінки асистента
        document.querySelector('.ai-chat-close').addEventListener('click', function() {
            window.history.back();
        });

        document.querySelector('.ai-voice-toggle').addEventListener('click', function() {
            if (aiAssistant) {
                aiAssistant.toggleListening();
                this.classList.toggle('listening', aiAssistant.isListening);
            }
        });

        document.querySelector('.ai-send-message').addEventListener('click', function() {
            const input = document.querySelector('.ai-message-input');
            if (input.value.trim()) {
                aiAssistant.processCommand(input.value.trim());
                input.value = '';
            }
        });

        // Enter для відправки повідомлення
        document.querySelector('.ai-message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.querySelector('.ai-send-message').click();
            }
        });
    </script>
</body>
</html>
