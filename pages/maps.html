<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de elevadores</title>
    <script src="../assets/js/auth.js"></script>

    <link rel="stylesheet" href="../plugins/adminlte/adminlte.min.css">
    <link rel="stylesheet" href="../plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #liftsMap { height: 70vh; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
        <!-- Painel de navegação -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
            </ul>
        </nav>
        <!-- Barra lateral -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="/pages/admin/admin-dashboard.html" class="brand-link">
                <span class="brand-text font-weight-light">Lift Management</span>
            </a>
            <div class="sidebar">
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                        <li class="nav-item"><a href="/pages/admin/admin-dashboard.html" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>Dashboard</p></a></li>
                        <li class="nav-item"><a href="/pages/admin/lifts.html" class="nav-link"><i class="nav-icon fas fa-elevator"></i><p>Elevadores</p></a></li>
                        <li class="nav-item"><a href="/pages/maps.html" class="nav-link active"><i class="nav-icon fas fa-map-marked-alt"></i><p>Mapa de elevadores</p></a></li>
                        <li class="nav-item"><a href="/pages/admin/users.html" class="nav-link"><i class="nav-icon fas fa-users"></i><p>Utilizadores</p></a></li>
                        <li class="nav-item"><a href="/pages/admin/reports.html" class="nav-link"><i class="nav-icon fas fa-chart-bar"></i><p>Relatórios</p></a></li>
                        <li class="nav-item"><a href="/pages/admin/settings.html" class="nav-link"><i class="nav-icon fas fa-cog"></i><p>Configurações</p></a></li>
                        <li class="nav-item"><a href="/pages/admin/profile.html" class="nav-link"><i class="nav-icon fas fa-user"></i><p>Perfil</p></a></li>
                        <li class="nav-item"><a href="#" class="nav-link" onclick="logout()"><i class="nav-icon fas fa-sign-out-alt"></i><p>Sair</p></a></li>
                    </ul>
                </nav>
            </div>
        </aside>
        <!-- Conteúdo -->
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6"><h1>Mapa de elevadores</h1></div>
                    </div>
                </div>
            </section>
            <section class="content">
                <div class="card">
                    <div class="card-body">
                        <div id="liftsMap"></div>
                        <div class="mt-3 d-flex justify-content-between align-items-center">
                            <div>
                                <button id="btnRefreshMap" class="btn btn-secondary">
                                    <i class="fas fa-sync-alt"></i> Actualizar mapa
                                </button>
                                <small class="text-muted ml-2">Última actualização: <span id="lastUpdate">agora</span></small>
                            </div>
                            <div>
                                <label for="addressInput" class="mb-0">Determinar coordenadas por endereço:</label>
                            </div>
                        </div>
                        <div class="mt-2">
                            <div class="input-group" style="max-width:400px;">
                                <input type="text" id="addressInput" class="form-control" placeholder="Introduza o endereço...">
                                <div class="input-group-append">
                                    <button id="btnGeocode" class="btn btn-success">
                                        <i class="fas fa-search"></i> Pesquisar
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label for="routeToLift">Traçar rota para o elevador:</label>
                            <div class="input-group" style="max-width:500px;">
                                <select id="routeToLift" class="form-control">
                                    <option value="">Selecione o elevador...</option>
                                </select>
                                <div class="input-group-append">
                                    <button id="btnRoute" class="btn btn-primary">
                                        <i class="fas fa-route"></i> Mostrar rota
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="../plugins/jquery/jquery.min.js"></script>
    <script src="../plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../plugins/adminlte/adminlte.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/assets/js/modules/map.js"></script>
    <script src="/assets/js/maps.js"></script>
<script src="../../assets/js/monitor.js"></script>
<script></script>
</body>
</html>
