<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мапа ліфтів</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #liftsMap { height: 70vh; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
        <!-- Навігаційна панель -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
            </ul>
        </nav>
        <!-- Бічна панель -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="admin-dashboard.html" class="brand-link">
                <span class="brand-text font-weight-light">Lift Management</span>
            </a>
            <div class="sidebar">
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                        <li class="nav-item"><a href="admin/admin-dashboard.html" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>Дашборд</p></a></li>
                        <li class="nav-item"><a href="admin/lifts.html" class="nav-link"><i class="nav-icon fas fa-elevator"></i><p>Ліфти</p></a></li>
                        <li class="nav-item"><a href="maps.html" class="nav-link active"><i class="nav-icon fas fa-map-marked-alt"></i><p>Мапа ліфтів</p></a></li>
                        <li class="nav-item"><a href="admin/users.html" class="nav-link"><i class="nav-icon fas fa-users"></i><p>Користувачі</p></a></li>
                        <li class="nav-item"><a href="admin/reports.html" class="nav-link"><i class="nav-icon fas fa-chart-bar"></i><p>Звіти</p></a></li>
                        <li class="nav-item"><a href="admin/settings.html" class="nav-link"><i class="nav-icon fas fa-cog"></i><p>Налаштування</p></a></li>
                        <li class="nav-item"><a href="admin/profile.html" class="nav-link"><i class="nav-icon fas fa-user"></i><p>Профіль</p></a></li>
                        <li class="nav-item"><a href="#" class="nav-link" onclick="logout()"><i class="nav-icon fas fa-sign-out-alt"></i><p>Вийти</p></a></li>
                    </ul>
                </nav>
            </div>
        </aside>
        <!-- Контент -->
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6"><h1>Мапа ліфтів</h1></div>
                    </div>
                </div>
            </section>
            <section class="content">
                <div class="card">
                    <div class="card-body">
                        <div id="liftsMap"></div>
                        <div class="mt-3 d-flex justify-content-between align-items-center">
                            <div>
                                <button id="btnRefreshMap" class="btn btn-secondary">
                                    <i class="fas fa-sync-alt"></i> Оновити карту
                                </button>
                                <small class="text-muted ml-2">Останнє оновлення: <span id="lastUpdate">зараз</span></small>
                            </div>
                            <div>
                                <label for="addressInput" class="mb-0">Визначити координати по адресі:</label>
                            </div>
                        </div>
                        <div class="mt-2">
                            <div class="input-group" style="max-width:400px;">
                                <input type="text" id="addressInput" class="form-control" placeholder="Введіть адресу...">
                                <div class="input-group-append">
                                    <button id="btnGeocode" class="btn btn-success">
                                        <i class="fas fa-search"></i> Пошук
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label for="routeToLift">Прокласти маршрут до ліфта:</label>
                            <div class="input-group" style="max-width:500px;">
                                <select id="routeToLift" class="form-control">
                                    <option value="">Оберіть ліфт...</option>
                                </select>
                                <div class="input-group-append">
                                    <button id="btnRoute" class="btn btn-primary">
                                        <i class="fas fa-route"></i> Показати маршрут
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/assets/js/modules/map.js"></script>
    <script src="/assets/js/maps.js"></script>
</body>
</html>
