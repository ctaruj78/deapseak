<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Importação de listas de verificação para inspeções</title>
    <script src="../../assets/js/auth.js"></script>

    <link rel="stylesheet" href="../../plugins/adminlte/adminlte.min.css">
    <link rel="stylesheet" href="../../plugins/bootstrap/bootstrap.min.css">
    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/bootstrap.bundle.min.js"></script>
</head>
<body class="hold-transition sidebar-mini" data-required-role="admin">
    <div class="wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>Importação de listas de verificação para inspeções</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div class="card">
                    <div class="card-header">
                        <input type="file" id="checklistFile" accept=".json,.csv" class="form-control-file">
                        <button class="btn btn-primary" id="importBtn">Importar</button>
                    </div>
                    <div class="card-body">
                        <h5>Listas de verificação importadas:</h5>
                        <ul id="checklistsList" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script>
    $(document).ready(function() {
        function renderChecklists() {
            const checklists = JSON.parse(localStorage.getItem('imported_checklists') || '[]');
            const list = $('#checklistsList');
            list.empty();
            checklists.forEach((cl, idx) => {
                list.append(`<li class="list-group-item">${cl.title || cl.name || 'Sem título'} (${cl.items ? cl.items.length : 0} itens)</li>`);
            });
        }
        renderChecklists();
        $('#importBtn').click(function() {
            const fileInput = document.getElementById('checklistFile');
            const file = fileInput.files[0];
            if (!file) {
                alert('Selecione ficheiro para importar');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                let imported = [];
                try {
                    if (file.name.endsWith('.json')) {
                        imported = JSON.parse(e.target.result);
                    } else if (file.name.endsWith('.csv')) {
                        imported = csvToChecklists(e.target.result);
                    }
                    if (!Array.isArray(imported)) imported = [imported];
                    const checklists = JSON.parse(localStorage.getItem('imported_checklists') || '[]');
                    localStorage.setItem('imported_checklists', JSON.stringify([...checklists, ...imported]));
                    renderChecklists();
                    alert('Listas de verificação importadas com sucesso!');
                } catch (err) {
                    alert('Erro de importação: ' + err.message);
                }
            };
            reader.readAsText(file);
        });
        function csvToChecklists(csv) {
            const lines = csv.split('\n').filter(Boolean);
            const items = lines.map(line => ({ item: line.trim() }));
            return [{ title: 'CSV lista de verificação', items }];
        }
    });
    </script>
</body>
</html>
