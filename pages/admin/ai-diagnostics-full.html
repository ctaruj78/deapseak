<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Diagnóstico de previsão IA</title>
    <script src="../../assets/js/auth.js"></script>

    <link rel="stylesheet" href="../../plugins/bootstrap/bootstrap.min.css">
    <script src="../../plugins/chart.js/chart.umd.min.js"></script>
    <style>
        .console-output {
            background: #1e1e1e;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .warning { color: #ffd43b; }
        .info { color: #74c0fc; }
    </style>
</head>
<body data-required-role="admin">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h1>🔍 Diagnóstico completo de previsão IA</h1>
                <p class="text-muted">Verificação de todos os componentes do sistema de IA</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>📋 Ações de teste</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary btn-sm mb-2" onclick="checkScripts()">1. Verificar scripts</button><br>
                        <button class="btn btn-info btn-sm mb-2" onclick="checkClasses()">2. Verificar classes</button><br>
                        <button class="btn btn-success btn-sm mb-2" onclick="testInitialization()">3. Teste de inicialização</button><br>
                        <button class="btn btn-warning btn-sm mb-2" onclick="testChart()">4. Teste de gráfico</button><br>
                        <button class="btn btn-secondary btn-sm mb-2" onclick="simulateOriginalPage()">5. Simular original</button><br>
                        <hr>
                        <button class="btn btn-danger btn-sm" onclick="clearConsole()">Limpar consola</button>
                    </div>
                </div>

                <!-- Zona de teste para o gráfico -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h6>📊 Gráfico de teste</h6>
                    </div>
                    <div class="card-body">
                        <canvas id="test-prediction-chart" height="200"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>🖥️ Saída da consola</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="console" class="console-output"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recomendações de IA de teste -->
        <div class="row mt-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>🤖 Recomendações de IA de teste</h5>
                    </div>
                    <div class="card-body">
                        <div id="test-ai-recommendations">
                            <!-- Aqui estarão as recomendações -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Підchaveаexisteмо оригінальні скрипти -->
    <script src="../../assets/js/predictive-maintenance.js"></script>
    <script src="../../assets/js/unified-analytics-engine.js"></script>

    <script>
        let logCount = 0;
        
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const time = new Date().toLocaleTimeString();
            const className = type;
            logCount++;
            
            const logLine = document.createElement('div');
            logLine.className = className;
            logLine.innerHTML = `[${logCount}] ${time} - ${message}`;
            
            console.appendChild(logLine);
            console.scrollTop = console.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            logCount = 0;
        }

        function checkScripts() {
            log('🔍 A verificar scripts carregados...', 'info');
            
            // Перевіряexisteмо наявність скриптів
            const scripts = document.querySelectorAll('script[src*="predictive-maintenance"], script[src*="unified-analytics-engine"]');
            log(`📜 Encontrado ${scripts.length} AI scripts`, scripts.length > 0 ? 'success' : 'error');
            
            scripts.forEach((script, i) => {
                log(`   ${i+1}. ${script.src}`, 'info');
            });
        }

        function checkClasses() {
            log('🏗️ A verificar a acessibilidade das classes...', 'info');
            
            // Перевіряexisteмо PredictiveMaintenanceSystem
            if (typeof PredictiveMaintenanceSystem !== 'undefined') {
                log('✅ PredictiveMaintenanceSystem - ENCONTRADO', 'success');
                
                try {
                    const testInstance = new PredictiveMaintenanceSystem();
                    log('✅ É possível criar uma instância de PredictiveMaintenanceSystem', 'success');
                    
                    // Перевіряexisteмо методи
                    const methods = ['init', 'generateRecommendations', 'getSystemPredictions'];
                    methods.forEach(method => {
                        if (typeof testInstance[method] === 'function') {
                            log(`✅ Método ${method}() - existe`, 'success');
                        } else {
                            log(`❌ Método ${method}() - ausente`, 'error');
                        }
                    });
                    
                } catch (error) {
                    log(`❌ Erro створення екземпляра: ${error.message}`, 'error');
                }
            } else {
                log('❌ PredictiveMaintenanceSystem - NÃO ENCONTRADO', 'error');
            }
            
            // Перевіряexisteмо глобальні функції
            const globalFunctions = ['initPredictiveAnalytics', 'activateAIPredictive'];
            globalFunctions.forEach(func => {
                if (typeof window[func] === 'function') {
                    log(`✅ Função ${func}() - existe`, 'success');
                } else {
                    log(`❌ Função ${func}() - ausente`, 'error');
                }
            });
        }

        function testInitialization() {
            log('🚀 Testeуexisteмо ініціалізацію do sistema...', 'info');
            
            try {
                if (typeof window.initPredictiveAnalytics === 'function') {
                    log('🔄 Викликаexisteмо initPredictiveAnalytics()...', 'info');
                    const result = window.initPredictiveAnalytics();
                    log(`📊 Resultado da inicialização: ${result}`, result ? 'success' : 'warning');
                } else {
                    log('❌ initPredictiveAnalytics não encontrado', 'error');
                }
                
                // Створюexisteмо екземпляр do sistema
                if (!window.testPredictiveSystem) {
                    log('🏗️ Створюexisteмо testeовий екземпляр do sistema...', 'info');
                    window.testPredictiveSystem = new PredictiveMaintenanceSystem();
                    log('✅ Instância de teste criada', 'success');
                }
                
            } catch (error) {
                log(`❌ Erro ініціалізації: ${error.message}`, 'error');
                console.error('Detalhada erro:', error);
            }
        }

        function testChart() {
            log('📊 Testeуexisteмо створення gráficoа...', 'info');
            
            try {
                const canvas = document.getElementById('test-prediction-chart');
                if (!canvas) {
                    log('❌ Canvas não encontrado', 'error');
                    return;
                }
                
                const ctx = canvas.getContext('2d');
                
                // Створюexisteмо testeові дані
                const data = {
                    labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
                    datasets: [{
                        label: 'Probabilidade de avaria (%)',
                        data: [Math.random()*50, Math.random()*50, Math.random()*50, Math.random()*50],
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                };
                
                new Chart(ctx, {
                    type: 'line',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Previsão de manutenção de teste'
                            }
                        }
                    }
                });
                
                log('✅ Gráfico de teste criado com sucesso', 'success');
                
                // Testeуexisteмо AI recomendações
                loadTestRecommendations();
                
            } catch (error) {
                log(`❌ Erro створення gráficoа: ${error.message}`, 'error');
            }
        }

        function loadTestRecommendations() {
            log('🤖 Заванeжуexisteмо testeові AI recomendações...', 'info');
            
            const container = document.getElementById('test-ai-recommendations');
            if (!container) {
                log('❌ Контейнер рекомендацій не encontrado', 'error');
                return;
            }
            
            const recommendations = [
                { type: 'danger', icon: '🚨', text: 'Crítico: Elevador #L003 requer inspecção imediata' },
                { type: 'warning', icon: '⚠️', text: 'Atenção: Manutenção planeada para de elevadores #L001, #L005 em 7 dias' },
                { type: 'info', icon: '💡', text: 'Sugestão: Identificada oportunidade de otimização energética' },
                { type: 'success', icon: '✅', text: 'Bem: Elevadores #L002, #L004 a funcionar de forma ótima' }
            ];
            
            const html = recommendations.map(rec => `
                <div class="alert alert-${rec.type} mb-2">
                    <strong>${rec.icon}</strong> ${rec.text}
                </div>
            `).join('');
            
            container.innerHTML = html;
            log('✅ AI recomendações carregado', 'success');
        }

        function simulateOriginalPage() {
            log('🔄 Симулюexisteмо роботу оригінальної da página...', 'info');
            
            // Симулюexisteмо carregamento da página desde хешем
            log('📍 Симулюexisteмо hash: #predictive-analytics', 'info');
            
            // Перевіряexisteмо чи спрацьовуexiste логіка
            if (window.location.hash === '#predictive-analytics' || true) {
                log('✅ Hash збігаexisteться, активуexisteмо AI separador', 'success');
                
                setTimeout(() => {
                    if (window.activateAIPredictive) {
                        log('🎯 Викликаexisteмо activateAIPredictive()...', 'info');
                        try {
                            const success = window.activateAIPredictive();
                            log(`📊 Resultado da ativação: ${success}`, success ? 'success' : 'warning');
                        } catch (error) {
                            log(`❌ Erro активації: ${error.message}`, 'error');
                        }
                    } else {
                        log('❌ activateAIPredictive não encontrado', 'error');
                    }
                }, 100);
            }
        }

        // Autoматичний запуск при заванeженні
        document.addEventListener('DOMContentLoaded', function() {
            log('🔄 Diagnóstico iniciado automaticamente...', 'info');
            setTimeout(() => checkScripts(), 500);
            setTimeout(() => checkClasses(), 1000);
            
            // Перехоплюexisteмо оригінальний console.log
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            
            console.log = function(...args) {
                log(`[console.log] ${args.join(' ')}`, 'info');
                originalLog.apply(console, args);
            };
            
            console.error = function(...args) {
                log(`[console.error] ${args.join(' ')}`, 'error');
                originalError.apply(console, args);
            };
            
            console.warn = function(...args) {
                log(`[console.warn] ${args.join(' ')}`, 'warning');
                originalWarn.apply(console, args);
            };
        });
    </script>
</body>
</html>
