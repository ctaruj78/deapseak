<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <title>Registo de segurança</title>
    <script src="../../assets/js/auth.js"></script>

    <link rel="stylesheet" href="../../plugins/adminlte/adminlte.min.css">
    <link rel="stylesheet" href="../../plugins/bootstrap/bootstrap.min.css">
    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/modules/role-manager.js"></script>
</head>
<body class="hold-transition sidebar-mini" data-required-role="admin">
    <div class="wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>Registo de segurança (Audit Log)</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div class="card">
                    <div class="card-header">
                        <button class="btn btn-info" id="exportAuditBtn">Exportar registo</button>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered" id="auditTable">
                            <thead>
                                <tr>
                                    <th>Data/hora</th>
                                    <th>Utilizador</th>
                                    <th>Papel</th>
                                    <th>Operação</th>
                                    <th>Detalhes</th>
                                    <th>IP</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dinamicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script>
    $(document).ready(function() {
        function renderAuditTable() {
            const auditLog = JSON.parse(localStorage.getItem('audit_log') || '[]');
            const tbody = $('#auditTable tbody');
            tbody.empty();
            auditLog.slice().reverse().forEach(entry => {
                tbody.append(`
                    <tr>
                        <td>${entry.timestamp}</td>
                        <td>${entry.user}</td>
                        <td>${entry.role}</td>
                        <td>${entry.operation}</td>
                        <td>${entry.details || ''}</td>
                        <td>${entry.ip}</td>
                    </tr>
                `);
            });
        }
        renderAuditTable();
        $('#exportAuditBtn').click(function() {
            const auditLog = localStorage.getItem('audit_log') || '[]';
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(auditLog);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'audit-log.json');
            linkElement.click();
        });
    });
    </script>
<script src="../../assets/js/monitor.js"></script>
<script></script>
</body>
</html>
