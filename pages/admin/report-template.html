<!-- Functional Report Template Page -->
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаблон звіту</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
                <li class="nav-item d-none d-sm-inline-block">
                    <a href="admin-dashboard.html" class="nav-link">Головна</a>
                </li>
            </ul>
        </nav>
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="admin-dashboard.html" class="brand-link">
                <span class="brand-text font-weight-light">LiftMaster Pro</span>
            </a>
            <div class="sidebar">
                <!-- ...existing sidebar... -->
            </div>
        </aside>
        <div class="content-wrapper">
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">Шаблон звіту</h1>
                        </div>
                    </div>
                </div>
            </div>
            <section class="content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Форма звіту</h3>
                        </div>
                        <div class="card-body">
                            <form id="reportForm">
                                <div class="form-group">
                                    <label for="reportTitle">Заголовок звіту</label>
                                    <input type="text" class="form-control" id="reportTitle" required>
                                </div>
                                <div class="form-group">
                                    <label for="reportDate">Дата звіту</label>
                                    <input type="date" class="form-control" id="reportDate" required>
                                </div>
                                <div class="form-group">
                                    <label for="reportContent">Зміст</label>
                                    <textarea class="form-control" id="reportContent" rows="6" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-warning">Зберегти</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <footer class="main-footer">
            <strong>Copyright &copy; 2024 <a href="admin-dashboard.html">LiftMaster Pro</a>.</strong>
        </footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

    <!-- Load sidebar dynamically -->
    <script>
        $(document).ready(function() {
            $(".main-sidebar").load("includes/sidebar.html");
        });
    </script>
    <script src="../../assets/js/modules/report-template.js"></script>
    <!-- AI Assistant Widget -->
    <script src="/components/ai-widget.js"></script>
</body>
</html>
