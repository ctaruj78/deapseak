<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <title>Gestão de funções</title>
    <script src="../../plugins/sweetalert2/js/sweetalert2.min.js"></script>
    <script src="../../assets/js/auth.js"></script>

    <link rel="stylesheet" href="../../plugins/adminlte/adminlte.min.css">
    <link rel="stylesheet" href="../../plugins/bootstrap/bootstrap.min.css">
    <script src="../../plugins/jquery/jquery.min.js"></script>
    <script src="../../plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/modules/role-manager.js"></script>
</head>
<body class="hold-transition sidebar-mini" data-required-role="admin">
    <div class="wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>Gestão de funções e permissões</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div class="card">
                    <div class="card-header">
                        <button class="btn btn-success" id="addRoleBtn">Adicionar função</button>
                        <button class="btn btn-info" id="exportRolesBtn">Exportar funções</button>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered" id="rolesTable">
                            <thead>
                                <tr>
                                    <th>Nome de função</th>
                                    <th>Permissões</th>
                                    <th>Elementos de UI</th>
                                    <th>Restrições</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dinamicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Janela modal para edição de função -->
                <div class="modal fade" id="roleModal" tabindex="-1" role="dialog">
                  <div class="modal-dialog" role="document">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h5 class="modal-title">Edição de função</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                          <span aria-hidden="true">&times;</span>
                        </button>
                      </div>
                      <div class="modal-body">
                        <form id="roleForm">
                          <div class="form-group">
                            <label for="roleName">Nome de função</label>
                            <input type="text" class="form-control" id="roleName" required>
                          </div>
                          <div class="form-group">
                            <label for="rolePermissions">Permissões (separado por vírgulas)</label>
                            <input type="text" class="form-control" id="rolePermissions">
                          </div>
                          <div class="form-group">
                            <label for="roleUI">Elementos de UI (separado por vírgulas)</label>
                            <input type="text" class="form-control" id="roleUI">
                          </div>
                          <div class="form-group">
                            <label for="roleRestrictions">Restrições (separado por vírgulas)</label>
                            <input type="text" class="form-control" id="roleRestrictions">
                          </div>
                          <button type="submit" class="btn btn-primary">Guardar</button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
            </div>
        </section>
    </div>
    <script>
    // ...existing code...
    $(document).ready(function() {
        function renderRolesTable() {
            const roles = window.roleManager.roles;
            const tbody = $('#rolesTable tbody');
            tbody.empty();
            Object.keys(roles).forEach(roleName => {
                const role = roles[roleName];
                tbody.append(`
                    <tr>
                        <td>${roleName}</td>
                        <td>${(role.permissions || []).join(', ')}</td>
                        <td>${(role.uiElements || []).join(', ')}</td>
                        <td>${(role.restrictions || []).join(', ')}</td>
                        <td>
                            <button class="btn btn-sm btn-info editRoleBtn" data-role="${roleName}">Editar</button>
                            <button class="btn btn-sm btn-danger deleteRoleBtn" data-role="${roleName}">Eliminar</button>
                        </td>
                    </tr>
                `);
            });
        }

        renderRolesTable();

        $('#addRoleBtn').click(function() {
            $('#roleForm')[0].reset();
            $('#roleModal').modal('show');
            $('#roleModal').data('editRole', null);
        });

        $(document).on('click', '.editRoleBtn', function() {
            const roleName = $(this).data('role');
            const role = window.roleManager.roles[roleName];
            $('#roleName').val(roleName);
            $('#rolePermissions').val((role.permissions || []).join(', '));
            $('#roleUI').val((role.uiElements || []).join(', '));
            $('#roleRestrictions').val((role.restrictions || []).join(', '));
            $('#roleModal').modal('show');
            $('#roleModal').data('editRole', roleName);
        });

        $(document).on('click', '.deleteRoleBtn', async function() {
            const roleName = $(this).data('role');
            if (await swalConfirm(`Eliminar função ${roleName}?`)) {
                delete window.roleManager.roles[roleName];
                renderRolesTable();
            }
        });

        $('#roleForm').submit(function(e) {
            e.preventDefault();
            const name = $('#roleName').val().trim();
            const permissions = $('#rolePermissions').val().split(',').map(s => s.trim()).filter(Boolean);
            const uiElements = $('#roleUI').val().split(',').map(s => s.trim()).filter(Boolean);
            const restrictions = $('#roleRestrictions').val().split(',').map(s => s.trim()).filter(Boolean);
            window.roleManager.roles[name] = {
                permissions,
                uiElements,
                restrictions
            };
            $('#roleModal').modal('hide');
            renderRolesTable();
        });

        $('#exportRolesBtn').click(function() {
            const dataStr = JSON.stringify(window.roleManager.roles, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'roles-export.json');
            linkElement.click();
        });
    });
    </script>
<script src="../../assets/js/monitor.js">
// swalConfirm — substitui confirm() nativo pelo Swal
async function swalConfirm(text, title = 'Confirmar') {
    const r = await Swal.fire({
        title,
        text,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e74c3c',
        cancelButtonColor: '#95a5a6',
        confirmButtonText: 'Confirmar',
        cancelButtonText: 'Cancelar'
    });
    return r.isConfirmed;
}
</script>
</body>
</html>
