    <script src="../plugins/chart.js/chart.umd.min.js"></script>
    
    <!-- jQuery -->
    <script src="../plugins/jquery/jquery.min.js"></script>
    
    <!-- MongoDB ObjectId Converter -->

    <!-- Toastr for notifications -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    
    <!-- Sweet Alert for better modals -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        .lift-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .lift-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-working { background-color: #28a745; }
        .status-maintenance { background-color: #ffc107; }
        .status-emergency { background-color: #dc3545; }
        .animated-counter {
            animation: countUp 2s ease-in-out;
        }
        @keyframes countUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .request-timeline {
            position: relative;
            padding-left: 30px;
        }
        .request-timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #dee2e6;
        }
        .request-timeline .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }
        .request-timeline .timeline-item::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007bff;
            border: 3px solid #fff;
            box-shadow: 0 0 0 3px #dee2e6;
        }
    </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">

<script>
// Клас для управління клієнтською системою
class ClientSystem {
    constructor() {
        this.clientData = {
            name: 'ЖК Центральний',
            lifts: 3,
            activeLifts: 3,
            nextMaintenance: '2024-12-15'
        };
        
        this.availableModules = [
            'dashboard',
            'my-lifts',
            'maintenance-schedule',
            'service-requests',
            'history',
            'invoices',
            'support',
            'ai-assistant',
            'profile',
            'settings'
        ];
        
        this.init();
    }
    
    init() {
        this.renderNavigation();
        this.loadDashboard();
        this.setupEventListeners();
        
        // Встановлюємо назву клієнта
        $('#client-name, #sidebar-client-name').text(this.clientData.name);
    }
    
    setupEventListeners() {
        // Автоматичне оновлення кожні 2 хвилини
        setInterval(() => {
            this.refreshData();
        }, 120000);
    }
    
    renderNavigation() {
        const navigationContainer = document.getElementById('client-navigation');
        navigationContainer.innerHTML = '';
        
        // Конфігурація модулів для клієнта
        const modules = {
            dashboard: {
                title: 'Головна панель',
                icon: 'fas fa-tachometer-alt',
                action: () => this.loadDashboard()
            },
            'my-lifts': {
                title: 'Мої ліфти',
                icon: 'fas fa-elevator',
                action: () => this.loadModule('my-lifts')
            },
            'maintenance-schedule': {
                title: 'Графік ТО',
                icon: 'fas fa-calendar-alt',
                action: () => this.loadModule('maintenance-schedule')
            },
            'service-requests': {
                title: 'Заявки на обслуговування',
                icon: 'fas fa-clipboard-list',
                action: () => this.loadModule('service-requests')
            },
            'history': {
                title: 'Історія обслуговування',
                icon: 'fas fa-history',
                action: () => this.loadModule('history')
            },
            'invoices': {
                title: 'Рахунки та оплата',
                icon: 'fas fa-file-invoice-dollar',
                action: () => this.loadModule('invoices')
            },
            'support': {
                title: 'Технічна підтримка',
                icon: 'fas fa-headset',
                action: () => this.loadModule('support')
            },
            'ai-assistant': {
                title: 'AI Асистент',
                icon: 'fas fa-robot',
                action: () => window.open('../ai-assistant/ai-assistant.html', '_blank')
            },
            'settings': {
                title: 'Налаштування',
                icon: 'fas fa-cogs',
                action: () => this.loadModule('settings')
            }
        };
        
        // Генеруємо навігацію
        this.availableModules.forEach(moduleId => {
            if (modules[moduleId]) {
                const module = modules[moduleId];
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerHTML = `
                    <a href="#" class="nav-link" onclick="window.clientSystem.${moduleId === 'dashboard' ? 'loadDashboard()' : `loadModule('${moduleId}')`}">
                        <i class="${module.icon} nav-icon"></i>
                        <p>${module.title}</p>
                    </a>
                `;
                navigationContainer.appendChild(li);
            }
        });
    }

                    <div class="row">

                                        Стан ваших ліфтів

                                </div>

                                            <div>

                                            <span class="badge badge-success">Активний</span>
                                        </div>
                                        <div class="mt-2">
                                            <small class="text-muted">
                                                <i class="fas fa-clock mr-1"></i>
                                                Останнє ТО: 15.11.2024
                                            </small>
                                        </div>
                                    </div>
                                    
                                    <div class="lift-status-item mb-3 p-3 border-left-success">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h5 class="mb-1">Ліфт №2</h5>
                                                <small class="text-muted">Під'їзд Б, 1-16 поверхи</small>
                                            </div>
                                            <span class="badge badge-success">Активний</span>
                                        </div>
                                        <div class="mt-2">
                                            <small class="text-muted">
                                                <i class="fas fa-clock mr-1"></i>
                                                Останнє ТО: 12.11.2024
                                            </small>
                                        </div>
                                    </div>
                                    
                                    <div class="lift-status-item mb-3 p-3 border-left-success">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h5 class="mb-1">Ліфт №3</h5>
                                                <small class="text-muted">Під'їзд В, 1-16 поверхи</small>
                                            </div>
                                            <span class="badge badge-success">Активний</span>
                                        </div>
                                        <div class="mt-2">
                                            <small class="text-muted">
                                                <i class="fas fa-clock mr-1"></i>
                                                Останнє ТО: 10.11.2024
                                            </small>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <button class="btn btn-primary btn-sm" onclick="window.clientSystem.loadModule('my-lifts')">

        toastr.success('Дашборд завантажено', 'Клієнтський портал');
    }
    
    async loadModule(moduleId) {
        try {
            this.setActiveNavItem(moduleId);
            
            const contentWrapper = document.getElementById('content-wrapper');
            contentWrapper.innerHTML = '<div class="content"><div class="container-fluid"><div class="text-center"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Завантаження...</p></div></div></div>';
            
            // Імітуємо завантаження модуля
            setTimeout(() => {
                contentWrapper.innerHTML = this.getModuleContent(moduleId);
                toastr.success('Модуль "' + this.getModuleTitle(moduleId) + '" завантажено', 'Клієнтський портал');
            }, 500);
            
        } catch (error) {
            console.error('Помилка завантаження модуля:', error);
            toastr.error('Помилка завантаження модуля', 'Помилка');
        }
    }
    
    getModuleContent(moduleId) {
        // Заглушки для клієнтських модулів (тут можна підключити реальні модулі)
        const modules = {
            'my-lifts': '<div class="content-header">' +
                '<div class="container-fluid">' +
                '<div class="row mb-2">' +
                '<div class="col-sm-6"><h1 class="m-0">Мої ліфти</h1></div>' +
                '<div class="col-sm-6">' +
                '<ol class="breadcrumb float-sm-right">' +
                '<li class="breadcrumb-item"><a href="#" onclick="window.clientSystem.loadDashboard()">Головна</a></li>' +
                '<li class="breadcrumb-item active">Мої ліфти</li>' +
                '</ol></div></div></div></div>' +
                '<section class="content">' +
                '<div class="container-fluid">' +
                '<div class="row">' +
                '<div class="col-lg-12">' +
                '<div class="card">' +
                '<div class="card-header">' +

    }
    
    getData() {
        return JSON.parse(localStorage.getItem(this.storageKey));
    }
    
    saveData(data) {
        localStorage.setItem(this.storageKey, JSON.stringify(data));
    }
    
    // Методи для роботи з ліфтами
    getLifts() {
        return this.getData().lifts;
    }

    // Для додавання нових ліфтів зверніться до технічної підтримки
    
    // Методи для заявок
    getRequests() {
        return this.getData().requests;
    }
    
    addRequest(request) {
        const data = this.getData();
        request.id = 'R' + String(data.requests.length + 1).padStart(3, '0');
        request.created = new Date().toISOString();
        request.status = 'pending';
        data.requests.unshift(request);
        this.saveData(data);
        return request;
    }
    
    updateRequestStatus(requestId, status, technician = null) {
        const data = this.getData();
        const request = data.requests.find(r => r.id === requestId);
        if (request) {
            request.status = status;
            if (technician) request.technician = technician;
            this.saveData(data);
        }
        return request;
    }
    
    // Методи для рахунків
    getInvoices() {
        return this.getData().invoices;
    }
    
    // Методи для профілю
    getProfile() {
        return this.getData().profile;
    }
    
    updateProfile(profileData) {
        const data = this.getData();
        data.profile = { ...data.profile, ...profileData };
        this.saveData(data);
        return data.profile;
    }
    
    // Методи для тікетів
    getTickets() {
        return this.getData().tickets;
    }
    
    addTicket(ticket) {
        const data = this.getData();
        ticket.id = 'T' + String(data.tickets.length + 1).padStart(3, '0');
        ticket.created = new Date().toISOString();
        ticket.status = 'open';
        ticket.messages = [{
            from: 'client',
            time: new Date().toISOString(),
            message: ticket.message
        }];
        delete ticket.message;
        data.tickets.unshift(ticket);
        this.saveData(data);
        return ticket;
    }
    
    addTicketMessage(ticketId, message, from = 'client') {
        const data = this.getData();
        const ticket = data.tickets.find(t => t.id === ticketId);
        if (ticket) {
            ticket.messages.push({
                from: from,
                time: new Date().toISOString(),
                message: message
            });
            ticket.updated = new Date().toISOString();
            this.saveData(data);
        }
        return ticket;
    }
}

    // Допоміжні методи для форматування
    getStatusBadgeClass(status) {
        const classes = {
            'working': 'success',
            'maintenance': 'warning', 
            'emergency': 'danger'
        };
        return classes[status] || 'secondary';
    }
    
    getStatusText(status) {
        const texts = {
            'working': 'Працює',
            'maintenance': 'Потребує ТО',
            'emergency': 'Аварія'
        };
        return texts[status] || 'Невідомо';
    }
    
    getRequestStatusColor(status) {
        const colors = {
            'pending': 'info',
            'in-progress': 'warning',
            'completed': 'success',
            'cancelled': 'secondary'
        };
        return colors[status] || 'secondary';
    }
    
    getRequestStatusBadge(status) {
        return this.getRequestStatusColor(status);
    }
    
    getRequestStatusText(status) {
        const texts = {
            'pending': 'В очікуванні',
            'in-progress': 'В роботі', 
            'completed': 'Виконано',
            'cancelled': 'Скасовано'
        };
        return texts[status] || 'Невідомо';
    }
    
    formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('uk-UA');
    }
    
    formatDateTime(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('uk-UA') + ' ' + date.toLocaleTimeString('uk-UA', {hour: '2-digit', minute: '2-digit'});
    }

// Замінюємо стару систему на нову
$(document).ready(function() {
    // Перевірка авторизації при завантаженні сторінки
    const sessionData = localStorage.getItem('lm_session');
    if (!sessionData) {
        window.location.replace('/pages/auth/login.html');
        return;
    }

    try {
        const session = JSON.parse(sessionData);
        const now = new Date();
        
        if (new Date(session.expiresAt) <= now) {
            localStorage.removeItem('lm_session');
            window.location.replace('/pages/auth/login.html');
            return;
        }

        if (session.user && session.user.role !== 'client') {
            alert('Доступ заборонено. Необхідні права клієнта.');
            window.location.replace('/pages/auth/login.html');
            return;
        }
        
    } catch (error) {
        console.error('Session error:', error);
        localStorage.removeItem('lm_session');
        window.location.replace('/pages/auth/login.html');
        return;
    }

    window.clientSystem = new EnhancedClientSystem();
    
    // Додаємо обробник для оновлення лічильників
    setInterval(() => {
        const requests = window.clientSystem.dataManager.getRequests();
        const pendingCount = requests.filter(r => r.status === 'pending').length;
        $('#notification-count').text(pendingCount);
    }, 5000);
});
