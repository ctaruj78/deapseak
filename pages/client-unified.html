<!DOCTYPE html>
<html lang="uk">
<head>

    <!-- Chart.js -->

    <!-- jQuery -->

    <!-- Bootstrap JS -->

    <!-- AdminLTE JS -->

    <!-- Toastr for notifications -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->

            </li>
        </ul>

        <!-- Right navbar links -->
        <ul class="navbar-nav ml-auto">
            <!-- Notifications -->
            <li class="nav-item dropdown">
                <a class="nav-link" data-toggle="dropdown" href="#">
                    <i class="far fa-bell"></i>
                    <span class="badge badge-warning navbar-badge" id="notification-count">3</span>
                </a>
                <div class="dropdown-menu dropdown-menu-lg dropdown-menu-right">
                    <span class="dropdown-item dropdown-header">3 повідомлення</span>
                    <div class="dropdown-divider"></div>

                        <i class="fas fa-tools mr-2"></i> Планове ТО завтра

                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item">
                        <i class="fas fa-check mr-2"></i> ТО завершено

                    </a>
                    <div class="dropdown-divider"></div>

                    <a href="#" class="dropdown-item" onclick="window.clientSystem.loadModule('profile')">

                    </a>
                    <a href="#" class="dropdown-item" onclick="window.clientSystem.loadModule('settings')">

                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="/login.html" class="dropdown-item">

                    </a>
                </div>

        </ul>
    </nav>

    <!-- Main Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a href="#" class="brand-link" onclick="window.clientSystem.loadDashboard()">
            <img src="/assets/img/AdminLTELogo.png" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8" onerror="this.style.display='none'">
            <span class="brand-text font-weight-light">Клієнтський портал</span>
        </a>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- User panel -->
            <div class="user-panel mt-3 pb-3 mb-3 d-flex">

                    <i class="fas fa-building fa-2x text-white" style="margin-top: 5px;"></i>
                </div>
                <div class="info">
                    <a href="#" class="d-block" id="sidebar-client-name">ЖК Центральний</a>

            </div>

            <!-- Navigation Menu -->
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false" id="client-navigation">
                    <!-- Навігація буде згенерована динамічно -->
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Content Wrapper -->
    <div class="content-wrapper" id="content-wrapper">
        <!-- Тут буде завантажуватися контент модулів -->
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <strong>© 2024 <a href="#">Система управління ліфтами</a>.</strong>
        Всі права захищені.
        <div class="float-right d-none d-sm-inline-block">
            <b>Версія</b> 3.0.0 | Клієнтський портал
        </div>
    </footer>
</div>

<script>
// Клас для управління клієнтською системою
class ClientSystem {
    constructor() {
        this.clientData = {
            name: 'ЖК Центральний',
            lifts: 3,
            activeLifts: 3,
            nextMaintenance: '2024-12-15'
        };
        
        this.availableModules = [
            'dashboard',
            'my-lifts',
            'maintenance-schedule',
            'service-requests',
            'history',
            'invoices',
            'support',
            'profile',
            'settings'
        ];
        
        this.init();
    }
    
    init() {
        this.renderNavigation();
        this.loadDashboard();
        this.setupEventListeners();
        
        // Встановлюємо назву клієнта
        $('#client-name, #sidebar-client-name').text(this.clientData.name);
    }
    
    setupEventListeners() {
        // Автоматичне оновлення кожні 2 хвилини
        setInterval(() => {
            this.refreshData();
        }, 120000);
    }
    
    renderNavigation() {
        const navigationContainer = document.getElementById('client-navigation');
        navigationContainer.innerHTML = '';
        
        // Конфігурація модулів для клієнта
        const modules = {
            dashboard: {
                title: 'Головна панель',
                icon: 'fas fa-tachometer-alt',
                action: () => this.loadDashboard()
            },
            'my-lifts': {
                title: 'Мої ліфти',
                icon: 'fas fa-elevator',
                action: () => this.loadModule('my-lifts')
            },
            'maintenance-schedule': {
                title: 'Графік ТО',
                icon: 'fas fa-calendar-alt',
                action: () => this.loadModule('maintenance-schedule')
            },
            'service-requests': {
                title: 'Заявки на обслуговування',
                icon: 'fas fa-clipboard-list',
                action: () => this.loadModule('service-requests')
            },
            'history': {
                title: 'Історія обслуговування',
                icon: 'fas fa-history',
                action: () => this.loadModule('history')
            },
            'invoices': {
                title: 'Рахунки та оплата',
                icon: 'fas fa-file-invoice-dollar',
                action: () => this.loadModule('invoices')
            },
            'support': {
                title: 'Технічна підтримка',
                icon: 'fas fa-headset',
                action: () => this.loadModule('support')
            },
            'settings': {
                title: 'Налаштування',
                icon: 'fas fa-cogs',
                action: () => this.loadModule('settings')
            }
        };
        
        // Генеруємо навігацію
        this.availableModules.forEach(moduleId => {
            if (modules[moduleId]) {
                const module = modules[moduleId];
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerHTML = `
                    <a href="#" class="nav-link" onclick="window.clientSystem.${moduleId === 'dashboard' ? 'loadDashboard()' : `loadModule('${moduleId}')`}">
                        <i class="${module.icon} nav-icon"></i>
                        <p>${module.title}</p>
                    </a>
                `;
                navigationContainer.appendChild(li);
            }
        });
    }
    
    loadDashboard() {
        const contentWrapper = document.getElementById('content-wrapper');
        
        // Активуємо пункт навігації
        this.setActiveNavItem('dashboard');
        
        contentWrapper.innerHTML = `
            <!-- Content Header -->
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">Головна панель</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item active">Головна</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <!-- Привітальний банер -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="welcome-banner">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <h2 class="mb-2">Вітаємо, ${this.clientData.name}!</h2>
                                        <p class="mb-0">Керуйте своїми ліфтами легко та зручно через наш клієнтський портал</p>
                                    </div>
                                    <div class="col-md-4 text-center">
                                        <i class="fas fa-building fa-4x" style="opacity: 0.7;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Статистика ліфтів -->
                    <div class="row mb-4">
                        <div class="col-lg-3 col-6">
                            <div class="small-box bg-info">
                                <div class="inner">
                                    <h3>${this.clientData.lifts}</h3>
                                    <p>Всього ліфтів</p>
                                </div>
                                <div class="icon">
                                    <i class="fas fa-elevator"></i>
                                </div>
                                <a href="#" class="small-box-footer" onclick="window.clientSystem.loadModule('my-lifts')">
                                    Детальніше <i class="fas fa-arrow-circle-right"></i>
                                </a>
                            </div>
                        </div>
                        
                        <div class="col-lg-3 col-6">
                            <div class="small-box bg-success">
                                <div class="inner">
                                    <h3>${this.clientData.activeLifts}</h3>
                                    <p>Активні ліфти</p>
                                </div>
                                <div class="icon">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                                <a href="#" class="small-box-footer" onclick="window.clientSystem.loadModule('my-lifts')">
                                    Перегляд <i class="fas fa-arrow-circle-right"></i>
                                </a>
                            </div>
                        </div>
                        
                        <div class="col-lg-3 col-6">
                            <div class="small-box bg-warning">
                                <div class="inner">
                                    <h3>0</h3>
                                    <p>На обслуговуванні</p>
                                </div>
                                <div class="icon">
                                    <i class="fas fa-tools"></i>
                                </div>
                                <a href="#" class="small-box-footer" onclick="window.clientSystem.loadModule('maintenance-schedule')">
                                    Графік ТО <i class="fas fa-arrow-circle-right"></i>
                                </a>
                            </div>
                        </div>
                        
                        <div class="col-lg-3 col-6">
                            <div class="small-box bg-danger">
                                <div class="inner">
                                    <h3>1</h3>
                                    <p>Активні заявки</p>
                                </div>
                                <div class="icon">
                                    <i class="fas fa-clipboard-list"></i>
                                </div>
                                <a href="#" class="small-box-footer" onclick="window.clientSystem.loadModule('service-requests')">
                                    Заявки <i class="fas fa-arrow-circle-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Стан ліфтів -->
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="fas fa-elevator mr-2"></i>
                                        Стан ваших ліфтів
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <div class="lift-status-item mb-3 p-3 border-left-success">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h5 class="mb-1">Ліфт №1</h5>
                                                <small class="text-muted">Під'їзд А, 1-16 поверхи</small>
                                            </div>
                                            <span class="badge badge-success">Активний</span>
                                        </div>
                                        <div class="mt-2">
                                            <small class="text-muted">
                                                <i class="fas fa-clock mr-1"></i>
                                                Останнє ТО: 15.11.2024
                                            </small>
                                        </div>
                                    </div>
                                    
                                    <div class="lift-status-item mb-3 p-3 border-left-success">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h5 class="mb-1">Ліфт №2</h5>
                                                <small class="text-muted">Під'їзд Б, 1-16 поверхи</small>
                                            </div>
                                            <span class="badge badge-success">Активний</span>
                                        </div>
                                        <div class="mt-2">
                                            <small class="text-muted">
                                                <i class="fas fa-clock mr-1"></i>
                                                Останнє ТО: 12.11.2024
                                            </small>
                                        </div>
                                    </div>
                                    
                                    <div class="lift-status-item mb-3 p-3 border-left-success">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h5 class="mb-1">Ліфт №3</h5>
                                                <small class="text-muted">Під'їзд В, 1-16 поверхи</small>
                                            </div>
                                            <span class="badge badge-success">Активний</span>
                                        </div>
                                        <div class="mt-2">
                                            <small class="text-muted">
                                                <i class="fas fa-clock mr-1"></i>
                                                Останнє ТО: 10.11.2024
                                            </small>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <button class="btn btn-primary btn-sm" onclick="window.clientSystem.loadModule('my-lifts')">
                                        <i class="fas fa-eye mr-1"></i> Детальний перегляд
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Швидкі дії -->
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="fas fa-bolt mr-2"></i>
                                        Швидкі дії
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <button class="btn btn-outline-primary btn-block action-btn" onclick="window.clientSystem.loadModule('service-requests')">
                                                <i class="fas fa-plus-circle fa-2x mb-2"></i>
                                                <div>Створити заявку</div>
                                            </button>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <button class="btn btn-outline-info btn-block action-btn" onclick="window.clientSystem.loadModule('maintenance-schedule')">
                                                <i class="fas fa-calendar fa-2x mb-2"></i>
                                                <div>Графік ТО</div>
                                            </button>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <button class="btn btn-outline-success btn-block action-btn" onclick="window.clientSystem.loadModule('history')">
                                                <i class="fas fa-history fa-2x mb-2"></i>
                                                <div>Історія</div>
                                            </button>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <button class="btn btn-outline-warning btn-block action-btn" onclick="window.clientSystem.loadModule('support')">
                                                <i class="fas fa-headset fa-2x mb-2"></i>
                                                <div>Підтримка</div>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Останні події та найближчі заходи -->
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="fas fa-bell mr-2"></i>
                                        Останні події
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <div class="timeline">
                                        <div class="timeline-item">
                                            <span class="time"><i class="fas fa-clock"></i> 2 год тому</span>
                                            <h3 class="timeline-header">ТО завершено</h3>
                                            <div class="timeline-body">
                                                Планове технічне обслуговування ліфта №1 успішно завершено
                                            </div>
                                        </div>
                                        <div class="timeline-item">
                                            <span class="time"><i class="fas fa-clock"></i> Вчора</span>
                                            <h3 class="timeline-header">Заявка закрита</h3>
                                            <div class="timeline-body">
                                                Заявка на ремонт кнопок у ліфті №2 закрита
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="fas fa-calendar-alt mr-2"></i>
                                        Найближчі заходи
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <div class="schedule-item mb-3 p-3 bg-light border-left-warning">
                                        <div class="d-flex justify-content-between">
                                            <div>
                                                <h5 class="mb-1">Планове ТО</h5>
                                                <small>Ліфт №3</small>
                                            </div>
                                            <span class="badge badge-warning">Завтра</span>
                                        </div>
                                    </div>
                                    
                                    <div class="schedule-item mb-3 p-3 bg-light border-left-info">
                                        <div class="d-flex justify-content-between">
                                            <div>
                                                <h5 class="mb-1">Інспекція безпеки</h5>
                                                <small>Всі ліфти</small>
                                            </div>
                                            <span class="badge badge-info">15 грудня</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        `;
        
        toastr.success('Дашборд завантажено', 'Клієнтський портал');
    }
    
    async loadModule(moduleId) {
        try {
            this.setActiveNavItem(moduleId);
            
            const contentWrapper = document.getElementById('content-wrapper');
            contentWrapper.innerHTML = '<div class="content"><div class="container-fluid"><div class="text-center"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Завантаження...</p></div></div></div>';
            
            // Імітуємо завантаження модуля
            setTimeout(() => {
                contentWrapper.innerHTML = this.getModuleContent(moduleId);
                toastr.success('Модуль "' + this.getModuleTitle(moduleId) + '" завантажено', 'Клієнтський портал');
            }, 500);
            
        } catch (error) {
            console.error('Помилка завантаження модуля:', error);
            toastr.error('Помилка завантаження модуля', 'Помилка');
        }
    }
    
    getModuleContent(moduleId) {
        // Заглушки для клієнтських модулів (тут можна підключити реальні модулі)
        const modules = {
            'my-lifts': '<div class="content-header">' +
                '<div class="container-fluid">' +
                '<div class="row mb-2">' +
                '<div class="col-sm-6"><h1 class="m-0">Мої ліфти</h1></div>' +
                '<div class="col-sm-6">' +
                '<ol class="breadcrumb float-sm-right">' +
                '<li class="breadcrumb-item"><a href="#" onclick="window.clientSystem.loadDashboard()">Головна</a></li>' +
                '<li class="breadcrumb-item active">Мої ліфти</li>' +
                '</ol></div></div></div></div>' +
                '<section class="content">' +
                '<div class="container-fluid">' +
                '<div class="alert alert-info">' +
                '<i class="fas fa-info-circle mr-2"></i>' +
                'Тут буде детальна інформація про всі ваші ліфти з можливістю перегляду статусу, історії обслуговування та створення заявок.' +
                '</div></div></section>',
                
            'service-requests': '<div class="content-header">' +
                '<div class="container-fluid">' +
                '<div class="row mb-2">' +
                '<div class="col-sm-6"><h1 class="m-0">Заявки на обслуговування</h1></div>' +
                '<div class="col-sm-6">' +
                '<ol class="breadcrumb float-sm-right">' +
                '<li class="breadcrumb-item"><a href="#" onclick="window.clientSystem.loadDashboard()">Головна</a></li>' +
                '<li class="breadcrumb-item active">Заявки</li>' +
                '</ol></div></div></div></div>' +
                '<section class="content">' +
                '<div class="container-fluid">' +
                '<div class="alert alert-success">' +
                '<i class="fas fa-clipboard-list mr-2"></i>' +
                'Тут ви зможете створювати нові заявки на обслуговування, відстежувати їх статус та історію виконання.' +
                '</div></div></section>',
                
            'support': '<div class="content-header">' +
                '<div class="container-fluid">' +
                '<div class="row mb-2">' +
                '<div class="col-sm-6"><h1 class="m-0">Технічна підтримка</h1></div>' +
                '<div class="col-sm-6">' +
                '<ol class="breadcrumb float-sm-right">' +
                '<li class="breadcrumb-item"><a href="#" onclick="window.clientSystem.loadDashboard()">Головна</a></li>' +
                '<li class="breadcrumb-item active">Підтримка</li>' +
                '</ol></div></div></div></div>' +
                '<section class="content">' +
                '<div class="container-fluid">' +
                '<div class="alert alert-warning">' +
                '<i class="fas fa-headset mr-2"></i>' +
                'Розділ технічної підтримки з можливістю створення тікетів, чату з операторами та перегляду часто задаваних питань.' +
                '</div></div></section>'
        };
        
        return modules[moduleId] || 
            '<div class="content-header">' +
            '<div class="container-fluid">' +
            '<div class="row mb-2">' +
            '<div class="col-sm-6"><h1 class="m-0">' + this.getModuleTitle(moduleId) + '</h1></div>' +
            '<div class="col-sm-6">' +
            '<ol class="breadcrumb float-sm-right">' +
            '<li class="breadcrumb-item"><a href="#" onclick="window.clientSystem.loadDashboard()">Головна</a></li>' +
            '<li class="breadcrumb-item active">' + this.getModuleTitle(moduleId) + '</li>' +
            '</ol></div></div></div></div>' +
            '<section class="content">' +
            '<div class="container-fluid">' +
            '<div class="alert alert-info">' +
            '<i class="fas fa-info-circle mr-2"></i>' +
            'Модуль "' + this.getModuleTitle(moduleId) + '" в розробці' +
            '</div></div></section>';
    }
    
    getModuleTitle(moduleId) {
        const titles = {
            'my-lifts': 'Мої ліфти',
            'maintenance-schedule': 'Графік ТО',
            'service-requests': 'Заявки на обслуговування',
            'history': 'Історія обслуговування',
            'invoices': 'Рахунки та оплата',
            'support': 'Технічна підтримка',
            'profile': 'Профіль',
            'settings': 'Налаштування'
        };
        return titles[moduleId] || moduleId;
    }
    
    setActiveNavItem(moduleId) {
        // Видаляємо активний клас з усіх пунктів
        document.querySelectorAll('.nav-sidebar .nav-link').forEach(link => {
            link.classList.remove('active');
        });
        
        // Додаємо активний клас до поточного пункту
        const currentLink = document.querySelector('.nav-sidebar .nav-link[onclick*="' + moduleId + '"]');
        if (currentLink) {
            currentLink.classList.add('active');
        }
    }
    
    refreshData() {
        // Оновлюємо дані (імітація)
        console.log('Оновлення даних клієнта...');
    }
}
