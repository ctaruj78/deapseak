    <script>
        function submitProfileUpdate(e) {
            e.preventDefault();
            const nameEl  = document.querySelector('input[data-user-name]');
            const emailEl = document.querySelector('input[data-user-email]');
            const phoneEl = document.querySelector('input[data-user-phone]');
            if (window.ProfileLoader) {
                window.updateUserProfile({
                    name:  nameEl  ? nameEl.value  : undefined,
                    email: emailEl ? emailEl.value : undefined,
                    phone: phoneEl ? phoneEl.value : undefined
                });
            }
        }

        function submitPasswordChange(e) {
            e.preventDefault();
            const current  = document.getElementById('currentPassword').value;
            const newPass  = document.getElementById('newPassword').value;
            const confirm  = document.getElementById('confirmPassword').value;
            if (newPass !== confirm) { alert('As palavras-passe não coincidem'); return; }
            if (window.changeUserPassword) {
                window.changeUserPassword(current, newPass);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof loadSidebarWithInit === "function") {
                loadSidebarWithInit("includes/sidebar.html");
            }
        });
    </script>
