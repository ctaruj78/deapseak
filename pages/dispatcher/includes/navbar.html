<script>
// Carregamento імені do utilizador в navbar
document.addEventListener('DOMContentLoaded', function() {
    const userData = JSON.parse(localStorage.getItem('userData') || '{}');
    const navUserName = document.getElementById('navbarUserName');
    if (navUserName && userData.firstName) {
        navUserName.textContent = `${userData.firstName} ${userData.lastName || ''}`.trim();
    }

    // Carregamento de quantidade de notificações
    loadNotifications();
});

// Função carregamento de notificações
async function loadNotifications() {
    try {
        const response = await AuthManager.fetchWithAuth('/api/notifications?unread=true');
        if (response.ok) {
            const data = await response.json();
            const notifications = data.data || [];
            
            const countEl = document.getElementById('notificationCount');
            const listEl = document.getElementById('notificationList');
            
            if (countEl) {
                countEl.textContent = notifications.length;
                countEl.style.display = notifications.length > 0 ? 'inline' : 'none';
            }
            
            if (listEl && notifications.length > 0) {
                listEl.innerHTML = notifications.slice(0, 5).map(n => `
                    <a href="#" class="dropdown-item">
                        <i class="fas fa-${n.type === 'request' ? 'clipboard-list' : 'info-circle'} mr-2"></i>
                        ${n.message}
                        <span class="float-right text-muted text-sm">${new Date(n.createdAt).toLocaleDateString('uk-UA')}</span>
                    </a>
                `).join('<div class="dropdown-divider"></div>');
            }
        }
    } catch (error) {
        console.warn('Não foi possível carregar notificações:', error);
    }
}

// Atualização de notificações кожні 60 segundos
setInterval(loadNotifications, 60000);
</script>
