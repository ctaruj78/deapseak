<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/plugins/toastr/css/toastr.min.css">
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despachante — Calendário de pedidos</title>
    <script src="../../assets/js/global-settings.js"></script>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="../../plugins/adminlte/adminlte.min.css">
    <link rel="stylesheet" href="../../plugins/fontawesome/css/all.min.css">
    <!-- FullCalendar CSS -->
    <link rel="stylesheet" href="../../assets/plugins/fullcalendar/main.min.css">
    <style>
        #calendar {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 20px;
        }
    </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed" data-required-role="dispatcher">
    <div class="wrapper">
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
                <li class="nav-item d-none d-sm-inline-block">
                    <a href="dashboard.html" class="nav-link">Início</a>
                </li>
            </ul>
        </nav>

        <!-- Sidebar Placeholder -->
        <div id="sidebar-placeholder"></div>

        <div class="content-wrapper">
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">Calendário de pedidos</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="dashboard.html">Início</a></li>
                                <li class="breadcrumb-item active">Calendário</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <section class="content">
                <div class="container-fluid">
                    <div class="card">
                        <div class="card-body">
                            <div id="calendar"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Copyright &copy; 2026 <a href="https://festlift.pt">FestLift</a>.</strong>
            Sistema de gestão de elevadores v2.1.0.
            <div class="float-right d-none d-sm-inline-block">
                <b>Versão</b> 2.1.0
            </div>
        </footer>
    </div>

    <!-- jQuery -->
    <script src="../../plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap -->
    <script src="../../plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE -->
    <script src="../../plugins/adminlte/adminlte.min.js"></script>

    <!-- Sidebar Init -->
    <script src="../../assets/js/sidebar-init.js"></script>

    <!-- API Configuration -->
    <script src="../../assets/js/config.js?v=20241116"></script>

    <!-- Auth System -->
    <script src="../../assets/js/auth.js?v=20241206"></script>

    <!-- FullCalendar -->
    <script src="../../assets/plugins/fullcalendar/main.min.js"></script>
    <script src="../../assets/plugins/fullcalendar/locales-all.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof loadSidebarWithInit === "function") {
                loadSidebarWithInit("includes/sidebar.html");
            }

            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'pt',
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: async function(fetchInfo, successCallback, failureCallback) {
                    try {
                        const token = localStorage.getItem('token') || sessionStorage.getItem('token') || '';
                        const res = await fetch('/api/requests', {
                            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                        });
                        let data = res.ok ? await res.json() : [];
                        if (Array.isArray(data.data)) data = data.data;
                        if (!data.length) {
                            data = [
                                { id: 1, title: "Substituição do disco rígido", date: "2025-09-28", status: "assigned" },
                                { id: 2, title: "Instalação de actualização de software", date: "2025-09-29", status: "in-progress" },
                                { id: 3, title: "Diagnóstico do servidor", date: "2025-09-30", status: "completed" }
                            ];
                        }
                        const events = data.map(r => ({
                            id: r.id,
                            title: r.title + (r.status ? ' (' + r.status + ')' : ''),
                            start: String(r.date).split(' ')[0],
                            color: r.status === 'completed' ? '#28a745' : (r.status === 'in-progress' ? '#ffc107' : '#007bff')
                        }));
                        successCallback(events);
                    } catch (e) {
                        failureCallback(e);
                    }
                },
                eventClick: function(info) {
                    toastr.info('Pedido #' + info.event.id + '\n' + info.event.title);
                }
            });
            calendar.render();
        });
    </script>
<script src="../../assets/js/monitor.js"></script>
<script></script>
    <script src="/plugins/toastr/js/toastr.min.js"></script>
</body>
</html>
