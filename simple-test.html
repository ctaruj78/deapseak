<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простий тест</title>
</head>
<body>
    <h1>Тест функціональності</h1>
    <button onclick="testFunction()">Тест кнопки</button>
    <div id="result"></div>

    <script>
        function testFunction() {
            document.getElementById('result').innerHTML = 'Кнопка працює! Час: ' + new Date().toLocaleTimeString();
        }

        // Автоматичний тест при завантаженні
        window.onload = function() {
            document.getElementById('result').innerHTML = 'Сторінка завантажена успішно о ' + new Date().toLocaleTimeString();
        };
    </script>
</body>
</html>
