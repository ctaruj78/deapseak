<!DOCTYPE html>
<html>
<head>
    <title>Test QR Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Test QR Manager Search</h1>
    <input type="text" id="searchInput" placeholder="Введіть текст...">
    <button onclick="testSearch()">Тест</button>
    <div id="result"></div>

    <script>
        // Simulate qrManager module
        const currentQRs = [
            {
                id: '1',
                code: 'LIFT-A1B2C3',
                name: 'Lisboaська 25, кв. 10',
                location: 'Lisboa',
                status: 'active'
            },
            {
                id: '2', 
                code: 'LIFT-X9Y8Z7',
                name: 'Portoська 10',
                location: 'Porto',
                status: 'inactive'
            }
        ];

        let currentFilters = {
            status: 'all',
            city: '',
            search: ''
        };

        function searchQR() {
            const searchValue = $('#searchInput').val();
            console.log('🔍 Pesquisar:', searchValue);
            currentFilters.search = searchValue;
            
            const filtered = filterQRData();
            $('#result').html('<pre>' + JSON.stringify(filtered, null, 2) + '</pre>');
        }

        function filterQRData() {
            return currentQRs.filter(qr => {
                if (currentFilters.search) {
                    const search = currentFilters.search.toLowerCase();
                    const matchCode = qr.code.toLowerCase().includes(search);
                    const matchName = qr.name.toLowerCase().includes(search);
                    const matchLocation = qr.location.toLowerCase().includes(search);
                    const matchId = qr.id.toLowerCase().includes(search);
                    
                    if (!matchCode && !matchName && !matchLocation && !matchId) {
                        return false;
                    }
                }
                return true;
            });
        }

        function testSearch() {
            searchQR();
        }

        // Auto search on input
        $('#searchInput').on('input', function() {
            searchQR();
        });
    </script>
</body>
</html>
