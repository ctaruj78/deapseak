<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - LiftMaster Pro</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="hold-transition login-page bg-light">
    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="index.html"><i class="fas fa-elevator text-primary"></i> <b>LiftMaster Pro</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Вхід до системи</h3>
            </div>
            <div class="card-body">
                <form id="login-form">
                    <div class="input-group mb-3">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Логін" required autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-user"></span></div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Пароль" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Запам'ятати мене</label>
                            </div>
                        </div>
                        <div class="col-6 text-right">
                            <a href="forgot-password.html">Забули пароль?</a>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Увійти
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <span>Немає облікового запису? <a href="register.html">Зареєструватися</a></span>
                </div>
                
                <!-- Demo акаунти -->
                <div class="mt-4">
                    <div class="alert alert-info">
                        <h6><i class="fas fa-info-circle"></i> Демо акаунти для тестування:</h6>
                        <small>
                            <strong>Адмін:</strong> admin / admin123<br>
                            <strong>Технік:</strong> tech1 / tech123<br>
                            <strong>Диспетчер:</strong> dispatcher1 / dispatcher123<br>
                            <strong>Клієнт:</strong> client1 / client123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    
    <!-- Система авторизації -->
    <script src="assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            
            // Перевіряємо чи користувач вже увійшов через AuthManager
            if (typeof AuthManager !== 'undefined' && AuthManager.isAuthenticated()) {
                const user = AuthManager.getCurrentUser();
                if (user && user.role) {
                    console.log('✅ Користувач вже авторизований, перенаправляємо...');
                    redirectUserByRole(user.role);
                    return;
                }
            }
            
            // Очищуємо старі дані якщо є
            localStorage.removeItem('lm_session');
            localStorage.removeItem('lm_user');
            
            // Функція перенаправлення за ролями
            function redirectUserByRole(role) {
                switch (role) {
                    case 'admin':
                        window.location.href = 'pages/admin/admin-dashboard.html';
                        break;
                    case 'dispatcher':
                        window.location.href = 'pages/dispatcher/dashboard.html';
                        break;
                    case 'technician':
                    case 'tech':
                        window.location.href = 'pages/tech/dashboard.html';
                        break;
                    case 'client':
                        window.location.href = 'pages/client/dashboard.html';
                        break;
                    default:
                        window.location.href = 'pages/admin/admin-dashboard.html';
                }
            }
            
            // Показ повідомлень
            function showMessage(message, type = 'error') {
                let alertDiv = document.getElementById('login-message');
                if (!alertDiv) {
                    alertDiv = document.createElement('div');
                    alertDiv.id = 'login-message';
                    alertDiv.className = `alert alert-${type === 'error' ? 'danger' : 'success'}`;
                    loginForm.insertBefore(alertDiv, loginForm.firstChild);
                }
                
                alertDiv.textContent = message;
                alertDiv.style.display = 'block';
                
                // Автоматично приховати через 5 секунд
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
            
            // Обробка форми входу
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email')?.value || document.getElementById('username')?.value;
                const password = document.getElementById('password').value;
                
                console.log('🔐 Форма логіну відправлена - v2.0 ' + new Date().toISOString());
                console.log('📝 Email/Username:', email);
                console.log('� Password length:', password ? password.length : 0);
                console.log('🌍 Current port:', window.location.port);
                
                if (!email || !password) {
                    showMessage('Введіть email/логін та пароль');
                    return;
                }
                
                try {
                    console.log('🔐 Спроба входу для:', email);
                    
                    // Формування API URL для GitHub Codespaces та локальної розробки
                    let apiUrl;
                    const hostname = window.location.hostname;
                    
                    if (hostname.includes('.app.github.dev')) {
                        // GitHub Codespaces: використовуємо правильний API URL
                        const baseUrl = window.location.protocol + '//' + hostname.replace(/(-\d+)(\.app\.github\.dev)/, '-3001$2');
                        apiUrl = baseUrl + '/api/auth/login';
                    } else if (window.location.port === '8080' || window.location.port === '3000' || window.location.hostname === 'localhost') {
                        // Локальна розробка
                        apiUrl = 'http://localhost:3001/api/auth/login';
                    } else {
                        // Відносний шлях
                        apiUrl = '/api/auth/login';
                    }
                    
                    console.log('🌐 Запит до:', apiUrl);
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            email: email,
                            username: email, // Підтримуємо і email і username
                            password: password
                        })
                    });
                    
                    const data = await response.json();
                    console.log('📝 Відповідь сервера:', data);
                    console.log('✅ Response OK:', response.ok);
                    console.log('🔢 Status Code:', response.status);
                    
                    if (response.ok && data.success) {
                        // Збереження через AuthManager (новий метод)
                        if (typeof AuthManager !== 'undefined') {
                            AuthManager.login(data.token, data.user);
                        }
                        
                        // Також зберігаємо в старому форматі для сумісності
                        localStorage.setItem('lm_session', JSON.stringify(data.user));
                        
                        showMessage('Успішний вхід! Перенаправлення...', 'success');
                        
                        // Перевіряємо чи є збережене перенаправлення
                        const redirectUrl = sessionStorage.getItem('redirect_after_login');
                        
                        // Перенаправлення через 500мс
                        setTimeout(() => {
                            if (redirectUrl) {
                                // Очищуємо збережений URL
                                sessionStorage.removeItem('redirect_after_login');
                                // Перенаправляємо туди куди хотів потрапити користувач
                                window.location.href = redirectUrl;
                            } else {
                                // Стандартне перенаправлення за роллю
                                redirectUserByRole(data.user.role);
                            }
                        }, 500);
                        
                    } else {
                        showMessage(data.message || 'Помилка входу');
                        console.error('❌ Помилка входу:', data);
                    }
                } catch (error) {
                    console.error('❌ Критична помилка входу:', error);
                    showMessage('Сталася помилка під час входу. Перевірте з\'єднання з сервером.');
                }
            });
        });
    </script>
    
    <!-- Auth Manager -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
