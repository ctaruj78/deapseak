<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - LiftMaster Pro</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="hold-transition login-page bg-light">
    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="index.html"><i class="fas fa-elevator text-primary"></i> <b>LiftMaster Pro</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Вхід до системи</h3>
            </div>
            <div class="card-body">
                <form id="login-form">
                    <div class="input-group mb-3">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Логін" required autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-user"></span></div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Пароль" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Запам'ятати мене</label>
                            </div>
                        </div>
                        <div class="col-6 text-right">
                            <a href="forgot-password.html">Забули пароль?</a>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Увійти
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <span>Немає облікового запису? <a href="register.html">Зареєструватися</a></span>
                </div>
            </div>
        </div>
    </div>
    <!-- AdminLTE JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    
    <script>
        $(document).ready(function() {
            // Проверяем, авторизован ли пользователь
            if (localStorage.getItem('authToken')) {
                const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                if (userData.role === 'dispatcher') {
                    window.location.href = 'pages/crm-unified.html?role=dispatcher';
                } else if (userData.role === 'technician') {
                    window.location.href = 'pages/crm-unified.html?role=tech';
                } else if (userData.role === 'admin') {
                    window.location.href = 'pages/crm-unified.html?role=admin';
                } else {
                    window.location.href = 'pages/client/dashboard.html';
                }
                return;
            }
            
            // Обработка формы входа
            $('#login-form').on('submit', function(e) {
                e.preventDefault();
                
                const username = $('#username').val();
                const password = $('#password').val();
                const rememberMe = $('#remember').is(':checked');
                
                // Добавляем элемент для сообщений об ошибках
                if ($('#login-error').length === 0) {
                    $(this).prepend('<div class="alert alert-danger" id="login-error" style="display: none;"></div>');
                }
                
                // Если мы в режиме разработки, используем локальное хранилище
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    // Простая симуляция входа
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    const user = users.find(u => u.username === username && u.password === password);
                    
                    if (!user) {
                        $('#login-error').text('Неправильний логін або пароль').show();
                        return;
                    }
                    
                    // Создаем токен авторизации (в реальном приложении это должен делать сервер)
                    const authToken = btoa(username + ':' + Date.now());
                    localStorage.setItem('authToken', authToken);
                    
                    // Сохраняем данные пользователя
                    const userData = {
                        id: user.id,
                        firstName: user.firstName,
                        lastName: user.lastName,
                        email: user.email,
                        username: user.username,
                        role: user.role
                    };
                    localStorage.setItem('userData', JSON.stringify(userData));
                    
                    // Перенаправляем пользователя в зависимости от роли
                    if (user.role === 'dispatcher') {
                        window.location.href = 'pages/crm-unified.html?role=dispatcher';
                    } else if (user.role === 'technician') {
                        window.location.href = 'pages/crm-unified.html?role=tech';
                    } else if (user.role === 'admin') {
                        window.location.href = 'pages/crm-unified.html?role=admin';
                    } else {
                        window.location.href = 'pages/client/dashboard.html';
                    }
                } else {
                    // Реальный API запрос для входа
                    $.ajax({
                        url: '/api/login',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            username: username,
                            password: password,
                            remember: rememberMe
                        }),
                        success: function(response) {
                            if (response.success && response.token) {
                                localStorage.setItem('authToken', response.token);
                                localStorage.setItem('userData', JSON.stringify(response.user));
                                
                                // Перенаправляем пользователя в зависимости от роли
                                if (response.user.role === 'dispatcher') {
                                    window.location.href = 'pages/crm-unified.html?role=dispatcher';
                                } else if (response.user.role === 'technician') {
                                    window.location.href = 'pages/crm-unified.html?role=tech';
                                } else if (response.user.role === 'admin') {
                                    window.location.href = 'pages/crm-unified.html?role=admin';
                                } else {
                                    window.location.href = 'pages/client/dashboard.html';
                                }
                            } else {
                                $('#login-error').text(response.message || 'Помилка входу').show();
                            }
                        },
                        error: function(xhr) {
                            const message = xhr.responseJSON && xhr.responseJSON.message 
                                ? xhr.responseJSON.message 
                                : 'Сталася помилка під час входу. Спробуйте пізніше.';
                            $('#login-error').text(message).show();
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
