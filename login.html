<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - LiftMaster Pro</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <script src="config.js"></script>
</head>
<body class="hold-transition login-page bg-light">
    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="index.html"><i class="fas fa-elevator text-primary"></i> <b>LiftMaster Pro</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Вхід до системи</h3>
            </div>
            <div class="card-body">
                <form id="login-form">
                    <div class="input-group mb-3">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Email (наприклад: admin@deapseak.com)" required autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Пароль" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-lock"></span></div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Запам'ятати мене</label>
                            </div>
                        </div>
                        <div class="col-6 text-right">
                            <a href="forgot-password.html">Забули пароль?</a>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Увійти
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <span>Немає облікового запису? <a href="register.html">Зареєструватися</a></span>
                </div>
                
                <!-- Demo акаунти -->
                <div class="mt-4">
                    <div class="alert alert-info">
                        <h6><i class="fas fa-info-circle"></i> Демо акаунти для тестування:</h6>
                        <small>
                            <strong>Адмін:</strong> admin / admin123<br>
                            <strong>Технік:</strong> tech1 / tech123<br>
                            <strong>Диспетчер:</strong> dispatcher1 / dispatcher123<br>
                            <strong>Клієнт:</strong> client1 / client123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    
    <!-- Система авторизації -->
    <script src="assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            
            // Перевіряємо чи користувач вже увійшов через AuthManager
            // Додаємо захист від циклу редиректів
            const redirecting = sessionStorage.getItem('redirecting');
            if (redirecting) {
                console.log('⚠️ Запобігання циклу редиректів - очищуємо session');
                sessionStorage.removeItem('redirecting');
                // Очищуємо всі дані автентифікації
                if (typeof AuthManager !== 'undefined') {
                    localStorage.removeItem(AuthManager.TOKEN_KEY);
                    localStorage.removeItem(AuthManager.USER_KEY);
                }
            } else if (typeof AuthManager !== 'undefined' && AuthManager.isAuthenticated()) {
                const user = AuthManager.getCurrentUser();
                if (user && user.role) {
                    // Перевіряємо чи користувач хоче вийти (якщо в URL є параметр logout)
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('logout') === 'true') {
                        console.log('🚪 Користувач хоче вийти, очищуємо дані...');
                        AuthManager.logout();
                        return;
                    }
                    
                    console.log('✅ Користувач вже авторизований:', user.username, '(' + user.role + ')');
                    
                    // Показуємо повідомлення з можливістю вийти
                    const loginContainer = document.querySelector('.login-container');
                    if (loginContainer) {
                        loginContainer.innerHTML = `
                            <div style="text-align: center; padding: 40px;">
                                <i class="fas fa-user-check" style="font-size: 64px; color: #28a745; margin-bottom: 20px;"></i>
                                <h3>Ви вже авторизовані</h3>
                                <p>Користувач: <strong>${user.username}</strong></p>
                                <p>Роль: <strong>${getRoleName(user.role)}</strong></p>
                                <div style="margin-top: 30px;">
                                    <button onclick="continueToPanel()" class="btn btn-primary btn-lg" style="margin: 5px;">
                                        <i class="fas fa-arrow-right"></i> Продовжити до панелі
                                    </button>
                                    <button onclick="logoutAndChooseRole()" class="btn btn-outline-secondary btn-lg" style="margin: 5px;">
                                        <i class="fas fa-sign-out-alt"></i> Вийти та обрати іншу роль
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                    
                    return; // Не робимо автоматичний редирект
                }
            }
            
            // Очищуємо старі дані якщо є
            localStorage.removeItem('lm_session');
            localStorage.removeItem('lm_user');
            
            // Функція перенаправлення за ролями
            function redirectUserByRole(role) {
                // Очищуємо sessionStorage після редиректу
                setTimeout(() => sessionStorage.removeItem('redirecting'), 100);
                
                switch (role) {
                    case 'admin':
                        window.location.href = 'pages/admin/admin-dashboard.html';
                        break;
                    case 'dispatcher':
                        window.location.href = 'pages/dispatcher/dashboard.html';
                        break;
                    case 'technician':
                    case 'tech':
                        window.location.href = 'pages/tech/dashboard.html';
                        break;
                    case 'client':
                        window.location.href = 'pages/client/dashboard.html';
                        break;
                    default:
                        window.location.href = 'pages/admin/admin-dashboard.html';
                }
            }
            
            // Продовжити до панелі (для вже авторизованих)
            function continueToPanel() {
                const user = AuthManager.getCurrentUser();
                if (user && user.role) {
                    sessionStorage.setItem('redirecting', 'true');
                    redirectUserByRole(user.role);
                }
            }
            
            // Вийти та обрати іншу роль
            function logoutAndChooseRole() {
                if (confirm('Ви впевнені що хочете вийти?')) {
                    AuthManager.logout();
                    location.reload();
                }
            }
            
            // Отримати назву ролі українською
            function getRoleName(role) {
                const roleNames = {
                    'admin': 'Адміністратор',
                    'dispatcher': 'Диспетчер',
                    'technician': 'Технік',
                    'tech': 'Технік',
                    'client': 'Клієнт'
                };
                return roleNames[role] || role;
            }
            
            // Показ повідомлень
            function showMessage(message, type = 'error') {
                let alertDiv = document.getElementById('login-message');
                if (!alertDiv) {
                    alertDiv = document.createElement('div');
                    alertDiv.id = 'login-message';
                    alertDiv.className = `alert alert-${type === 'error' ? 'danger' : 'success'}`;
                    loginForm.insertBefore(alertDiv, loginForm.firstChild);
                }
                
                alertDiv.textContent = message;
                alertDiv.style.display = 'block';
                
                // Автоматично приховати через 5 секунд
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
            
            // Обробка форми входу
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                console.log('🔐 Форма логіну відправлена - v2.0 ' + new Date().toISOString());
                console.log('📝 Email:', email);
                console.log('� Password length:', password ? password.length : 0);
                console.log('🌍 Current port:', window.location.port);
                
                if (!email || !password) {
                    showMessage('Введіть email/логін та пароль');
                    return;
                }
                
                try {
                    console.log('🔐 Спроба входу для:', email);
                    
                    // Формування API URL для GitHub Codespaces та локальної розробки
                    let apiUrl;
                    const hostname = window.location.hostname;
                    
                    if (hostname.includes('.app.github.dev')) {
                        // GitHub Codespaces: unified-server на порту 5000
                        const baseUrl = window.location.protocol + '//' + hostname.replace(/(-\d+)(\.app\.github\.dev)/, '-5000$2');
                        apiUrl = baseUrl + '/api/auth/login';
                    } else if (window.location.port === '8080' || window.location.port === '3000' || window.location.hostname === 'localhost') {
                        // Локальна розробка - unified-server на порту 5000
                        apiUrl = 'http://localhost:5000/api/auth/login';
                    } else {
                        // Відносний шлях
                        apiUrl = '/api/auth/login';
                    }
                    
                    console.log('🌐 Запит до:', apiUrl);
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            login: email, // V2 API використовує поле "login"
                            password: password
                        })
                    });
                    
                    const data = await response.json();
                    console.log('📝 Відповідь сервера:', data);
                    console.log('✅ Response OK:', response.ok);
                    console.log('🔢 Status Code:', response.status);
                    
                    if (response.ok && data.success) {
                        // V2 API: отримуємо token та user з data
                        const token = data.data?.token || data.token;
                        const user = data.data?.user || data.user;
                        
                        // Зберігаємо токен
                        localStorage.setItem('lm_token', token);
                        localStorage.setItem('deapseak_token', token);
                        
                        // Збереження через AuthManager (новий метод)
                        if (typeof AuthManager !== 'undefined') {
                            AuthManager.login(token, user);
                        }
                        
                        // Також зберігаємо в старому форматі для сумісності
                        localStorage.setItem('lm_session', JSON.stringify(user));
                        
                        showMessage('Успішний вхід! Перенаправлення...', 'success');
                        
                        // Перевіряємо чи є збережене перенаправлення
                        const redirectUrl = sessionStorage.getItem('redirect_after_login');
                        
                        // Перенаправлення через 500мс
                        setTimeout(() => {
                            if (redirectUrl) {
                                // Очищуємо збережений URL
                                sessionStorage.removeItem('redirect_after_login');
                                // Перенаправляємо туди куди хотів потрапити користувач
                                window.location.href = redirectUrl;
                            } else {
                                // Стандартне перенаправлення за роллю
                                redirectUserByRole(user.role);
                            }
                        }, 500);
                        
                    } else {
                        showMessage(data.message || 'Помилка входу');
                        console.error('❌ Помилка входу:', data);
                    }
                } catch (error) {
                    console.error('❌ Критична помилка входу:', error);
                    showMessage('Сталася помилка під час входу. Перевірте з\'єднання з сервером.');
                }
            });
        });
    </script>
    
    <!-- Auth Manager -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
