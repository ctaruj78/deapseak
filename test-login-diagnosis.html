<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Діагностика логіну</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            color: #333;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }
        .login-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .input-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px 0;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .log {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
        .log-entry.error {
            border-left-color: #f56565;
            color: #fc8181;
        }
        .log-entry.success {
            border-left-color: #48bb78;
            color: #9ae6b4;
        }
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .info-box h3 {
            margin-top: 0;
            color: #1976d2;
        }
        .info-box code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            color: #d81b60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Діагностика системи логіну</h1>

        <div id="envInfo" class="info-box">
            <h3>🌍 Інформація про середовище:</h3>
            <p><strong>Hostname:</strong> <code id="hostname"></code></p>
            <p><strong>Port:</strong> <code id="port"></code></p>
            <p><strong>Protocol:</strong> <code id="protocol"></code></p>
            <p><strong>API URL:</strong> <code id="apiUrl"></code></p>
        </div>

        <div class="status info" id="connectionStatus">
            ⏳ Перевірка з'єднання з API...
        </div>

        <div class="login-form">
            <h3>🔐 Тестування логіну</h3>
            <div class="input-group">
                <label for="username">👤 Логін:</label>
                <input type="text" id="username" value="admin" placeholder="admin">
            </div>
            <div class="input-group">
                <label for="password">🔒 Пароль:</label>
                <input type="password" id="password" value="admin123" placeholder="admin123">
            </div>
            <button onclick="testLogin()">🚀 Тест логіну</button>
            <button onclick="checkApiHealth()">🏥 Перевірити API</button>
            <button onclick="clearLogs()">🗑️ Очистити логи</button>
        </div>

        <div class="log" id="consoleLog">
            <div class="log-entry">📋 Лог діагностики:</div>
        </div>
    </div>

    <script>
        const consoleLogDiv = document.getElementById('consoleLog');
        
        function addLog(message, type = 'log') {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleLogDiv.appendChild(entry);
            consoleLogDiv.scrollTop = consoleLogDiv.scrollHeight;
            
            // Також виводити в реальну консоль
            console[type === 'error' ? 'error' : 'log'](message);
        }

        function clearLogs() {
            consoleLogDiv.innerHTML = '<div class="log-entry">📋 Лог діагностики (очищено):</div>';
        }

        function getApiUrl() {
            const hostname = window.location.hostname;
            let apiUrl;
            
            addLog(`🌍 Hostname: ${hostname}`);
            addLog(`🔌 Port: ${window.location.port}`);
            
            if (hostname.includes('.app.github.dev')) {
                // GitHub Codespaces
                apiUrl = window.location.protocol + '//' + 
                        hostname.replace('-8080.', '-3001.');
                addLog('🐙 Виявлено GitHub Codespaces');
            } else if (window.location.port === '8080') {
                // Локальна розробка
                apiUrl = 'http://localhost:3001';
                addLog('💻 Виявлено локальну розробку');
            } else {
                // Відносний шлях
                apiUrl = window.location.origin;
                addLog('🌐 Використання відносного шляху');
            }
            
            return apiUrl;
        }

        async function checkApiHealth() {
            addLog('🏥 Перевірка здоров\'я API...', 'log');
            const apiUrl = getApiUrl();
            const healthUrl = `${apiUrl}/api/health`;
            
            addLog(`📡 Запит до: ${healthUrl}`, 'log');
            
            try {
                const response = await fetch(healthUrl);
                addLog(`✅ Статус відповіді: ${response.status}`, 'success');
                
                const data = await response.json();
                addLog(`📦 Відповідь: ${JSON.stringify(data, null, 2)}`, 'success');
                
                document.getElementById('connectionStatus').className = 'status success';
                document.getElementById('connectionStatus').textContent = '✅ API працює!';
            } catch (error) {
                addLog(`❌ Помилка з'єднання: ${error.message}`, 'error');
                document.getElementById('connectionStatus').className = 'status error';
                document.getElementById('connectionStatus').textContent = '❌ API недоступний!';
            }
        }

        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            addLog('🔐 Початок тесту логіну...', 'log');
            addLog(`👤 Логін: ${username}`, 'log');
            addLog(`🔒 Довжина паролю: ${password.length}`, 'log');
            
            const apiUrl = getApiUrl();
            const loginUrl = `${apiUrl}/api/auth/login`;
            
            addLog(`📡 Відправка запиту до: ${loginUrl}`, 'log');
            
            const requestData = {
                username: username,
                password: password
            };
            
            addLog(`📤 Дані запиту: ${JSON.stringify(requestData, null, 2)}`, 'log');
            
            try {
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                addLog(`✅ Статус відповіді: ${response.status}`, response.ok ? 'success' : 'error');
                addLog(`📋 Status Text: ${response.statusText}`, 'log');
                
                const data = await response.json();
                addLog(`📦 Відповідь сервера: ${JSON.stringify(data, null, 2)}`, response.ok ? 'success' : 'error');
                
                if (response.ok && data.success) {
                    addLog('✅ ЛОГІН УСПІШНИЙ!', 'success');
                    addLog(`👤 Користувач: ${data.user.username}`, 'success');
                    addLog(`🎭 Роль: ${data.user.role}`, 'success');
                    addLog(`🔑 Токен отримано (${data.token.substring(0, 20)}...)`, 'success');
                    
                    document.getElementById('connectionStatus').className = 'status success';
                    document.getElementById('connectionStatus').textContent = '✅ Логін працює!';
                } else {
                    addLog(`❌ ЛОГІН НЕВДАЛИЙ: ${data.message}`, 'error');
                    document.getElementById('connectionStatus').className = 'status error';
                    document.getElementById('connectionStatus').textContent = '❌ Помилка логіну!';
                }
            } catch (error) {
                addLog(`❌ КРИТИЧНА ПОМИЛКА: ${error.message}`, 'error');
                addLog(`📋 Stack: ${error.stack}`, 'error');
                document.getElementById('connectionStatus').className = 'status error';
                document.getElementById('connectionStatus').textContent = '❌ Помилка з\'єднання!';
            }
        }

        // Ініціалізація при завантаженні
        window.addEventListener('DOMContentLoaded', () => {
            addLog('🚀 Сторінка завантажена', 'log');
            
            // Заповнення інформації про середовище
            document.getElementById('hostname').textContent = window.location.hostname;
            document.getElementById('port').textContent = window.location.port || '80';
            document.getElementById('protocol').textContent = window.location.protocol;
            
            const apiUrl = getApiUrl();
            document.getElementById('apiUrl').textContent = apiUrl + '/api/auth/login';
            
            // Автоматична перевірка API
            setTimeout(() => {
                addLog('🔄 Автоматична перевірка API...', 'log');
                checkApiHealth();
            }, 500);
        });
    </script>
</body>
</html>
