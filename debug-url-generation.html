<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Debug URL формування</title>
</head>
<body>
    <h1>🔍 Debug URL формування</h1>
    
    <div style="padding: 20px; background: #f0f0f0; margin: 20px 0; border-radius: 8px;">
        <h3>Поточні параметри:</h3>
        <p><strong>window.location.href:</strong> <span id="href"></span></p>
        <p><strong>window.location.port:</strong> <span id="port"></span></p>
        <p><strong>window.location.hostname:</strong> <span id="hostname"></span></p>
        <hr>
        <p><strong>Сформований API URL:</strong> <span id="api-url" style="color: red; font-weight: bold;"></span></p>
    </div>
    
    <button onclick="testUrlGeneration()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
        🧪 Тест формування URL
    </button>
    
    <button onclick="testActualLogin()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
        🔐 Тест реального логіну
    </button>
    
    <div id="results" style="padding: 20px; background: white; margin: 20px 0; border-radius: 8px; border: 1px solid #ddd;"></div>

    <script>
        function updateLocationInfo() {
            document.getElementById('href').textContent = window.location.href;
            document.getElementById('port').textContent = window.location.port;
            document.getElementById('hostname').textContent = window.location.hostname;
            
            // Формування API URL за тією ж логікою що і в login.html
            const apiUrl = window.location.port === '8080' 
                ? 'http://localhost:3001/api/auth/login' 
                : '/api/auth/login';
            
            document.getElementById('api-url').textContent = apiUrl;
            
            console.log('📍 Location info:', {
                href: window.location.href,
                port: window.location.port,
                hostname: window.location.hostname,
                generatedApiUrl: apiUrl
            });
        }
        
        function testUrlGeneration() {
            const results = document.getElementById('results');
            
            const port = window.location.port;
            const isPort8080 = port === '8080';
            const apiUrl = isPort8080 
                ? 'http://localhost:3001/api/auth/login' 
                : '/api/auth/login';
            
            let html = '<h3>🧪 Результат тесту формування URL:</h3>';
            html += `<p><strong>Поточний порт:</strong> "${port}"</p>`;
            html += `<p><strong>Порт === '8080':</strong> ${isPort8080}</p>`;
            html += `<p><strong>Сформований URL:</strong> "${apiUrl}"</p>`;
            
            if (isPort8080) {
                html += '<p style="color: green;">✅ Використовується абсолютний URL для API</p>';
            } else {
                html += '<p style="color: orange;">⚠️ Використовується відносний URL</p>';
            }
            
            results.innerHTML = html;
            
            console.log('🧪 URL Generation test:', { port, isPort8080, apiUrl });
        }
        
        async function testActualLogin() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>🔄 Тестуємо справжній логін...</h3>';
            
            const apiUrl = window.location.port === '8080' 
                ? 'http://localhost:3001/api/auth/login' 
                : '/api/auth/login';
            
            console.log('🔐 Тестуємо логін з URL:', apiUrl);
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                console.log('📨 Response:', response);
                console.log('📊 Status:', response.status);
                console.log('✅ OK:', response.ok);
                
                let html = '<h3>📊 Результат логіну:</h3>';
                html += `<p><strong>URL запиту:</strong> ${apiUrl}</p>`;
                html += `<p><strong>Status:</strong> ${response.status}</p>`;
                html += `<p><strong>OK:</strong> ${response.ok}</p>`;
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('📄 Data:', data);
                    
                    html += '<p style="color: green; font-weight: bold;">✅ ЛОГІН УСПІШНИЙ!</p>';
                    html += `<p><strong>Success:</strong> ${data.success}</p>`;
                    html += `<p><strong>User:</strong> ${data.user?.username} (${data.user?.role})</p>`;
                } else {
                    const errorText = await response.text();
                    console.log('❌ Error text:', errorText);
                    
                    html += '<p style="color: red; font-weight: bold;">❌ ПОМИЛКА ЛОГІНУ!</p>';
                    html += `<p><strong>Error:</strong> ${errorText}</p>`;
                }
                
                results.innerHTML = html;
                
            } catch (error) {
                console.error('❌ Fetch error:', error);
                
                results.innerHTML = `
                    <h3>❌ Помилка запиту</h3>
                    <p><strong>URL:</strong> ${apiUrl}</p>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p style="color: red;">Це та сама помилка що і в основному логіні!</p>
                `;
            }
        }
        
        // Ініціалізація при завантаженні
        document.addEventListener('DOMContentLoaded', () => {
            updateLocationInfo();
            console.log('🔍 Debug URL генератор готовий');
        });
    </script>
</body>
</html>
