<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Email Send</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background: #f5f5f5; }
        .log { margin: 5px 0; font-family: monospace; font-size: 13px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Тест відправки Email для Orçamento</h1>
    
    <div>
        <label>Orçamento ID:</label>
        <input type="text" id="orcamentoId" value="69676c0297460083f8f9364b" style="width: 300px;">
    </div>
    
    <div style="margin-top: 10px;">
        <label>Email:</label>
        <input type="email" id="email" value="ctaruj78@gmail.com" style="width: 300px;">
    </div>
    
    <div style="margin-top: 10px;">
        <label>JWT Token (з localStorage):</label>
        <input type="text" id="token" style="width: 500px;" placeholder="Буде заповнено автоматично">
    </div>
    
    <div style="margin-top: 20px;">
        <button onclick="testEmailSend()">📧 Відправити Email</button>
        <button onclick="getToken()">🔑 Отримати Token</button>
    </div>
    
    <div id="result"></div>

    <script>
        function log(message, type = 'log') {
            const result = document.getElementById('result');
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = message;
            result.appendChild(div);
            console.log(message);
        }

        function getToken() {
            const token = localStorage.getItem('liftmanager_jwt') || 
                         localStorage.getItem('jwt_token') ||
                         localStorage.getItem('token') || 
                         localStorage.getItem('lm_token');
            
            if (token) {
                document.getElementById('token').value = token;
                log('✅ Token знайдено: ' + token.substring(0, 50) + '...', 'success');
            } else {
                log('❌ Token не знайдено в localStorage', 'error');
                log('Доступні ключі: ' + Object.keys(localStorage).join(', '), 'log');
            }
        }

        async function testEmailSend() {
            const result = document.getElementById('result');
            result.innerHTML = '';
            
            log('🚀 Початок тесту відправки email');
            
            const orcamentoId = document.getElementById('orcamentoId').value;
            const email = document.getElementById('email').value;
            let token = document.getElementById('token').value;
            
            if (!token) {
                getToken();
                token = document.getElementById('token').value;
            }
            
            if (!token) {
                log('❌ Необхідно увійти в систему!', 'error');
                log('Відкрийте: /pages/auth/login.html', 'log');
                log('Login: info@festlift.pt', 'log');
                log('Password: admin123', 'log');
                return;
            }
            
            log('📋 Параметри:');
            log('   Orçamento ID: ' + orcamentoId);
            log('   Email: ' + email);
            log('   Token: ' + token.substring(0, 30) + '...');
            
            try {
                log('📤 Відправка запиту...');
                
                const response = await fetch(`/api/orcamentos/${orcamentoId}/enviar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email: email })
                });
                
                log('📨 Отримано відповідь:');
                log('   Status: ' + response.status);
                log('   Status Text: ' + response.statusText);
                log('   OK: ' + response.ok);
                
                const resultData = await response.json();
                log('📧 Результат: ' + JSON.stringify(resultData, null, 2));
                
                if (response.ok && resultData.success) {
                    log('✅ УСПІХ: ' + resultData.message, 'success');
                    alert('✅ ' + resultData.message);
                } else {
                    log('❌ ПОМИЛКА: ' + (resultData.message || resultData.error), 'error');
                    alert('❌ ' + (resultData.message || resultData.error));
                }
                
            } catch (error) {
                log('❌ Exception: ' + error.message, 'error');
                log('   Stack: ' + error.stack, 'error');
                alert('❌ Помилка: ' + error.message);
            }
        }
        
        // Автоматично отримати token при завантаженні
        window.onload = function() {
            getToken();
        };
    </script>
</body>
</html>
