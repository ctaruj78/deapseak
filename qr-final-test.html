<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>✅ QR - Фінальний тест</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }
        h1 { color: #11998e; margin-bottom: 30px; }
        #status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #d1ecf1; color: #0c5460; }
        #qr {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            min-height: 100px;
        }
        button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ QR Generator - Final Test</h1>
        
        <div id="status" class="loading">⏳ Завантаження...</div>
        
        <div id="qr"></div>
        
        <button id="btn" disabled>Генерувати QR</button>
    </div>

    <!-- Завантаження через qrcode-loader -->
    <script src="/assets/libs/qrcode-loader.js"></script>
    
    <script>
        const status = document.getElementById('status');
        const qrDiv = document.getElementById('qr');
        const btn = document.getElementById('btn');
        
        console.log('🚀 Початок тесту...');
        
        // Слухаємо подію завантаження бібліотеки
        window.addEventListener('qrcodeLoaded', function(e) {
            console.log('✅ Отримано подію qrcodeLoaded:', e.detail);
            checkAndEnable();
        });
        
        // Перевірка доступності
        let attempts = 0;
        const checker = setInterval(() => {
            attempts++;
            console.log(`Перевірка ${attempts}...`);
            
            if (typeof QRCode !== 'undefined' || typeof qrcode !== 'undefined') {
                clearInterval(checker);
                checkAndEnable();
            }
            
            if (attempts >= 50) {
                clearInterval(checker);
                status.className = 'error';
                status.textContent = '❌ Бібліотека не завантажилась';
            }
        }, 100);
        
        function checkAndEnable() {
            console.log('🔍 Перевірка змінних...');
            console.log('  qrcode:', typeof qrcode);
            console.log('  QRCode:', typeof QRCode);
            
            // Якщо є qrcode але немає QRCode
            if (typeof qrcode !== 'undefined' && typeof QRCode === 'undefined') {
                window.QRCode = qrcode;
                console.log('🔧 Створено window.QRCode');
            }
            
            if (typeof QRCode !== 'undefined') {
                status.className = 'success';
                status.textContent = '✅ Бібліотека готова!';
                btn.disabled = false;
                btn.onclick = generateQR;
            } else {
                status.className = 'error';
                status.textContent = '❌ QRCode не знайдено';
            }
        }
        
        function generateQR() {
            console.log('🎯 Генерація QR...');
            qrDiv.innerHTML = '';
            
            try {
                // ПРОСТИЙ виклик - тільки text, width, height
                new QRCode(qrDiv, {
                    text: 'LIFT-' + Date.now(),
                    width: 200,
                    height: 200
                });
                
                console.log('✅✅✅ УСПІХ!');
                status.className = 'success';
                status.textContent = '✅✅✅ QR КОД СТВОРЕНО! ✅✅✅';
            } catch (error) {
                console.error('❌ Помилка:', error);
                status.className = 'error';
                status.textContent = '❌ Помилка: ' + error.message;
                qrDiv.innerHTML = '<pre style="color: red; text-align: left;">' + error.stack + '</pre>';
            }
        }
    </script>
</body>
</html>
