<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Діагностика QRCode бібліотеки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status-box {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #ccc;
        }
        .success { border-left-color: #4CAF50; }
        .error { border-left-color: #f44336; }
        .warning { border-left-color: #ff9800; }
        .info { border-left-color: #2196F3; }
        
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #1976D2; }
        
        #qrContainer {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }
        
        pre {
            background: #263238;
            color: #aed581;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Діагностика QRCode бібліотеки</h1>
    
    <div id="status1" class="status-box warning">
        <h3>⏳ Крок 1: Завантаження бібліотеки...</h3>
        <p>Очікування завантаження QRCode.js</p>
    </div>
    
    <div id="status2" class="status-box" style="display:none;">
        <h3>📦 Крок 2: Інформація про бібліотеку</h3>
        <div id="libraryInfo"></div>
    </div>
    
    <div id="status3" class="status-box" style="display:none;">
        <h3>🎨 Крок 3: Генерація тестового QR</h3>
        <button onclick="testQRGeneration()">Згенерувати тестовий QR-код</button>
        <div id="qrContainer"></div>
    </div>
    
    <div class="status-box info">
        <h3>📊 Консольні логи:</h3>
        <pre id="console"></pre>
    </div>

    <!-- Завантаження QRCode з кількох джерел -->
    <script>
        const consoleDiv = document.getElementById('console');
        function log(msg, type = 'info') {
            console.log(msg);
            const line = document.createElement('div');
            line.textContent = msg;
            line.style.color = type === 'error' ? '#ef5350' : type === 'success' ? '#66bb6a' : '#aed581';
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        log('🚀 Початок діагностики...', 'info');
    </script>
    
    <!-- Спроба 1: jsdelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" 
            onload="log('✅ Завантажено з jsdelivr CDN', 'success');"
            onerror="log('❌ Помилка завантаження з jsdelivr CDN', 'error');">
    </script>
    
    <script>
        // Перевірка після невеликої затримки
        setTimeout(function() {
            const status1 = document.getElementById('status1');
            const status2 = document.getElementById('status2');
            const status3 = document.getElementById('status3');
            
            if (typeof QRCode !== 'undefined') {
                log('✅ QRCode бібліотека успішно завантажена!', 'success');
                status1.className = 'status-box success';
                status1.innerHTML = '<h3>✅ Крок 1: Бібліотека завантажена</h3><p>QRCode доступний для використання</p>';
                
                status2.style.display = 'block';
                status2.className = 'status-box success';
                
                // Показуємо інформацію про бібліотеку
                const info = `
                    <p><strong>Тип:</strong> ${typeof QRCode}</p>
                    <p><strong>Конструктор:</strong> ${typeof QRCode.toCanvas === 'function' ? '✅ Доступний' : '❌ Недоступний'}</p>
                    <p><strong>Методи:</strong></p>
                    <ul>
                        <li>toCanvas: ${typeof QRCode.toCanvas === 'function' ? '✅' : '❌'}</li>
                        <li>toDataURL: ${typeof QRCode.toDataURL === 'function' ? '✅' : '❌'}</li>
                        <li>toString: ${typeof QRCode.toString === 'function' ? '✅' : '❌'}</li>
                    </ul>
                `;
                document.getElementById('libraryInfo').innerHTML = info;
                
                status3.style.display = 'block';
                status3.className = 'status-box info';
                
                log('📦 Доступні методи QRCode:', 'info');
                log('  - toCanvas: ' + (typeof QRCode.toCanvas === 'function' ? '✅' : '❌'), 'info');
                log('  - toDataURL: ' + (typeof QRCode.toDataURL === 'function' ? '✅' : '❌'), 'info');
                
            } else {
                log('❌ QRCode бібліотека НЕ завантажена!', 'error');
                status1.className = 'status-box error';
                status1.innerHTML = '<h3>❌ Крок 1: Помилка завантаження</h3><p>QRCode бібліотека недоступна. Можливі причини:</p><ul><li>Відсутнє інтернет-з\'єднання</li><li>CDN недоступний</li><li>Блокування браузером</li></ul>';
                
                // Спроба завантажити з альтернативного джерела
                log('🔄 Спроба завантажити з альтернативного CDN...', 'info');
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js';
                script.onload = function() {
                    log('✅ Завантажено з unpkg CDN!', 'success');
                    window.location.reload(); // Перезавантажуємо для оновлення статусу
                };
                script.onerror = function() {
                    log('❌ Альтернативний CDN також недоступний', 'error');
                    status1.innerHTML += '<p><strong>Рішення:</strong> Перевірте інтернет-з\'єднання або спробуйте пізніше.</p>';
                };
                document.head.appendChild(script);
            }
        }, 1000);
        
        function testQRGeneration() {
            log('🎨 Початок генерації тестового QR...', 'info');
            
            if (typeof QRCode === 'undefined') {
                log('❌ QRCode недоступний для генерації', 'error');
                alert('QRCode бібліотека не завантажена!');
                return;
            }
            
            const container = document.getElementById('qrContainer');
            container.innerHTML = '<p>Генерація QR-коду...</p>';
            
            try {
                const canvas = document.createElement('canvas');
                
                const testData = {
                    test: true,
                    message: 'Тестовий QR-код',
                    timestamp: new Date().toISOString(),
                    municipalNumber: 'TEST-001'
                };
                
                log('📦 Дані для QR: ' + JSON.stringify(testData), 'info');
                
                QRCode.toCanvas(canvas, JSON.stringify(testData), {
                    width: 200,
                    height: 200,
                    margin: 2,
                    color: {
                        dark: '#000000',
                        light: '#FFFFFF'
                    }
                }, function(error) {
                    if (error) {
                        log('❌ Помилка генерації QR: ' + error.message, 'error');
                        container.innerHTML = '<p style="color: red;">Помилка: ' + error.message + '</p>';
                        return;
                    }
                    
                    log('✅ QR-код успішно згенеровано!', 'success');
                    container.innerHTML = '';
                    container.appendChild(canvas);
                    
                    const info = document.createElement('p');
                    info.innerHTML = '<strong>Успіх!</strong> QR-код створено з даних:<br><code>' + JSON.stringify(testData, null, 2) + '</code>';
                    info.style.marginTop = '10px';
                    container.appendChild(info);
                });
                
            } catch (err) {
                log('❌ Виняток при генерації: ' + err.message, 'error');
                container.innerHTML = '<p style="color: red;">Критична помилка: ' + err.message + '</p>';
            }
        }
    </script>
</body>
</html>
