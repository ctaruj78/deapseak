<!DOCTYPE html>
<html>
<head>
    <title>🔍 Тест з'єднання</title>
</head>
<body>
    <h1>🔍 Тест з'єднання з API</h1>
    <button onclick="testConnection()">Тестувати з'єднання</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>🔄 Тестуємо...</p>';
            
            console.log('🧪 Початок тесту з\'єднання');
            
            // Тест 1: Перевірка доступності API
            try {
                console.log('📡 Тест 1: Перевірка health endpoint...');
                const healthResponse = await fetch('http://localhost:3001/api/health');
                console.log('✅ Health response:', healthResponse);
                
                if (healthResponse.ok) {
                    result.innerHTML += '<p>✅ API health endpoint доступний</p>';
                } else {
                    result.innerHTML += '<p>❌ API health endpoint недоступний</p>';
                }
            } catch (error) {
                console.error('❌ Health test error:', error);
                result.innerHTML += `<p>❌ Помилка доступу до API: ${error.message}</p>`;
            }
            
            // Тест 2: Тест логіну
            try {
                console.log('🔐 Тест 2: Тест логіну...');
                const loginResponse = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                console.log('📨 Login response:', loginResponse);
                
                if (loginResponse.ok) {
                    const data = await loginResponse.json();
                    console.log('📄 Login data:', data);
                    result.innerHTML += '<p>✅ Логін API доступний</p>';
                    result.innerHTML += `<p>📊 Результат: ${data.success ? 'Успіх' : 'Невдача'}</p>`;
                } else {
                    result.innerHTML += '<p>❌ Логін API повернув помилку</p>';
                }
            } catch (error) {
                console.error('❌ Login test error:', error);
                result.innerHTML += `<p>❌ Помилка логіну: ${error.message}</p>`;
                
                // Детальна інформація про помилку
                result.innerHTML += `<p><strong>Тип помилки:</strong> ${error.name}</p>`;
                result.innerHTML += `<p><strong>Повідомлення:</strong> ${error.message}</p>`;
                
                if (error.message.includes('CORS')) {
                    result.innerHTML += '<p>🔍 Це CORS помилка - потрібно налаштувати проксі</p>';
                } else if (error.message.includes('Failed to fetch')) {
                    result.innerHTML += '<p>🔍 Помилка мережі - сервер недоступний або блокується</p>';
                }
            }
        }
        
        console.log('🔍 Тест з\'єднання готовий');
    </script>
</body>
</html>
