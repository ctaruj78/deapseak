<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест карти та геокодування</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Enhanced Lift Modal CSS -->
    <link rel="stylesheet" href="/assets/css/enhanced-lift-modal.css">
</head>
<body class="hold-transition sidebar-mini">
    <div class="wrapper">
        <!-- Content Wrapper -->
        <div class="content-wrapper" style="margin-left: 0;">
            <!-- Content Header -->
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">Тестування карти та геокодування</h1>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="card">
                                <div class="card-header bg-primary">
                                    <h3 class="card-title text-white">Інтерактивна карта</h3>
                                </div>
                                <div class="card-body">
                                    <div id="testMap" style="height: 400px; border: 1px solid #ddd; border-radius: 4px;">
                                        <div class="map-loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;">
                                            <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
                                            <p class="mt-2">Завантаження карти...</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-header bg-success">
                                    <h3 class="card-title text-white">Геокодування</h3>
                                </div>
                                <div class="card-body">
                                    <div class="form-group">
                                        <label for="testAddress">Адреса</label>
                                        <div class="input-group">
                                            <input type="text" id="testAddress" class="form-control" placeholder="Введіть адресу">
                                            <div class="input-group-append">
                                                <button type="button" class="btn btn-success" id="btnTestGeocode">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label for="testPostcode">Поштовий код</label>
                                        <input type="text" id="testPostcode" class="form-control" placeholder="01001">
                                    </div>
                                    
                                    <hr>
                                    
                                    <div class="form-group">
                                        <label for="testLat">Широта</label>
                                        <div class="input-group">
                                            <input type="number" id="testLat" class="form-control" step="0.000001" placeholder="50.4501">
                                            <div class="input-group-append">
                                                <button type="button" class="btn btn-outline-secondary" id="btnCopyTestLat">
                                                    <i class="fas fa-copy"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label for="testLng">Довгота</label>
                                        <div class="input-group">
                                            <input type="number" id="testLng" class="form-control" step="0.000001" placeholder="30.5234">
                                            <div class="input-group-append">
                                                <button type="button" class="btn btn-outline-secondary" id="btnCopyTestLng">
                                                    <i class="fas fa-copy"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group">
                                        <button type="button" class="btn btn-info btn-block" id="btnTestCurrentLocation">
                                            <i class="fas fa-crosshairs"></i> Моя локація
                                        </button>
                                    </div>
                                    
                                    <div class="form-group">
                                        <button type="button" class="btn btn-warning btn-block" id="btnTestReverseGeocode">
                                            <i class="fas fa-map-marker-alt"></i> Отримати адресу
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Результати -->
                            <div class="card">
                                <div class="card-header bg-info">
                                    <h3 class="card-title text-white">Результати</h3>
                                </div>
                                <div class="card-body">
                                    <div id="testResults">
                                        <em class="text-muted">Результати тестування з'являться тут...</em>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Приклади адрес -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header bg-warning">
                                    <h3 class="card-title">Приклади українських адрес для тестування</h3>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-3">
                                            <button class="btn btn-outline-primary btn-block mb-2" onclick="testAddress('Хрещатик 1, Київ')">
                                                Хрещатик 1, Київ
                                            </button>
                                        </div>
                                        <div class="col-md-3">
                                            <button class="btn btn-outline-primary btn-block mb-2" onclick="testAddress('Дерибасівська 1, Одеса')">
                                                Дерибасівська 1, Одеса
                                            </button>
                                        </div>
                                        <div class="col-md-3">
                                            <button class="btn btn-outline-primary btn-block mb-2" onclick="testAddress('пр. Свободи 1, Львів')">
                                                пр. Свободи 1, Львів
                                            </button>
                                        </div>
                                        <div class="col-md-3">
                                            <button class="btn btn-outline-primary btn-block mb-2" onclick="testAddress('пр. Соборний 1, Дніпро')">
                                                пр. Соборний 1, Дніпро
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let testMap = null;
        let testMarker = null;

        function showToast(message, type = 'info') {
            const toastClass = {
                'success': 'bg-success',
                'error': 'bg-danger',
                'warning': 'bg-warning',
                'info': 'bg-info'
            }[type] || 'bg-info';

            const toast = $(`
                <div class="toast ${toastClass} text-white" role="alert" data-delay="4000">
                    <div class="toast-body">
                        ${message}
                        <button type="button" class="ml-2 mb-1 close text-white" data-dismiss="toast">
                            <span>&times;</span>
                        </button>
                    </div>
                </div>
            `);

            $('#toastContainer').append(toast);
            toast.toast('show');
            
            toast.on('hidden.bs.toast', function() {
                $(this).remove();
            });
        }

        function logResult(operation, data) {
            const timestamp = new Date().toLocaleTimeString('uk-UA');
            const resultHtml = `
                <div class="alert alert-light border mb-2">
                    <strong>${operation}</strong> <small class="text-muted">${timestamp}</small><br>
                    <pre class="mb-0" style="font-size: 12px;">${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
            $('#testResults').prepend(resultHtml);
        }

        function initTestMap() {
            console.log('Initializing test map...');
            
            testMap = L.map('testMap', {
                center: [50.4501, 30.5234],
                zoom: 6,
                zoomControl: true
            });
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(testMap);
            
            testMap.on('click', function(e) {
                setTestLocation(e.latlng.lat, e.latlng.lng);
                reverseGeocode(e.latlng.lat, e.latlng.lng);
            });
            
            $('.map-loading').hide();
            console.log('Test map initialized');
        }

        function setTestLocation(lat, lng) {
            if (testMarker) {
                testMap.removeLayer(testMarker);
            }
            
            testMarker = L.marker([lat, lng], { draggable: true }).addTo(testMap);
            testMap.setView([lat, lng], 15);
            
            testMarker.bindPopup(`
                <strong>Тестова локація</strong><br>
                Широта: ${lat.toFixed(6)}<br>
                Довгота: ${lng.toFixed(6)}
            `).openPopup();
            
            testMarker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                $('#testLat').val(pos.lat.toFixed(6));
                $('#testLng').val(pos.lng.toFixed(6));
                reverseGeocode(pos.lat, pos.lng);
            });
            
            $('#testLat').val(lat.toFixed(6));
            $('#testLng').val(lng.toFixed(6));
        }

        async function geocodeTest() {
            const address = $('#testAddress').val().trim();
            const postcode = $('#testPostcode').val().trim();
            
            if (!address && !postcode) {
                showToast('Введіть адресу або поштовий код', 'warning');
                return;
            }

            const btn = $('#btnTestGeocode');
            btn.html('<i class="fas fa-spinner fa-spin"></i>').prop('disabled', true);

            try {
                let query = '';
                if (address && postcode) {
                    query = `${address}, ${postcode}`;
                } else if (address) {
                    query = address;
                } else {
                    query = postcode;
                }
                
                query += ', Ukraine';
                
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=3&countrycodes=ua&addressdetails=1`;
                
                const response = await fetch(url, {
                    headers: { 'User-Agent': 'DeepSpeak Test Application' }
                });
                
                const data = await response.json();
                
                logResult('Геокодування', { query, results: data.length, data: data.slice(0, 2) });
                
                if (data && data.length > 0) {
                    const result = data[0];
                    const lat = parseFloat(result.lat);
                    const lng = parseFloat(result.lon);
                    
                    setTestLocation(lat, lng);
                    showToast('Координати знайдено', 'success');
                    
                    if (result.address && result.address.postcode && !postcode) {
                        $('#testPostcode').val(result.address.postcode);
                    }
                } else {
                    showToast('Адресу не знайдено', 'error');
                }
            } catch (error) {
                console.error('Geocoding error:', error);
                showToast('Помилка геокодування', 'error');
                logResult('Помилка геокодування', { error: error.message });
            } finally {
                btn.html('<i class="fas fa-search"></i>').prop('disabled', false);
            }
        }

        async function reverseGeocode(lat, lng) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1`;
                
                const response = await fetch(url, {
                    headers: { 'User-Agent': 'DeepSpeak Test Application' }
                });
                
                const data = await response.json();
                
                logResult('Зворотне геокодування', { coordinates: `${lat}, ${lng}`, data });
                
                if (data && data.address) {
                    const addr = data.address;
                    const addressParts = [];
                    
                    if (addr.road) addressParts.push(addr.road);
                    if (addr.house_number) addressParts.push(addr.house_number);
                    if (addr.city || addr.town || addr.village) {
                        addressParts.push(addr.city || addr.town || addr.village);
                    }
                    
                    const fullAddress = addressParts.join(', ');
                    
                    if (fullAddress && !$('#testAddress').val()) {
                        $('#testAddress').val(fullAddress);
                    }
                    
                    if (addr.postcode && !$('#testPostcode').val()) {
                        $('#testPostcode').val(addr.postcode);
                    }
                }
            } catch (error) {
                console.error('Reverse geocoding error:', error);
                logResult('Помилка зворотного геокодування', { error: error.message });
            }
        }

        async function getCurrentLocationTest() {
            if (!navigator.geolocation) {
                showToast('Геолокація не підтримується', 'error');
                return;
            }

            const btn = $('#btnTestCurrentLocation');
            btn.html('<i class="fas fa-spinner fa-spin"></i> Визначення...').prop('disabled', true);

            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    });
                });

                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                logResult('Поточна локація', { lat, lng, accuracy });

                setTestLocation(lat, lng);
                await reverseGeocode(lat, lng);

                showToast(`Локація визначена (точність: ${Math.round(accuracy)}м)`, 'success');

            } catch (error) {
                console.error('Geolocation error:', error);
                showToast(`Помилка геолокації: ${error.message}`, 'error');
                logResult('Помилка геолокації', { error: error.message, code: error.code });
            } finally {
                btn.html('<i class="fas fa-crosshairs"></i> Моя локація').prop('disabled', false);
            }
        }

        async function copyToClipboard(text, message) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(message, 'success');
            } catch (error) {
                showToast('Помилка копіювання', 'error');
            }
        }

        function testAddress(address) {
            $('#testAddress').val(address);
            $('#testPostcode').val('');
            geocodeTest();
        }

        $(document).ready(function() {
            // Ініціалізація карти
            setTimeout(initTestMap, 100);
            
            // Event listeners
            $('#btnTestGeocode').on('click', geocodeTest);
            $('#btnTestCurrentLocation').on('click', getCurrentLocationTest);
            $('#btnTestReverseGeocode').on('click', function() {
                const lat = parseFloat($('#testLat').val());
                const lng = parseFloat($('#testLng').val());
                if (!isNaN(lat) && !isNaN(lng)) {
                    reverseGeocode(lat, lng);
                } else {
                    showToast('Введіть правильні координати', 'warning');
                }
            });
            
            $('#btnCopyTestLat').on('click', function() {
                copyToClipboard($('#testLat').val(), 'Широту скопійовано');
            });
            
            $('#btnCopyTestLng').on('click', function() {
                copyToClipboard($('#testLng').val(), 'Довготу скопійовано');
            });
            
            $('#testLat, #testLng').on('change', function() {
                const lat = parseFloat($('#testLat').val());
                const lng = parseFloat($('#testLng').val());
                
                if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                    setTestLocation(lat, lng);
                }
            });
            
            // Test with Kyiv coordinates
            setTimeout(function() {
                setTestLocation(50.4501, 30.5234);
            }, 1000);
        });
    </script>
</body>
</html>
