<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>📱 QR Сканер - Перевірка на місці</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .scanner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .scan-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            margin: 20px 0;
            background: #f8f9fa;
        }
        .scan-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #5568d3;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: bold;
            color: #495057;
        }
        .value {
            color: #212529;
        }
        .location {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }
        .example {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="scanner">
        <h1>📱 QR Сканер</h1>
        <p class="subtitle">Перевірка локації техніка</p>

        <div class="example">
            <strong>💡 Приклад використання:</strong><br>
            1. Технік приїжджає на адресу<br>
            2. Сканує QR код на ліфті<br>
            3. Диспетчер отримує: номер ліфта + адресу<br>
            4. Підтверджує що технік на правильному об'єкті
        </div>

        <div class="scan-area">
            <div class="scan-icon">📷</div>
            <p>Наведіть камеру на QR код<br>або введіть дані вручну</p>
        </div>

        <input type="text" 
               id="qrInput" 
               placeholder='Введіть або вставте дані QR: {"id":"...","lift":1,"addr":"..."}'
               autofocus>
        
        <button onclick="processQR()">🔍 Перевірити</button>

        <!-- Тестові кнопки -->
        <div style="margin-top: 20px;">
            <button onclick="testQR1()" style="background: #28a745;">
                ✅ Тест: Правильний QR
            </button>
            <button onclick="testQR2()" style="background: #ffc107; color: #000;">
                ⚠️ Тест: Старий формат
            </button>
            <button onclick="testQR3()" style="background: #dc3545;">
                ❌ Тест: Невалідний
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        function processQR() {
            const input = document.getElementById('qrInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!input) {
                showError('Введіть дані QR коду');
                return;
            }

            console.log('🔍 Обробка QR:', input);

            // Спроба розпарсити JSON
            try {
                const data = JSON.parse(input);
                
                if (data.id && data.addr) {
                    // Новий формат - все ОК!
                    showSuccess(data);
                } else if (data.municipalNumber) {
                    // Старий формат
                    showWarning(data);
                } else {
                    showError('Невідомий формат QR коду');
                }
            } catch (e) {
                // Можливо це просто номер (старий формат)
                if (input.match(/^[A-Z0-9\/-]+$/i)) {
                    showWarning({ municipalNumber: input });
                } else {
                    showError('Невалідний QR код: ' + e.message);
                }
            }
        }

        function showSuccess(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result success';
            resultDiv.style.display = 'block';
            
            resultDiv.innerHTML = `
                <h3 style="margin-top:0; color: #28a745;">✅ Дані отримано!</h3>
                
                <div class="info-row">
                    <span class="label">📋 Муніципальний номер:</span>
                    <span class="value">${data.id}</span>
                </div>
                
                <div class="info-row">
                    <span class="label">🏢 Ліфт №:</span>
                    <span class="value">${data.lift || 'не вказано'}</span>
                </div>
                
                <div class="location">
                    <strong>📍 Локація техніка:</strong><br>
                    ${data.addr}
                </div>
                
                <div style="margin-top: 15px; padding: 10px; background: #fff; border-radius: 5px;">
                    <small style="color: #666;">
                        ⏰ Час сканування: ${new Date().toLocaleTimeString('uk-UA')}<br>
                        📊 Розмір даних: ${JSON.stringify(data).length} символів
                    </small>
                </div>
            `;
            
            console.log('✅ Успішно розпарсено:', data);
        }

        function showWarning(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result';
            resultDiv.style.background = '#fff3cd';
            resultDiv.style.border = '2px solid #ffc107';
            resultDiv.style.display = 'block';
            
            resultDiv.innerHTML = `
                <h3 style="margin-top:0; color: #856404;">⚠️ Старий формат QR</h3>
                <p>Отримано тільки номер: <strong>${data.municipalNumber || data}</strong></p>
                <p>❌ Адреса відсутня - диспетчер не знає де технік!</p>
                <p style="font-size: 13px; color: #666;">
                    Рекомендація: Згенеруйте новий QR код з адресою
                </p>
            `;
            
            console.warn('⚠️ Старий формат без адреси');
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result error';
            resultDiv.style.display = 'block';
            
            resultDiv.innerHTML = `
                <h3 style="margin-top:0; color: #dc3545;">❌ Помилка</h3>
                <p>${message}</p>
            `;
            
            console.error('❌', message);
        }

        // Тестові функції
        function testQR1() {
            document.getElementById('qrInput').value = JSON.stringify({
                id: 'CML-123/456',
                lift: 1,
                addr: 'вул. Тараса Шевченка, будинок 10'
            });
            processQR();
        }

        function testQR2() {
            document.getElementById('qrInput').value = 'CML-123/456';
            processQR();
        }

        function testQR3() {
            document.getElementById('qrInput').value = '{invalid json}';
            processQR();
        }

        // Enter для швидкої обробки
        document.getElementById('qrInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processQR();
            }
        });
    </script>
</body>
</html>
