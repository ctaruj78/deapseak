<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Тест локальної QR бібліотеки</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            color: #333;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        .qr-container {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        canvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .log {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Тест локальної QR бібліотеки</h1>

        <div id="libraryStatus" class="status info">
            ⏳ Завантаження бібліотеки...
        </div>

        <div class="input-group">
            <label for="textInput">📝 Введіть текст для QR-коду:</label>
            <input type="text" id="textInput" placeholder="Наприклад: LIFT-001 або https://example.com" value="LIFT-TEST-001">
        </div>

        <button id="generateBtn" disabled>🚀 Генерувати QR-код</button>

        <div class="qr-container" id="qrContainer" style="display: none;">
            <h3>✅ Згенерований QR-код:</h3>
            <canvas id="qrCanvas"></canvas>
        </div>

        <div class="log" id="consoleLog">
            <div class="log-entry">📋 Лог консолі:</div>
        </div>
    </div>

    <!-- Локальна бібліотека через завантажувач -->
    <script src="/assets/libs/qrcode-loader.js"></script>

    <script>
        const statusDiv = document.getElementById('libraryStatus');
        const generateBtn = document.getElementById('generateBtn');
        const textInput = document.getElementById('textInput');
        const qrContainer = document.getElementById('qrContainer');
        const qrCanvas = document.getElementById('qrCanvas');
        const consoleLogDiv = document.getElementById('consoleLog');

        // Перехоплення console.log
        const originalLog = console.log;
        const originalError = console.error;
        
        function addLogEntry(message, type = 'log') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.borderLeftColor = type === 'error' ? '#f56565' : '#667eea';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleLogDiv.appendChild(entry);
            consoleLogDiv.scrollTop = consoleLogDiv.scrollHeight;
            
            // Також виводити в реальну консоль
            if (type === 'error') {
                originalError(message);
            } else {
                originalLog(message);
            }
        }

        console.log = function(...args) {
            addLogEntry(args.join(' '), 'log');
        };

        console.error = function(...args) {
            addLogEntry(args.join(' '), 'error');
        };

        addLogEntry('🚀 Сторінка завантажена, очікування QRCode бібліотеки...');

        // Перевірка доступності бібліотеки
        let checkAttempts = 0;
        const maxCheckAttempts = 50;

        function checkQRCodeLibrary() {
            checkAttempts++;
            addLogEntry(`🔍 Перевірка бібліотеки (спроба ${checkAttempts}/${maxCheckAttempts})...`);

            if (typeof QRCode !== 'undefined') {
                addLogEntry('✅ QRCode бібліотека завантажена!');
                addLogEntry(`📦 Тип: ${typeof QRCode}`);
                addLogEntry(`🔧 Метод toCanvas: ${typeof QRCode.toCanvas}`);
                
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Бібліотека завантажена успішно! Готово до генерації.';
                generateBtn.disabled = false;
                return;
            }

            if (checkAttempts >= maxCheckAttempts) {
                addLogEntry('❌ Бібліотека не завантажилась після 50 спроб');
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Не вдалося завантажити бібліотеку. Перевірте консоль.';
                return;
            }

            setTimeout(checkQRCodeLibrary, 100);
        }

        // Почати перевірку через 100мс
        setTimeout(checkQRCodeLibrary, 100);

        // Генерація QR-коду
        generateBtn.addEventListener('click', function() {
            const text = textInput.value.trim();
            
            if (!text) {
                addLogEntry('⚠️ Введіть текст для QR-коду', 'error');
                alert('Будь ласка, введіть текст!');
                return;
            }

            addLogEntry(`🎯 Генерація QR для тексту: "${text}"`);

            try {
                // Очистити попередній QR
                const ctx = qrCanvas.getContext('2d');
                ctx.clearRect(0, 0, qrCanvas.width, qrCanvas.height);

                addLogEntry('🔧 Виклик QRCode.toCanvas()...');

                QRCode.toCanvas(qrCanvas, text, {
                    width: 300,
                    margin: 2,
                    color: {
                        dark: '#000000',
                        light: '#ffffff'
                    }
                }, function(error) {
                    if (error) {
                        addLogEntry(`❌ Помилка генерації: ${error.message}`, 'error');
                        statusDiv.className = 'status error';
                        statusDiv.textContent = `❌ Помилка: ${error.message}`;
                    } else {
                        addLogEntry('✅ QR-код успішно згенеровано!');
                        qrContainer.style.display = 'block';
                        statusDiv.className = 'status success';
                        statusDiv.textContent = '✅ QR-код успішно створено!';
                    }
                });

            } catch (error) {
                addLogEntry(`❌ Виняток: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Помилка: ${error.message}`;
            }
        });

        // Генерація по Enter
        textInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !generateBtn.disabled) {
                generateBtn.click();
            }
        });
    </script>
</body>
</html>
