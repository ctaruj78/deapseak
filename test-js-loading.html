<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Тест завантаження JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }
        .test-item.success {
            border-left-color: #28a745;
        }
        .test-item.error {
            border-left-color: #dc3545;
        }
        .code {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            font-family: monospace;
            margin-top: 10px;
        }
        h1 { color: #333; }
        .status { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🧪 Тест завантаження JavaScript модулів</h1>
    <p>Перевірка чи всі скрипти завантажилися коректно:</p>
    
    <div id="results"></div>
    
    <hr style="margin: 30px 0;">
    
    <div>
        <h2>📋 Інструкція:</h2>
        <ol>
            <li>Натисніть <strong>Ctrl+Shift+Delete</strong></li>
            <li>Очистіть кеш та cookies</li>
            <li>Залогіньтесь: <a href="/login.html">Login</a></li>
            <li>Відкрийте: <a href="/pages/client/my-lifts.html?t=1768338689">My Lifts</a></li>
        </ol>
    </div>

    <script>
        const tests = [
            {
                name: 'jQuery',
                check: () => typeof $ !== 'undefined' && typeof jQuery !== 'undefined',
                description: 'Бібліотека jQuery для DOM маніпуляцій'
            },
            {
                name: 'AuthManager',
                check: () => typeof AuthManager !== 'undefined' && typeof AuthManager.fetchWithAuth === 'function',
                description: 'Клас для автентифікації та API запитів з JWT'
            },
            {
                name: 'LiftsManager',
                check: () => typeof LiftsManager !== 'undefined',
                description: 'Менеджер для управління списком ліфтів'
            },
            {
                name: 'localStorage',
                check: () => typeof localStorage !== 'undefined',
                description: 'Сховище браузера для збереження токенів'
            },
            {
                name: 'fetch API',
                check: () => typeof fetch !== 'undefined',
                description: 'Нативний API браузера для HTTP запитів'
            }
        ];

        const resultsDiv = document.getElementById('results');
        
        tests.forEach(test => {
            const div = document.createElement('div');
            div.className = 'test-item';
            
            try {
                const result = test.check();
                div.classList.add(result ? 'success' : 'error');
                
                div.innerHTML = `
                    <div class="status">${result ? '✅' : '❌'} ${test.name}</div>
                    <div>${test.description}</div>
                    <div class="code">Status: ${result ? 'Завантажено' : 'Не знайдено'}</div>
                `;
            } catch (error) {
                div.classList.add('error');
                div.innerHTML = `
                    <div class="status">❌ ${test.name}</div>
                    <div>${test.description}</div>
                    <div class="code">Error: ${error.message}</div>
                `;
            }
            
            resultsDiv.appendChild(div);
        });

        // Додаткова інформація
        const infoDiv = document.createElement('div');
        infoDiv.className = 'test-item';
        infoDiv.innerHTML = `
            <div class="status">ℹ️ Системна інформація</div>
            <div class="code">
                User Agent: ${navigator.userAgent}<br>
                URL: ${window.location.href}<br>
                Timestamp: ${new Date().toISOString()}<br>
                localStorage token: ${localStorage.getItem('token') ? '✅ Існує' : '❌ Відсутній'}
            </div>
        `;
        resultsDiv.appendChild(infoDiv);
    </script>

    <!-- Підключаємо модулі для тестування -->
    <script src="/assets/js/auth.js?v=1768338689"></script>
    <script src="/assets/js/modules/lifts-manager.js?v=1768338689"></script>
    
    <script>
        // Ретестуємо після завантаження скриптів
        setTimeout(() => {
            console.log('🧪 Ретест після завантаження скриптів...');
            console.log('AuthManager:', typeof AuthManager);
            console.log('LiftsManager:', typeof LiftsManager);
            
            if (typeof AuthManager !== 'undefined') {
                console.log('✅ AuthManager.fetchWithAuth:', typeof AuthManager.fetchWithAuth);
                console.log('✅ AuthManager.isAuthenticated:', typeof AuthManager.isAuthenticated);
            }
            
            if (typeof LiftsManager !== 'undefined') {
                console.log('✅ LiftsManager constructor:', typeof LiftsManager.prototype.loadLifts);
            }
        }, 500);
    </script>
</body>
</html>
