<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест централізованого логіну</title>
    <script src="security.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 3px; cursor: pointer; }
        .primary { background-color: #007bff; color: white; }
        .danger { background-color: #dc3545; color: white; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🔐 Тест централізованого логіну</h1>
    
    <div class="test-result info">
        <h3>Поточний статус авторизації:</h3>
        <p id="auth-status">Перевіряємо...</p>
    </div>
    
    <div class="test-result">
        <h3>Тест логіну:</h3>
        <input type="text" id="test-email" placeholder="Email" value="admin@example.com">
        <input type="password" id="test-password" placeholder="Пароль" value="password">
        <br>
        <button class="primary" onclick="testLogin()">Тестувати логін</button>
        <button class="danger" onclick="testLogout()">Тестувати вихід</button>
    </div>
    
    <div class="test-result">
        <h3>Тест API:</h3>
        <button class="primary" onclick="testAPI()">Тестувати /api/auth/login</button>
        <button class="primary" onclick="testGetLifts()">Тестувати /api/lifts</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        let results = [];
        
        function addResult(message, type = 'info') {
            results.push({ message, type, timestamp: new Date().toLocaleTimeString() });
            updateResults();
        }
        
        function updateResults() {
            const container = document.getElementById('results');
            container.innerHTML = results.map(r => 
                `<div class="test-result ${r.type}">
                    <strong>[${r.timestamp}]</strong> ${r.message}
                </div>`
            ).join('');
        }
        
        function updateAuthStatus() {
            const statusEl = document.getElementById('auth-status');
            
            if (typeof AuthManager === 'undefined') {
                statusEl.innerHTML = '❌ AuthManager не завантажено';
                return;
            }
            
            const isAuth = AuthManager.isAuthenticated();
            const user = AuthManager.getCurrentUser();
            
            if (isAuth && user) {
                statusEl.innerHTML = `✅ Авторизовано як: <strong>${user.email || user.username}</strong> (${user.role})`;
            } else {
                statusEl.innerHTML = '❌ Не авторизовано';
            }
        }
        
        async function testLogin() {
            const email = document.getElementById('test-email').value;
            const password = document.getElementById('test-password').value;
            
            addResult(`🔄 Тестуємо логін: ${email}`, 'info');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    AuthManager.login(data.token, data.user);
                    addResult(`✅ Логін успішний! Роль: ${data.user.role}`, 'success');
                    updateAuthStatus();
                } else {
                    addResult(`❌ Помилка логіну: ${data.message}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Помилка запиту: ${error.message}`, 'error');
            }
        }
        
        function testLogout() {
            addResult('🔄 Тестуємо вихід з системи', 'info');
            AuthManager.logout();
            addResult('✅ Вихід виконано', 'success');
            updateAuthStatus();
        }
        
        async function testAPI() {
            addResult('🔄 Тестуємо доступність API', 'info');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'test', password: 'test' })
                });
                
                if (response.status === 401 || response.status === 400) {
                    addResult('✅ API доступний (отримано очікувану помилку)', 'success');
                } else {
                    addResult(`ℹ️ API відповів зі статусом: ${response.status}`, 'info');
                }
            } catch (error) {
                addResult(`❌ API недоступний: ${error.message}`, 'error');
            }
        }
        
        async function testGetLifts() {
            addResult('🔄 Тестуємо доступ до ліфтів', 'info');
            
            try {
                const response = await AuthManager.fetchWithAuth('/api/lifts');
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Ліфти завантажено: ${data.length || 0} записів`, 'success');
                } else {
                    addResult(`❌ Помилка доступу до ліфтів: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Помилка запиту ліфтів: ${error.message}`, 'error');
            }
        }
        
        // Ініціалізація при завантаженні
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthStatus();
            addResult('🚀 Тест централізованого логіну ініціалізовано', 'success');
        });
        
        // Оновлювати статус кожні 2 секунди
        setInterval(updateAuthStatus, 2000);
    </script>
</body>
</html>
