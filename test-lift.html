<!DOCTYPE html>
<html>
<head>
    <title>Test Lift Form</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/lifts.js"></script>
</head>
<body>
    <h1>Test Lift Form</h1>
    <button id="test-init">Test Init</button>
    <button id="test-save">Test Save</button>
    <div id="output"></div>

    <script>
        $(document).ready(function() {
            console.log('Test page loaded');

            $('#test-init').on('click', function() {
                console.log('Testing LiftManager init...');
                if (typeof LiftManager !== 'undefined') {
                    window.liftManager = new LiftManager();
                    $('#output').append('<p>LiftManager initialized</p>');
                } else {
                    $('#output').append('<p>LiftManager not found</p>');
                }
            });

            $('#test-save').on('click', function() {
                console.log('Testing save...');
                if (window.liftManager) {
                    window.liftManager.saveLift();
                    $('#output').append('<p>Save called</p>');
                } else {
                    $('#output').append('<p>LiftManager not initialized</p>');
                }
            });
        });
    </script>
</body>
</html>
