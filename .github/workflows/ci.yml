# GitHub Actions CI/CD для deapseak

name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint || echo 'Linting не налаштовано'
      - name: Run unit tests
        run: npm test || echo 'Тести не налаштовано'
      - name: Build (за потреби)
        run: npm run build || echo 'Збірка не налаштована'
