<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Quick Login Test</title>
</head>
<body>
    <h1>Quick Login Test</h1>
    <button onclick="quickLogin()">Логін як Admin</button>
    <button onclick="goToDashboard()">Перейти до Dashboard</button>
    <div id="status"></div>

    <script>
        function quickLogin() {
            // Створюємо фейкову сесію
            const session = {
                user: {
                    username: 'admin',
                    role: 'admin',
                    firstName: 'Адмін'
                },
                token: 'fake-token-for-test',
                expiresAt: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString()
            };
            
            localStorage.setItem('lm_session', JSON.stringify(session));
            document.getElementById('status').innerHTML = '✅ Сесія створена';
        }
        
        function goToDashboard() {
            window.location.href = 'pages/admin/admin-dashboard.html';
        }
    </script>
</body>
</html>
