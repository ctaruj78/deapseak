<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід - DeapSeaK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            text-align: center;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.show { display: block; }
        .demo-info {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            font-size: 12px;
            color: #333;
        }
        .demo-info strong { color: #667eea; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Вхід</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required value="admin@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" required value="admin123">
            </div>
            
            <button type="submit">Увійти</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="demo-info">
            <strong>Демо акаунти:</strong><br>
            👨‍💼 <strong>admin@example.com</strong> / admin123<br>
            📞 <strong>dispatcher1@example.com</strong> / dispatcher123<br>
            🔧 <strong>tech1@example.com</strong> / tech123<br>
            👤 <strong>client1@example.com</strong> / client123
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            try {
                // Визначаємо API URL
                const hostname = window.location.hostname;
                const protocol = window.location.protocol;
                let apiUrl = '';
                
                if (hostname.includes('.app.github.dev')) {
                    // GitHub Codespaces
                    apiUrl = protocol + '//' + hostname.replace('-8080.', '-3001.') + '/api/auth/login';
                } else {
                    // Локальна розробка
                    apiUrl = 'http://localhost:3001/api/auth/login';
                }
                
                console.log('📍 API URL:', apiUrl);
                
                // Відправляємо запит входу
                messageDiv.textContent = 'Входимо...';
                messageDiv.className = 'message show';
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email,
                        password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Збереження даних
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    messageDiv.textContent = `✅ Успіх! Перенаправляємо...`;
                    messageDiv.className = 'message show success';
                    
                    // Визначаємо шлях редиректу
                    let redirectPath = '/pages/admin/admin-dashboard.html';
                    switch(data.user.role) {
                        case 'admin': redirectPath = '/pages/admin/admin-dashboard.html'; break;
                        case 'dispatcher': redirectPath = '/pages/dispatcher/dashboard.html'; break;
                        case 'technician':
                        case 'tech': redirectPath = '/pages/tech/dashboard.html'; break;
                        case 'client': redirectPath = '/pages/client/dashboard.html'; break;
                    }
                    
                    console.log('🔄 Редирект на:', redirectPath);
                    
                    // Перенаправляємо через 1 секунду
                    setTimeout(() => {
                        window.location.href = redirectPath;
                    }, 1000);
                } else {
                    messageDiv.textContent = `❌ ${data.message || 'Помилка входу'}`;
                    messageDiv.className = 'message show error';
                    console.error('Помилка:', data);
                }
            } catch (error) {
                messageDiv.textContent = `❌ Помилка: ${error.message}`;
                messageDiv.className = 'message show error';
                console.error('❌ Критична помилка:', error);
            }
        });
    </script>
</body>
</html>
