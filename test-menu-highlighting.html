<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест підсвічування меню</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <style>
        .nav-link.active {
            background-color: #007bff !important;
            color: white !important;
            font-weight: bold;
        }
        
        .test-section {
            padding: 20px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .status {
            padding: 5px 10px;
            border-radius: 3px;
            margin: 5px 0;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>🧪 Тест системи підсвічування меню</h1>
        
        <div class="test-section">
            <h3>📋 Імітація меню</h3>
            <ul class="nav nav-pills nav-sidebar flex-column">
                <li class="nav-item">
                    <a href="#" class="nav-link" id="menu-analytics" data-target="analytics">
                        📊 Аналітика
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" id="menu-ai-predictive" data-target="ai-predictive">
                        🤖 AI Прогнозування
                    </a>
                </li>
            </ul>
        </div>
        
        <div class="test-section">
            <h3>🔧 Управління</h3>
            <button class="btn btn-primary" onclick="testAnalytics()">Тест Аналітики</button>
            <button class="btn btn-success" onclick="testAIPredictive()">Тест AI Прогнозування</button>
            <button class="btn btn-warning" onclick="checkSessionStorage()">Перевірити sessionStorage</button>
            <button class="btn btn-info" onclick="clearStorage()">Очистити storage</button>
        </div>
        
        <div class="test-section">
            <h3>📊 Результати</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        // Імплементація логіки меню з lifts.html
        function updateMenuActiveState(activeMenuItem) {
            const menuItems = document.querySelectorAll('.nav-link');
            
            menuItems.forEach(item => {
                item.classList.remove('active');
            });
            
            const activeMenu = document.getElementById('menu-' + activeMenuItem);
            if (activeMenu) {
                activeMenu.classList.add('active');
                return true;
            }
            return false;
        }

        // Обробники кліків
        document.addEventListener('DOMContentLoaded', function() {
            // Обробник кліків по меню
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = this.getAttribute('data-target');
                    
                    sessionStorage.setItem('activeMenuItem', target);
                    updateMenuActiveState(target);
                    
                    logResult(`✅ Натиснуто: ${this.textContent.trim()}, активний пункт: ${target}`, 'success');
                });
            });
            
            // Перевірка стану при завантаженні
            const activeItem = sessionStorage.getItem('activeMenuItem');
            if (activeItem) {
                updateMenuActiveState(activeItem);
                logResult(`🔄 Відновлено стан: ${activeItem}`, 'info');
            }
        });

        function testAnalytics() {
            sessionStorage.setItem('activeMenuItem', 'analytics');
            const success = updateMenuActiveState('analytics');
            logResult(`Тест Аналітики: ${success ? 'УСПІХ' : 'ПОМИЛКА'}`, success ? 'success' : 'error');
        }

        function testAIPredictive() {
            sessionStorage.setItem('activeMenuItem', 'ai-predictive');
            const success = updateMenuActiveState('ai-predictive');
            logResult(`Тест AI Прогнозування: ${success ? 'УСПІХ' : 'ПОМИЛКА'}`, success ? 'success' : 'error');
        }

        function checkSessionStorage() {
            const activeItem = sessionStorage.getItem('activeMenuItem');
            logResult(`SessionStorage 'activeMenuItem': ${activeItem || 'НЕ ВСТАНОВЛЕНО'}`, 'info');
        }

        function clearStorage() {
            sessionStorage.removeItem('activeMenuItem');
            document.querySelectorAll('.nav-link').forEach(item => {
                item.classList.remove('active');
            });
            logResult('🧹 SessionStorage очищено', 'info');
        }

        function logResult(message, type) {
            const results = document.getElementById('results');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `[${time}] ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }
    </script>
</body>
</html>
