<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Тест AI Прогнозування</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <style>
        .test-card {
            margin: 10px 0;
            border-radius: 10px;
        }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Тест AI Прогнозування</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card test-card">
                    <div class="card-header">
                        <h5>🤖 AI Система</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="testAISystem()">Тест AI Системи</button>
                        <button class="btn btn-success" onclick="testChart()">Тест Графіка</button>
                        <button class="btn btn-info" onclick="testRecommendations()">Тест Рекомендацій</button>
                        <hr>
                        <div id="ai-recommendations"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card test-card">
                    <div class="card-header">
                        <h5>📊 Графік</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="prediction-chart" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card test-card">
            <div class="card-header">
                <h5>📋 Лог тестування</h5>
                <button class="btn btn-sm btn-secondary float-right" onclick="clearLog()">Очистити</button>
            </div>
            <div class="card-body">
                <div id="log" class="log"></div>
            </div>
        </div>
    </div>

    <!-- Підключаємо AI скрипти -->
    <script src="assets/js/predictive-maintenance.js"></script>
    <script src="assets/js/unified-analytics-engine.js"></script>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function testAISystem() {
            log('🤖 Тестуємо AI систему...');
            
            try {
                if (typeof PredictiveMaintenanceSystem !== 'undefined') {
                    const aiSystem = new PredictiveMaintenanceSystem();
                    log('✅ PredictiveMaintenanceSystem створена успішно');
                    
                    // Тест методів
                    if (typeof aiSystem.init === 'function') {
                        log('✅ Метод init() існує');
                    } else {
                        log('❌ Метод init() відсутній');
                    }
                    
                    if (typeof aiSystem.generateRecommendations === 'function') {
                        log('✅ Метод generateRecommendations() існує');
                    } else {
                        log('❌ Метод generateRecommendations() відсутній');
                    }
                    
                } else {
                    log('❌ PredictiveMaintenanceSystem не визначена');
                }
            } catch (error) {
                log(`❌ Помилка: ${error.message}`);
            }
        }

        function testChart() {
            log('📊 Тестуємо графік...');
            
            try {
                const canvas = document.getElementById('prediction-chart');
                if (!canvas) {
                    log('❌ Canvas не знайдено');
                    return;
                }
                
                const ctx = canvas.getContext('2d');
                
                const data = {
                    labels: ['Тиждень 1', 'Тиждень 2', 'Тиждень 3', 'Тиждень 4'],
                    datasets: [{
                        label: 'Ймовірність поломки (%)',
                        data: [15, 23, 35, 48],
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                };
                
                new Chart(ctx, {
                    type: 'line',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
                
                log('✅ Графік створено успішно');
                
            } catch (error) {
                log(`❌ Помилка створення графіка: ${error.message}`);
            }
        }

        function testRecommendations() {
            log('💡 Тестуємо рекомендації...');
            
            const container = document.getElementById('ai-recommendations');
            if (!container) {
                log('❌ Контейнер рекомендацій не знайдено');
                return;
            }
            
            const recommendations = `
                <div class="alert alert-danger mb-2">
                    <strong>🚨 Критично:</strong> Ліфт #L003 потребує огляду
                </div>
                <div class="alert alert-warning mb-2">
                    <strong>⚠️ Увага:</strong> Планове ТО через 7 днів
                </div>
                <div class="alert alert-success mb-0">
                    <strong>✅ Все добре:</strong> Система працює оптимально
                </div>
            `;
            
            container.innerHTML = recommendations;
            log('✅ Рекомендації завантажено');
        }

        // Автотест при завантаженні
        document.addEventListener('DOMContentLoaded', function() {
            log('🔄 Автоматичне тестування...');
            setTimeout(() => testAISystem(), 500);
            setTimeout(() => testChart(), 1000);
            setTimeout(() => testRecommendations(), 1500);
        });
    </script>
</body>
</html>
