<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест диспетчерської панелі</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="plugins/adminlte/css/adminlte.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Тест диспетчерської панелі</h1>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Тестові кнопки</h3>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-info btn-action" data-action="view" data-id="1001">
                            <i class="fas fa-eye"></i> Перегляд заявки
                        </button>
                        <button class="btn btn-primary btn-action" data-action="assign" data-id="1001">
                            <i class="fas fa-user-check"></i> Призначити заявку
                        </button>
                        <button class="btn btn-success btn-action" data-action="edit" data-id="1001">
                            <i class="fas fa-edit"></i> Редагувати заявку
                        </button>
                        <div id="test-result" class="mt-3 p-2 bg-light"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Статус ініціалізації</h3>
                    </div>
                    <div class="card-body">
                        <p id="status">Ініціалізація...</p>
                        <p id="requests-count">-</p>
                        <p id="technicians-count">-</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Логи консолі</h3>
                    </div>
                    <div class="card-body">
                        <div id="logs" style="height: 200px; overflow-y: auto; background: #f8f9fa; padding: 10px; font-family: monospace; font-size: 12px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальні вікна -->
    <div class="modal fade" id="assignmentModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Призначення заявки</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="assignmentForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="requestSelect">Заявка</label>
                                    <select class="form-control" id="requestSelect" required>
                                        <option value="">Оберіть заявку...</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="techSelect">Технік</label>
                                    <select class="form-control" id="techSelect" required>
                                        <option value="">Оберіть техніка...</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="prioritySelect">Пріоритет</label>
                                    <select class="form-control" id="prioritySelect">
                                        <option value="medium">Середній</option>
                                        <option value="high">Високий</option>
                                        <option value="low">Низький</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="deadline">Дедлайн</label>
                                    <input type="datetime-local" class="form-control" id="deadline" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="assignmentNotes">Примітки</label>
                            <textarea class="form-control" id="assignmentNotes" rows="3"></textarea>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="notifyClient">
                            <label class="form-check-label" for="notifyClient">Сповістити клієнта</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Скасувати</button>
                    <button type="button" class="btn btn-primary" onclick="dispatcherDashboard.submitAssignment()">Призначити</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Підключення скриптів -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="plugins/adminlte/js/adminlte.min.js"></script>
    <script src="assets/js/modules/dispatcher-dashboard.js"></script>

    <script>
        // Перехоплення console.log для відображення на сторінці
        const originalLog = console.log;
        const logs = [];
        console.log = function(...args) {
            logs.push(args.join(' '));
            originalLog.apply(console, args);
            updateLogsDisplay();
        };

        function updateLogsDisplay() {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML = logs.map(log => `<div>${log}</div>`).join('');
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateTestResult(message) {
            document.getElementById('test-result').innerHTML = `<small class="text-info">${new Date().toLocaleTimeString()}: ${message}</small>`;
        }

        $(document).ready(function() {
            console.log('Document ready');
            updateTestResult('Сторінка завантажена');
            
            // Обробник для тестових кнопок
            $(document).on('click', '.btn-action', function(e) {
                e.preventDefault();
                const action = $(this).data('action');
                const id = $(this).data('id');
                console.log(`Button clicked: ${action} for id ${id}`);
                updateTestResult(`Клікнуто кнопку: ${action} (id: ${id})`);
            });
            
            // Перевірка ініціалізації
            setTimeout(() => {
                console.log('Checking initialization...');
                if (window.dispatcherDashboard) {
                    $('#status').text('Ініціалізовано успішно');
                    $('#requests-count').text(`Заявок: ${window.dispatcherDashboard.requests.length}`);
                    $('#technicians-count').text(`Техніків: ${window.dispatcherDashboard.technicians.length}`);
                    console.log('DispatcherDashboard initialized successfully');
                    updateTestResult('DispatcherDashboard ініціалізовано успішно');
                } else {
                    $('#status').text('Помилка ініціалізації');
                    console.log('DispatcherDashboard not initialized');
                    updateTestResult('Помилка ініціалізації DispatcherDashboard');
                }
            }, 1000);
        });
    </script>
</body>
</html>
