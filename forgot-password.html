<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення паролю - LiftMaster Pro</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="hold-transition login-page bg-light">
    <div class="login-box">
        <div class="login-logo mb-4">
            <a href="index.html"><i class="fas fa-elevator text-primary"></i> <b>LiftMaster Pro</b></a>
        </div>
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Відновлення паролю</h3>
            </div>
            <div class="card-body">
                <p class="login-box-msg">Введіть вашу електронну адресу, і ми надішлемо вам інструкції з відновлення паролю.</p>
                
                <form id="forgot-password-form">
                    <div class="input-group mb-3">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Електронна пошта" required autofocus>
                        <div class="input-group-append">
                            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
                        </div>
                    </div>
                    
                    <div class="alert alert-danger" id="forgot-error" style="display: none;"></div>
                    <div class="alert alert-success" id="forgot-success" style="display: none;"></div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-paper-plane"></i> Надіслати інструкції
                    </button>
                </form>
                
                <div class="mt-3 text-center">
                    <span><a href="login.html"><i class="fas fa-arrow-left"></i> Повернутися до входу</a></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- AdminLTE JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/common.js"></script>
    
    <script>
        $(document).ready(function() {
            $('#forgot-password-form').on('submit', function(e) {
                e.preventDefault();
                
                const email = $('#email').val();
                
                // Если мы в режиме разработки, используем локальное хранилище
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    // Простая симуляция отправки инструкций
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    const user = users.find(u => u.email === email);
                    
                    if (!user) {
                        $('#forgot-error').text('Користувач з такою електронною адресою не знайдений').show();
                        $('#forgot-success').hide();
                    } else {
                        $('#forgot-success').text('Інструкції з відновлення паролю надіслано на вашу електронну адресу').show();
                        $('#forgot-error').hide();
                    }
                } else {
                    // Реальный API запрос для восстановления пароля
                    $.ajax({
                        url: '/api/forgot-password',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ email }),
                        success: function(response) {
                            if (response.success) {
                                $('#forgot-success').text('Інструкції з відновлення паролю надіслано на вашу електронну адресу').show();
                                $('#forgot-error').hide();
                            } else {
                                $('#forgot-error').text(response.message || 'Користувач з такою електронною адресою не знайдений').show();
                                $('#forgot-success').hide();
                            }
                        },
                        error: function(xhr) {
                            const message = xhr.responseJSON && xhr.responseJSON.message 
                                ? xhr.responseJSON.message 
                                : 'Сталася помилка. Спробуйте пізніше.';
                            $('#forgot-error').text(message).show();
                            $('#forgot-success').hide();
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
