<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест AI прогнозування - DeapSeaK</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Тестова сторінка завантажена');
            console.log('🔗 Поточний хеш:', window.location.hash);
            
            // Функція для тестування навігації
            function testNavigation() {
                const hash = window.location.hash;
                const resultDiv = document.getElementById('result');
                
                if (hash === '#predictive-analytics') {
                    resultDiv.innerHTML = '✅ AI прогнозування хеш виявлено правильно!';
                    resultDiv.style.background = '#d4edda';
                    resultDiv.style.color = '#155724';
                } else if (hash) {
                    resultDiv.innerHTML = '⚠️ Виявлено інший хеш: ' + hash;
                    resultDiv.style.background = '#fff3cd';
                    resultDiv.style.color = '#856404';
                } else {
                    resultDiv.innerHTML = '❌ Хеш не знайдено';
                    resultDiv.style.background = '#f8d7da';
                    resultDiv.style.color = '#721c24';
                }
            }
            
            // Тестуємо при завантаженні
            testNavigation();
            
            // Тестуємо при зміні хешу
            window.addEventListener('hashchange', testNavigation);
        });
    </script>

        body {

        #result {

        .link {

            margin: 10px 5px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .link:hover {
            background: #0056b3;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
