<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест карти ліфтів</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #testMap { height: 400px; width: 100%; border: 1px solid #ddd; }
        body { font-family: Arial, sans-serif; padding: 20px; }
    </style>
</head>
<body>
    <h1>Тест карти ліфтів</h1>
    <div id="testMap"></div>
    <button onclick="addTestLift()">Додати тестовий ліфт</button>
    <button onclick="clearLifts()">Очистити всі ліфти</button>
    <button onclick="showLiftsData()">Показати дані ліфтів</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Ініціалізація карти
        const map = L.map('testMap').setView([50.4501, 30.5234], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markers = [];

        // Функція для оновлення маркерів
        function updateMarkers() {
            // Очищення існуючих маркерів
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // Завантаження ліфтів з localStorage
            const lifts = JSON.parse(localStorage.getItem('lifts')) || [];

            lifts.forEach(lift => {
                if (lift.lat && lift.lng) {
                    const marker = L.marker([lift.lat, lift.lng]).addTo(map)
                        .bindPopup(`<b>${lift.model}</b><br>${lift.location}<br>ID: ${lift.id}`);
                    markers.push(marker);
                }
            });

            console.log(`Відображено ${markers.length} маркерів`);
        }

        // Додавання тестового ліфта
        function addTestLift() {
            const testLift = {
                id: 'TEST-' + Date.now(),
                model: 'Тестовий ліфт',
                type: 'passenger',
                location: 'Київ, вул. Тестова 1',
                address: 'вул. Тестова 1',
                postcode: '01001',
                lat: 50.4501 + (Math.random() - 0.5) * 0.01,
                lng: 30.5234 + (Math.random() - 0.5) * 0.01,
                capacity: 8,
                speed: 1.0,
                status: 'active',
                clientName: 'Тестовий клієнт',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            const lifts = JSON.parse(localStorage.getItem('lifts')) || [];
            lifts.push(testLift);
            localStorage.setItem('lifts', JSON.stringify(lifts));

            updateMarkers();
            alert('Тестовий ліфт додано!');
        }

        // Очищення всіх ліфтів
        function clearLifts() {
            if (confirm('Видалити всі ліфти?')) {
                localStorage.removeItem('lifts');
                updateMarkers();
                alert('Всі ліфти видалено!');
            }
        }

        // Показати дані ліфтів
        function showLiftsData() {
            const lifts = JSON.parse(localStorage.getItem('lifts')) || [];
            console.log('Дані ліфтів:', lifts);
            alert(`Знайдено ${lifts.length} ліфтів у localStorage`);
        }

        // Початкове завантаження
        updateMarkers();
    </script>
</body>
</html>
