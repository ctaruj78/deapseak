<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>🐛 QR Debug - Що створюється?</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #2d2d2d;
            color: #f0f0f0;
        }
        .section {
            background: #1a1a1a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #444;
        }
        h2 { color: #4ec9b0; }
        button {
            padding: 12px 24px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #005a9e; }
        #qrContainer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
            min-height: 200px;
        }
        #qrContainer img,
        #qrContainer canvas {
            border: 5px solid yellow !important;
            display: block !important;
            margin: 0 auto !important;
            background: white !important;
            padding: 10px !important;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #0f0;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
    </style>
</head>
<body>
    <h1>🐛 QR Code Debug Tool</h1>
    
    <div class="section">
        <h2>📊 Статус бібліотеки</h2>
        <div id="status" class="log">⏳ Завантаження...</div>
    </div>

    <div class="section">
        <h2>🎯 Тест генерації</h2>
        <button id="generateBtn" disabled>Генерувати QR</button>
        <button id="inspectBtn" disabled>Інспектувати DOM</button>
        <button id="clearBtn">Очистити</button>
    </div>

    <div class="section">
        <h2>🖼️ QR Контейнер (фон як у модалі)</h2>
        <div id="qrContainer"></div>
    </div>

    <div class="section">
        <h2>📋 Детальний лог</h2>
        <div id="log" class="log"></div>
    </div>

    <script src="/assets/libs/qrcode-generator.min.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        const qrContainer = document.getElementById('qrContainer');
        const generateBtn = document.getElementById('generateBtn');
        const inspectBtn = document.getElementById('inspectBtn');
        const clearBtn = document.getElementById('clearBtn');

        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        // Перевірка бібліотеки
        let checks = 0;
        const checker = setInterval(() => {
            checks++;
            
            if (typeof qrcode !== 'undefined' || typeof QRCode !== 'undefined') {
                clearInterval(checker);
                
                // Створюємо псевдонім
                if (typeof qrcode !== 'undefined' && typeof QRCode === 'undefined') {
                    window.QRCode = qrcode;
                    log('🔧 Створено window.QRCode = qrcode', 'success');
                }
                
                statusDiv.innerHTML = `
                    <div class="success">✅ Бібліотека завантажена!</div>
                    <div>typeof qrcode: ${typeof qrcode}</div>
                    <div>typeof QRCode: ${typeof QRCode}</div>
                    <div>Спроб: ${checks}</div>
                `;
                
                generateBtn.disabled = false;
                inspectBtn.disabled = false;
                
                log('✅ Бібліотека готова до роботи', 'success');
                return;
            }
            
            if (checks >= 50) {
                clearInterval(checker);
                statusDiv.innerHTML = '<div class="error">❌ Бібліотека не завантажилась</div>';
                log('❌ Бібліотека не завантажилась після 50 спроб', 'error');
            }
        }, 100);

        // Генерація QR
        generateBtn.onclick = function() {
            log('--- ГЕНЕРАЦІЯ QR КОДУ ---', 'warning');
            log('🎯 Очищення контейнера...');
            qrContainer.innerHTML = '';
            
            log('📝 Параметри: text="LIFT-TEST-' + Date.now() + '", width=200, height=200');
            
            try {
                log('🔨 Виклик: new QRCode(container, {...})');
                
                new QRCode(qrContainer, {
                    text: 'LIFT-TEST-' + Date.now(),
                    width: 200,
                    height: 200
                });
                
                log('✅ Конструктор виконався без помилок', 'success');
                
                // Чекаємо 200мс поки елемент з'явиться
                setTimeout(() => {
                    inspectDOM();
                }, 200);
                
            } catch (error) {
                log('❌ ПОМИЛКА: ' + error.message, 'error');
                log('Stack: ' + error.stack, 'error');
            }
        };

        // Інспекція DOM
        inspectBtn.onclick = inspectDOM;
        
        function inspectDOM() {
            log('--- ІНСПЕКЦІЯ DOM ---', 'warning');
            
            log('📊 Контейнер:');
            log('  innerHTML length: ' + qrContainer.innerHTML.length);
            log('  children count: ' + qrContainer.children.length);
            
            const img = qrContainer.querySelector('img');
            const canvas = qrContainer.querySelector('canvas');
            
            if (img) {
                log('🖼️ Знайдено IMG:', 'success');
                log('  width: ' + img.width);
                log('  height: ' + img.height);
                log('  src length: ' + (img.src ? img.src.length : 0));
                log('  src preview: ' + (img.src ? img.src.substring(0, 60) + '...' : 'EMPTY'));
                
                const computed = window.getComputedStyle(img);
                log('  Computed CSS:');
                log('    display: ' + computed.display);
                log('    visibility: ' + computed.visibility);
                log('    opacity: ' + computed.opacity);
                log('    width: ' + computed.width);
                log('    height: ' + computed.height);
                log('    border: ' + computed.border);
                
            } else if (canvas) {
                log('🎨 Знайдено CANVAS:', 'success');
                log('  width: ' + canvas.width);
                log('  height: ' + canvas.height);
            } else {
                log('❌ НЕ ЗНАЙДЕНО жодного елемента (img/canvas)!', 'error');
                log('  Container innerHTML: ' + qrContainer.innerHTML.substring(0, 200));
            }
        }

        clearBtn.onclick = function() {
            qrContainer.innerHTML = '';
            log('🧹 Контейнер очищено', 'warning');
        };
    </script>
</body>
</html>
