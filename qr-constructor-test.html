<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>🔬 QRCode Constructor Test</title>
    <style>
        body { padding: 20px; font-family: monospace; background: #1a1a1a; color: #0f0; }
        #test1, #test2, #test3 { 
            background: white; 
            padding: 20px; 
            margin: 20px; 
            border: 3px solid red;
            min-height: 150px;
        }
        h2 { color: #fff; }
        .log { background: #000; padding: 10px; margin: 10px 0; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <h1>🔬 QRCode Constructor Test</h1>
    
    <h2>Test 1: Створення через getElementById</h2>
    <div id="test1"></div>
    
    <h2>Test 2: Створення через jQuery</h2>
    <div id="test2"></div>
    
    <h2>Test 3: Створення через querySelector</h2>
    <div id="test3"></div>
    
    <div id="log" class="log"></div>

    <script src="/assets/libs/qrcode-generator.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            console.log(msg);
            logDiv.innerHTML += msg + '<br>';
        }

        setTimeout(() => {
            if (typeof qrcode !== 'undefined') {
                window.QRCode = qrcode;
                log('✅ QRCode доступний');
            }

            log('--- TEST 1: getElementById ---');
            try {
                const elem1 = document.getElementById('test1');
                log('Element: ' + elem1.tagName + '#' + elem1.id);
                
                const qr1 = new QRCode(elem1, {
                    text: 'TEST-1-' + Date.now(),
                    width: 150,
                    height: 150
                });
                
                log('QR instance: ' + typeof qr1);
                log('QR instance keys: ' + Object.keys(qr1).join(', '));
                
                setTimeout(() => {
                    log('Children after 200ms: ' + elem1.children.length);
                    log('InnerHTML length: ' + elem1.innerHTML.length);
                    if (elem1.children.length > 0) {
                        log('First child: ' + elem1.children[0].tagName);
                    }
                }, 200);
                
            } catch (error) {
                log('❌ ERROR: ' + error.message);
            }

            log('');
            log('--- TEST 2: jQuery ---');
            setTimeout(() => {
                try {
                    const $elem2 = $('#test2');
                    log('jQuery element: ' + $elem2.length + ' elements');
                    log('DOM element: ' + $elem2[0].tagName + '#' + $elem2[0].id);
                    
                    const qr2 = new QRCode($elem2[0], {
                        text: 'TEST-2-' + Date.now(),
                        width: 150,
                        height: 150
                    });
                    
                    setTimeout(() => {
                        log('Children after 200ms: ' + $elem2[0].children.length);
                        log('InnerHTML length: ' + $elem2[0].innerHTML.length);
                        if ($elem2[0].children.length > 0) {
                            log('First child: ' + $elem2[0].children[0].tagName);
                        }
                    }, 200);
                    
                } catch (error) {
                    log('❌ ERROR: ' + error.message);
                }
            }, 500);

            log('');
            log('--- TEST 3: querySelector ---');
            setTimeout(() => {
                try {
                    const elem3 = document.querySelector('#test3');
                    log('Element: ' + elem3.tagName + '#' + elem3.id);
                    
                    const qr3 = new QRCode(elem3, {
                        text: 'TEST-3-' + Date.now(),
                        width: 150,
                        height: 150
                    });
                    
                    setTimeout(() => {
                        log('Children after 200ms: ' + elem3.children.length);
                        log('InnerHTML length: ' + elem3.innerHTML.length);
                        if (elem3.children.length > 0) {
                            log('First child: ' + elem3.children[0].tagName);
                            const img = elem3.querySelector('img');
                            if (img) {
                                log('IMG found! Src length: ' + (img.src ? img.src.length : 0));
                            }
                        }
                    }, 200);
                    
                } catch (error) {
                    log('❌ ERROR: ' + error.message);
                }
            }, 1000);

        }, 500);
    </script>
</body>
</html>
