# MongoDB Configuration for DeapSeaK v2

# Where to store data
storage:
  dbPath: /workspaces/deapseak/mongodb/data
  journal:
    enabled: true

# Where to log
systemLog:
  destination: file
  path: /workspaces/deapseak/mongodb/logs/mongod.log
  logAppend: true

# Network interfaces
net:
  port: 27017
  bindIp: 127.0.0.1

# Security (disabled for development)
# security:
#   authorization: enabled
