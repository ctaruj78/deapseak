<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кнопок диспетчера</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="plugins/adminlte/css/adminlte.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Тест кнопок диспетчера</h1>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Тестові кнопки</h3>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-info" onclick="testViewRequest()">
                            <i class="fas fa-eye"></i> Тест перегляду
                        </button>
                        <button class="btn btn-primary" onclick="testAssignRequest()">
                            <i class="fas fa-user-check"></i> Тест призначення
                        </button>
                        <button class="btn btn-success" onclick="testEditRequest()">
                            <i class="fas fa-edit"></i> Тест редагування
                        </button>
                        <button class="btn btn-warning" onclick="testCheckboxes()">
                            <i class="fas fa-check-square"></i> Тест чекбоксів
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Статус</h3>
                    </div>
                    <div class="card-body">
                        <p id="status">Очікування ініціалізації...</p>
                        <p id="requests-count">-</p>
                        <p id="technicians-count">-</p>
                        <div id="logs" style="max-height: 200px; overflow-y: auto; background: #f8f9fa; padding: 10px; margin-top: 10px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальні вікна -->
    <div class="modal fade" id="assignmentModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Призначення заявки</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="assignmentForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="requestSelect">Заявка</label>
                                    <select class="form-control" id="requestSelect" required>
                                        <option value="">Оберіть заявку...</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="techSelect">Технік</label>
                                    <select class="form-control" id="techSelect" required>
                                        <option value="">Оберіть техніка...</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="prioritySelect">Пріоритет</label>
                                    <select class="form-control" id="prioritySelect">
                                        <option value="medium">Середній</option>
                                        <option value="high">Високий</option>
                                        <option value="low">Низький</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="deadline">Дедлайн</label>
                                    <input type="datetime-local" class="form-control" id="deadline" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="assignmentNotes">Примітки</label>
                            <textarea class="form-control" id="assignmentNotes" rows="3"></textarea>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="notifyClient">
                            <label class="form-check-label" for="notifyClient">Сповістити клієнта</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Скасувати</button>
                    <button type="button" class="btn btn-primary" onclick="window.dispatcherDashboard.submitAssignment()">Призначити</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Підключення скриптів -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="plugins/adminlte/js/adminlte.min.js"></script>
    <script src="assets/js/modules/dispatcher-dashboard.js"></script>

    <script>
        // Перехоплення console.log для відображення на сторінці
        const originalLog = console.log;
        const logs = [];
        console.log = function(...args) {
            logs.push(args.join(' '));
            originalLog.apply(console, args);
            updateLogsDisplay();
        };

        function updateLogsDisplay() {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML = logs.map(log => `<div style="font-family: monospace; font-size: 12px;">${log}</div>`).join('');
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function testViewRequest() {
            console.log('Testing viewRequest...');
            if (window.dispatcherDashboard && window.dispatcherDashboard.requests.length > 0) {
                window.dispatcherDashboard.viewRequest(window.dispatcherDashboard.requests[0].id);
            } else {
                console.error('dispatcherDashboard not ready or no requests');
            }
        }

        function testAssignRequest() {
            console.log('Testing assignRequest...');
            if (window.dispatcherDashboard && window.dispatcherDashboard.requests.length > 0) {
                window.dispatcherDashboard.assignRequest(window.dispatcherDashboard.requests[0].id);
            } else {
                console.error('dispatcherDashboard not ready or no requests');
            }
        }

        function testEditRequest() {
            console.log('Testing editRequest...');
            if (window.dispatcherDashboard && window.dispatcherDashboard.requests.length > 0) {
                window.dispatcherDashboard.editRequest(window.dispatcherDashboard.requests[0].id);
            } else {
                console.error('dispatcherDashboard not ready or no requests');
            }
        }

        function testCheckboxes() {
            console.log('Testing checkboxes...');
            // Створимо тестовий чекбокс
            const testCheckbox = document.createElement('input');
            testCheckbox.type = 'checkbox';
            testCheckbox.className = 'request-select';
            testCheckbox.dataset.id = '1001';
            testCheckbox.onchange = function(e) {
                console.log('Checkbox changed:', e.target.checked, 'id:', e.target.dataset.id);
            };
            document.body.appendChild(testCheckbox);

            // Симулюємо зміну
            setTimeout(() => {
                testCheckbox.checked = true;
                testCheckbox.onchange({ target: testCheckbox });
            }, 100);
        }

        $(document).ready(function() {
            console.log('Document ready');

            // Перевірка ініціалізації
            setTimeout(() => {
                console.log('Checking initialization...');
                if (window.dispatcherDashboard) {
                    $('#status').text('Ініціалізовано успішно');
                    $('#requests-count').text(`Заявок: ${window.dispatcherDashboard.requests.length}`);
                    $('#technicians-count').text(`Техніків: ${window.dispatcherDashboard.technicians.length}`);
                    console.log('DispatcherDashboard initialized successfully');
                } else {
                    $('#status').text('Помилка ініціалізації');
                    console.log('DispatcherDashboard not initialized');
                }
            }, 1000);
        });
    </script>
</body>
</html>
