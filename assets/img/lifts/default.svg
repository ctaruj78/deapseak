<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b9dc3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b7a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background (modern building) -->
  <rect width="800" height="600" fill="#e2e8f0"/>
  
  <!-- Building structure -->
  <rect x="100" y="50" width="600" height="500" fill="#cbd5e0" stroke="#4a5568" stroke-width="3"/>
  
  <!-- Windows -->
  <rect x="130" y="80" width="80" height="60" fill="#a0aec0"/>
  <rect x="230" y="80" width="80" height="60" fill="#a0aec0"/>
  <rect x="490" y="80" width="80" height="60" fill="#a0aec0"/>
  <rect x="590" y="80" width="80" height="60" fill="#a0aec0"/>
  
  <rect x="130" y="160" width="80" height="60" fill="#a0aec0"/>
  <rect x="230" y="160" width="80" height="60" fill="#a0aec0"/>
  <rect x="490" y="160" width="80" height="60" fill="#a0aec0"/>
  <rect x="590" y="160" width="80" height="60" fill="#a0aec0"/>
  
  <!-- Elevator shaft (center) -->
  <rect x="350" y="50" width="100" height="500" fill="url(#metalGrad)" stroke="#2d3748" stroke-width="4"/>
  
  <!-- Elevator cabin -->
  <rect x="360" y="250" width="80" height="150" fill="#cbd5e0" stroke="#4a5568" stroke-width="3" rx="5"/>
  
  <!-- Elevator doors -->
  <line x1="400" y1="260" x2="400" y2="390" stroke="#4a5568" stroke-width="3"/>
  <rect x="365" y="270" width="30" height="110" fill="#a0aec0" stroke="#4a5568" stroke-width="2" rx="2"/>
  <rect x="405" y="270" width="30" height="110" fill="#a0aec0" stroke="#4a5568" stroke-width="2" rx="2"/>
  
  <!-- Door handles -->
  <rect x="390" y="320" width="8" height="20" fill="#4a5568" rx="4"/>
  <rect x="402" y="320" width="8" height="20" fill="#4a5568" rx="4"/>
  
  <!-- Control panel inside -->
  <rect x="415" y="285" width="18" height="80" fill="#2d3748" rx="3"/>
  <circle cx="424" cy="300" r="3" fill="#48bb78"/>
  <circle cx="424" cy="315" r="3" fill="#ed8936"/>
  <circle cx="424" cy="330" r="3" fill="#f56565"/>
  <circle cx="424" cy="345" r="3" fill="#ecc94b"/>
  <circle cx="424" cy="360" r="3" fill="#4299e1"/>
  
  <!-- Cables -->
  <line x1="375" y1="50" x2="375" y2="250" stroke="#718096" stroke-width="3"/>
  <line x1="385" y1="50" x2="385" y2="250" stroke="#718096" stroke-width="3"/>
  <line x1="415" y1="50" x2="415" y2="250" stroke="#718096" stroke-width="3"/>
  <line x1="425" y1="50" x2="425" y2="250" stroke="#718096" stroke-width="3"/>
  
  <!-- Floor indicator -->
  <rect x="360" y="430" width="80" height="40" fill="#2d3748" rx="5"/>
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#48bb78">3F</text>
  
  <!-- Ground floor -->
  <rect x="0" y="550" width="800" height="50" fill="url(#floorGrad)"/>
  
  <!-- Logo/Brand -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2d3748">FESTLIFT</text>
</svg>
