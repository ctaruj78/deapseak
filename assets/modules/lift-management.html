<!-- Lift Management Module для Administradorів -->
<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0">Управління ліфтами</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#" onclick="window.crmSystem.loadDashboard()">Головна</a></li>
                    <li class="breadcrumb-item active">Elevadores</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<section class="content">
    <div class="container-fluid">
        <!-- Статистика ліфтів -->
        <div class="row mb-4">
            <div class="col-lg-3 col-6">
                <div class="small-box bg-info">
                    <div class="inner">
                        <h3 id="total-lifts">0</h3>
                        <p>Total de elevadores</p>
                    </div>
                    <div class="icon">
                        <i class="fas fa-elevator"></i>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-6">
                <div class="small-box bg-success">
                    <div class="inner">
                        <h3 id="active-lifts">0</h3>
                        <p>Активні</p>
                    </div>
                    <div class="icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-6">
                <div class="small-box bg-warning">
                    <div class="inner">
                        <h3 id="maintenance-lifts">0</h3>
                        <p>На обслуговуванні</p>
                    </div>
                    <div class="icon">
                        <i class="fas fa-tools"></i>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-6">
                <div class="small-box bg-danger">
                    <div class="inner">
                        <h3 id="inactive-lifts">0</h3>
                        <p>Неактивні</p>
                    </div>
                    <div class="icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Список ліфтів -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-list mr-2"></i>
                            Реєстр ліфтів
                        </h3>
                        <div class="card-tools">
                            <button type="button" class="btn btn-primary btn-sm" onclick="showAddLiftModal()">
                                <i class="fas fa-plus"></i> Adicionar ліфт
                            </button>
                            <div class="btn-group ml-2">
                                <button type="button" class="btn btn-sm btn-outline-primary active" data-status-filter="all">
                                    Todos
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-success" data-status-filter="active">
                                    Активні
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-warning" data-status-filter="maintenance">
                                    Em manutenção
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger" data-status-filter="inactive">
                                    Неактивні
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table id="lifts-table" class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Elevador</th>
                                        <th>Endereço</th>
                                        <th>Tipo</th>
                                        <th>Estado</th>
                                        <th>Última manutenção</th>
                                        <th>Próxima manutenção</th>
                                        <th>Дії</th>
                                    </tr>
                                </thead>
                                <tbody id="lifts-tbody">
                                    <!-- Тут будуть завантажені ліфти -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Бічна панель з додатковими функціями -->
            <div class="col-md-4">
                <!-- Швидкі дії -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-tachometer-alt mr-2"></i>
                            Панель управління
                        </h3>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary btn-block mb-2" onclick="window.crmSystem.loadModule('qr-generator')">
                            <i class="fas fa-qrcode mr-2"></i>
                            Генератор QR кодів
                        </button>
                        <button class="btn btn-info btn-block mb-2" onclick="window.crmSystem.loadModule('analytics')">
                            <i class="fas fa-chart-bar mr-2"></i>
                            Análise
                        </button>
                        <button class="btn btn-success btn-block mb-2" onclick="exportLiftsData()">
                            <i class="fas fa-download mr-2"></i>
                            Exportar даних
                        </button>
                        <button class="btn btn-warning btn-block" onclick="window.crmSystem.loadModule('maintenance-schedule')">
                            <i class="fas fa-calendar-alt mr-2"></i>
                            Графік Manutenção
                        </button>
                    </div>
                </div>

                <!-- Hoje потребують уваги -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-exclamation-circle mr-2"></i>
                            Потребують уваги
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="attention-needed">
                            <!-- Тут будуть ліфти що потребують уваги -->
                        </div>
                    </div>
                </div>

                <!-- Останні події -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-history mr-2"></i>
                            Останні події
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="timeline" id="recent-events">
                            <!-- Події будуть завантажені динамічно -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Модальне вікно додавання ліфта -->
<div class="modal fade" id="addLiftModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Adicionar новий ліфт</h4>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addLiftForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="liftModel">Modelo do elevador</label>
                                <input type="text" class="form-control" id="liftModel" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="liftType">Tipo de elevador</label>
                                <select class="form-control" id="liftType" required>
                                    <option value="">Оберіть тип</option>
                                    <option value="passenger">Passageiro</option>
                                    <option value="cargo">Carga</option>
                                    <option value="hospital">Hospitalar</option>
                                    <option value="service">Serviço</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="liftAddress">Endereço</label>
                                <input type="text" class="form-control" id="liftAddress" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="liftPostcode">Código postal</label>
                                <input type="text" class="form-control" id="liftPostcode" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="liftCapacity">Capacidade (pessoas)</label>
                                <input type="number" class="form-control" id="liftCapacity" min="1" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="liftSpeed">Velocidade (m/s)</label>
                                <input type="number" class="form-control" id="liftSpeed" step="0.1" min="0.1" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="inspectionFrequency">Frequência de manutenção (meses)</label>
                                <select class="form-control" id="inspectionFrequency" required>
                                    <option value="3">3 місяці</option>
                                    <option value="6" selected>6 місяців</option>
                                    <option value="12">12 місяців</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="clientName">Nome do cliente</label>
                                <input type="text" class="form-control" id="clientName" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="clientEmail">Email do cliente</label>
                                <input type="email" class="form-control" id="clientEmail" required>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="addLift()">Adicionar ліфт</button>
            </div>
        </div>
    </div>
</div>

<style>
.timeline {
    position: relative;
    max-height: 300px;
    overflow-y: auto;
}

.timeline-item {
    border-left: 2px solid #dee2e6;
    padding: 10px 15px;
    margin-bottom: 15px;
    position: relative;
}

.timeline-item:before {
    content: '';
    position: absolute;
    left: -6px;
    top: 15px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #007bff;
}

.timeline-item.success:before {
    background: #28a745;
}

.timeline-item.warning:before {
    background: #ffc107;
}

.timeline-item.danger:before {
    background: #dc3545;
}

.lift-status-active { color: #28a745; }
.lift-status-maintenance { color: #ffc107; }
.lift-status-inactive { color: #dc3545; }
</style>

<script>
// Дані ліфтів (в реальному проекті це буде завантажуватися з API)
let liftsData = [];

// Ініціалізація модуля
$(document).ready(function() {
    loadLiftsData();
    setupEventListeners();
});

function setupEventListeners() {
    // Filtroація по статусу
    $('[data-status-filter]').on('click', function() {
        const filter = $(this).data('status-filter');
        $('[data-status-filter]').removeClass('active');
        $(this).addClass('active');
        filterLiftsByStatus(filter);
    });
    
    // Автоматичне оновлення кожну хвилину
    setInterval(updateLiftStats, 60000);
}

                postcode: "01011",
                capacity: 12,
                speed: 1.5,

            {

                type: "passenger",

                postcode: "04070",
                capacity: 8,

        console.error('Erro ao carregar dados dos elevadores:', error);

function renderLiftsTable() {
    const tbody = $('#lifts-tbody');
    tbody.empty();
    
    liftsData.forEach(lift => {
        const statusClass = `lift-status-${lift.status}`;
        const statusText = getStatusText(lift.status);
        const typeText = getTypeText(lift.type);
        
        const row = `
            <tr data-lift-id="${lift.id}" data-status="${lift.status}">
                <td>
                    <strong>${lift.model}</strong><br>
                    <small class="text-muted">${lift.clientName}</small>
                </td>
                <td>
                    ${lift.address}<br>
                    <small class="text-muted">${lift.postcode}</small>
                </td>
                <td>
                    <span class="badge badge-info">${typeText}</span><br>
                    <small>${lift.capacity} pessoas, ${lift.speed} m/s</small>
                </td>
                <td>
                    <span class="badge badge-${getStatusBadgeClass(lift.status)} ${statusClass}">
                        ${statusText}
                    </span>
                </td>
                <td>
                    ${formatDate(lift.lastMaintenance)}
                </td>
                <td>
                    ${formatDate(lift.nextMaintenance)}
                    ${isMaintenanceDue(lift.nextMaintenance) ? '<i class="fas fa-exclamation-triangle text-warning ml-1"></i>' : ''}
                </td>
                <td>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-primary" onclick="viewLiftDetails('${lift.id}')" title="Detalhes">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-warning" onclick="editLift('${lift.id}')" title="Editar">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-success" onclick="generateLiftQR('${lift.id}')" title="QR код">
                            <i class="fas fa-qrcode"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteLift('${lift.id}')" title="Eliminar">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
        tbody.append(row);
    });
}

function filterLiftsByStatus(status) {
    const rows = $('#lifts-tbody tr');
    
    if (status === 'all') {
        rows.show();
    } else {
        rows.each(function() {
            const liftStatus = $(this).data('status');
            if (liftStatus === status) {
                $(this).show();
            } else {
                $(this).hide();
            }
        });
    }
}

function updateLiftStats() {
    const total = liftsData.length;
    const active = liftsData.filter(lift => lift.status === 'active').length;
    const maintenance = liftsData.filter(lift => lift.status === 'maintenance').length;
    const inactive = liftsData.filter(lift => lift.status === 'inactive').length;
    
    $('#total-lifts').text(total);
    $('#active-lifts').text(active);
    $('#maintenance-lifts').text(maintenance);
    $('#inactive-lifts').text(inactive);
}

function loadAttentionNeeded() {
    const attentionDiv = $('#attention-needed');
    attentionDiv.empty();
    
    // Знаходимо ліфти що потребують уваги
    const needAttention = liftsData.filter(lift => 
        isMaintenanceDue(lift.nextMaintenance) || lift.status === 'inactive'
    );
    
    if (needAttention.length === 0) {
        attentionDiv.append('<p class="text-muted">Todos os elevadores em estado normal</p>');
        return;
    }
    
    needAttention.forEach(lift => {
        const alertClass = lift.status === 'inactive' ? 'danger' : 'warning';
        const reason = lift.status === 'inactive' ? 'Inativo' : 'Manutenção necessária';
        
        attentionDiv.append(`
            <div class="alert alert-${alertClass} p-2 mb-2">
                <strong>${lift.model}</strong><br>
                <small>${lift.address}</small><br>
                <span class="badge badge-${alertClass}">${reason}</span>
            </div>
        `);
    });
}

function loadRecentEvents() {
    const eventsDiv = $('#recent-events');
    eventsDiv.empty();
    
    // Імітуємо останні події
    const events = [
        { time: '14:30', title: 'Manutenção concluída', lift: 'Elevador N.º1', type: 'success' },
        { time: '13:15', title: 'Chamada de emergência', lift: 'Elevador N.º3', type: 'danger' },
        { time: '11:00', title: 'Manutenção planeada', lift: 'Elevador N.º2', type: 'warning' },
        { time: '09:30', title: 'Novo elevador adicionado', lift: 'Elevador N.º5', type: 'success' }
    ];
    
    events.forEach(event => {
        eventsDiv.append(`
            <div class="timeline-item ${event.type}">
                <div class="d-flex justify-content-between">
                    <div>
                        <strong>${event.title}</strong><br>
                        <small>${event.lift}</small>
                    </div>
                    <small class="text-muted">${event.time}</small>
                </div>
            </div>
        `);
    });
}

// Допоміжні функції
function getStatusText(status) {
    const statuses = {
        'active': 'Ativo',
        'maintenance': 'Em manutenção',
        'inactive': 'Inativo'
    };
    return statuses[status] || status;
}

function getStatusBadgeClass(status) {
    const classes = {
        'active': 'success',
        'maintenance': 'warning',
        'inactive': 'danger'
    };
    return classes[status] || 'secondary';
}

function getTypeText(type) {
    const types = {
        'passenger': 'Passageiro',
        'cargo': 'Carga',
        'hospital': 'Hospitalar',
        'service': 'Serviço'
    };
    return types[type] || type;
}

function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('uk-UA');
}

function isMaintenanceDue(nextMaintenanceDate) {
    const today = new Date();
    const maintenanceDate = new Date(nextMaintenanceDate);
    const diffDays = Math.ceil((maintenanceDate - today) / (1000 * 60 * 60 * 24));
    return diffDays <= 7; // Попереджати за тиждень
}

// Функції управління ліфтами
function showAddLiftModal() {
    $('#addLiftModal').modal('show');
}

function addLift() {
    const form = $('#addLiftForm')[0];
    if (!form.checkValidity()) {
        toastr.error('Preencha todos os campos obrigatórios');
        return;
    }
    
    const newLift = {
        id: 'lift_' + Date.now(),
        model: $('#liftModel').val(),
        type: $('#liftType').val(),
        address: $('#liftAddress').val(),
        postcode: $('#liftPostcode').val(),
        capacity: parseInt($('#liftCapacity').val()),
        speed: parseFloat($('#liftSpeed').val()),
        status: 'active',
        lastMaintenance: new Date().toISOString().split('T')[0],
        nextMaintenance: calculateNextMaintenance(parseInt($('#inspectionFrequency').val())),
        inspectionFrequency: parseInt($('#inspectionFrequency').val()),
        clientName: $('#clientName').val(),
        clientEmail: $('#clientEmail').val()
    };
    
    liftsData.push(newLift);
    renderLiftsTable();
    updateLiftStats();
    
    $('#addLiftModal').modal('hide');
    $('#addLiftForm')[0].reset();
    toastr.success('Elevador adicionado com sucesso');
}

function calculateNextMaintenance(frequencyMonths) {
    const date = new Date();
    date.setMonth(date.getMonth() + frequencyMonths);
    return date.toISOString().split('T')[0];
}

function viewLiftDetails(liftId) {
    const lift = liftsData.find(l => l.id === liftId);
    if (lift) {
        // Тут може бути модальне вікно з деталями
        alert(`Detalhes do elevador:\n\nModelo: ${lift.model}\nEndereço: ${lift.address}\nCliente: ${lift.clientName}\nEstado: ${getStatusText(lift.status)}`);
    }
}

function editLift(liftId) {
    toastr.info('Função de edição em desenvolvimento');
}

function generateLiftQR(liftId) {
    toastr.success('A abrir o gerador de QR codes...');
    window.crmSystem.loadModule('qr-generator');
}

function deleteLift(liftId) {
    if (confirm('Tem a certeza que pretende eliminar este elevador?')) {
        liftsData = liftsData.filter(lift => lift.id !== liftId);
        renderLiftsTable();
        updateLiftStats();
        loadAttentionNeeded();
        toastr.success('Elevador eliminado');
    }
}

function exportLiftsData() {
    // Імітуємо експорт
    toastr.info('A preparar ficheiro para descarregar...');
    setTimeout(() => {
        toastr.success('Dados exportados com sucesso!');
    }, 2000);
}
</script>
