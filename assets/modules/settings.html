<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налаштування системи</title>
    <link rel="stylesheet" href="../plugins/adminlte/css/adminlte.min.css">
    <link rel="stylesheet" href="../plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../plugins/bootstrap-switch/css/bootstrap3/bootstrap-switch.min.css">
</head>
<body>
<div class="content-wrapper">
    <!-- Content Header -->
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 class="m-0">Налаштування системи</h1>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a href="#" onclick="window.crmSystem.loadDashboard()">Головна</a></li>
                        <li class="breadcrumb-item active">Налаштування</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <!-- General Settings -->
                <div class="col-md-6">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">Загальні налаштування</h3>
                        </div>
                        <form>
                            <div class="card-body">
                                <div class="form-group">
                                    <label for="companyName">Назва компанії</label>
                                    <input type="text" class="form-control" id="companyName" value="ЛіфтСервіс Україна">
                                </div>
                                <div class="form-group">
                                    <label for="companyEmail">Email компанії</label>
                                    <input type="email" class="form-control" id="companyEmail" value="info@liftservice.ua">
                                </div>
                                <div class="form-group">
                                    <label for="companyPhone">Телефон</label>
                                    <input type="tel" class="form-control" id="companyPhone" value="+38 (044) 123-45-67">
                                </div>
                                <div class="form-group">
                                    <label for="timezone">Часовий пояс</label>
                                    <select class="form-control" id="timezone">
                                        <option selected>Europe/Kiev (UTC+2)</option>
                                        <option>Europe/London (UTC+0)</option>
                                        <option>Europe/Berlin (UTC+1)</option>
                                        <option>America/New_York (UTC-5)</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="language">Мова системи</label>
                                    <select class="form-control" id="language">
                                        <option selected>Українська</option>
                                        <option>English</option>
                                        <option>Русский</option>
                                    </select>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="button" class="btn btn-primary" onclick="saveGeneralSettings()">Зберегти</button>
                                <button type="button" class="btn btn-default float-right" onclick="resetGeneralSettings()">Скинути</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- System Features -->
                <div class="col-md-6">
                    <div class="card card-info">
                        <div class="card-header">
                            <h3 class="card-title">Функції системи</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label>QR-коди</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableQR" checked>
                                    <label class="custom-control-label" for="enableQR">Увімкнути QR-коди</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Мобільний додаток</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableMobile" checked>
                                    <label class="custom-control-label" for="enableMobile">Мобільний доступ</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Сповіщення</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableNotifications" checked>
                                    <label class="custom-control-label" for="enableNotifications">Email сповіщення</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>SMS сповіщення</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableSMS">
                                    <label class="custom-control-label" for="enableSMS">SMS повідомлення</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Аналітика</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableAnalytics" checked>
                                    <label class="custom-control-label" for="enableAnalytics">Збір статистики</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>API доступ</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableAPI">
                                    <label class="custom-control-label" for="enableAPI">Зовнішній API</label>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="button" class="btn btn-info" onclick="saveFeatureSettings()">Зберегти налаштування</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Database Settings -->
                <div class="col-md-6">
                    <div class="card card-warning">
                        <div class="card-header">
                            <h3 class="card-title">База даних</h3>
                        </div>
                        <div class="card-body">
                            <div class="info-box">
                                <span class="info-box-icon bg-warning"><i class="fas fa-database"></i></span>
                                <div class="info-box-content">
                                    <span class="info-box-text">Розмір БД</span>
                                    <span class="info-box-number">245.6 MB</span>
                                </div>
                            </div>
                            <div class="info-box">
                                <span class="info-box-icon bg-info"><i class="fas fa-table"></i></span>
                                <div class="info-box-content">
                                    <span class="info-box-text">Таблиць</span>
                                    <span class="info-box-number">18</span>
                                </div>
                            </div>
                            <div class="info-box">
                                <span class="info-box-icon bg-success"><i class="fas fa-clock"></i></span>
                                <div class="info-box-content">
                                    <span class="info-box-text">Останній бекап</span>
                                    <span class="info-box-number" style="font-size: 14px;">21.12.2024 02:00</span>
                                </div>
                            </div>
                            <div class="btn-group-vertical btn-block">
                                <button class="btn btn-warning" onclick="backupDatabase()">
                                    <i class="fas fa-download"></i> Створити бекап
                                </button>
                                <button class="btn btn-info" onclick="optimizeDatabase()">
                                    <i class="fas fa-cog"></i> Оптимізувати БД
                                </button>
                                <button class="btn btn-secondary" onclick="viewDatabaseStats()">
                                    <i class="fas fa-chart-line"></i> Статистика
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Security Settings -->
                <div class="col-md-6">
                    <div class="card card-danger">
                        <div class="card-header">
                            <h3 class="card-title">Безпека</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="sessionTimeout">Час сесії (хвилини)</label>
                                <input type="number" class="form-control" id="sessionTimeout" value="60">
                            </div>
                            <div class="form-group">
                                <label for="maxLoginAttempts">Максимум спроб входу</label>
                                <input type="number" class="form-control" id="maxLoginAttempts" value="5">
                            </div>
                            <div class="form-group">
                                <label>Двофакторна автентифікація</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enable2FA">
                                    <label class="custom-control-label" for="enable2FA">Увімкнути 2FA</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Логування дій</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableLogging" checked>
                                    <label class="custom-control-label" for="enableLogging">Журнал активності</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>IP блокування</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="enableIPBlock" checked>
                                    <label class="custom-control-label" for="enableIPBlock">Блокувати підозрілі IP</label>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="button" class="btn btn-danger" onclick="saveSecuritySettings()">Зберегти налаштування безпеки</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- System Information -->
            <div class="row">
                <div class="col-12">
                    <div class="card card-success">
                        <div class="card-header">
                            <h3 class="card-title">Системна інформація</h3>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="info-box">
                                        <span class="info-box-icon bg-success"><i class="fas fa-server"></i></span>
                                        <div class="info-box-content">
                                            <span class="info-box-text">Версія системи</span>
                                            <span class="info-box-number">v2.1.4</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-box">
                                        <span class="info-box-icon bg-info"><i class="fas fa-memory"></i></span>
                                        <div class="info-box-content">
                                            <span class="info-box-text">Використання RAM</span>
                                            <span class="info-box-number">68%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-box">
                                        <span class="info-box-icon bg-warning"><i class="fas fa-hdd"></i></span>
                                        <div class="info-box-content">
                                            <span class="info-box-text">Вільно місця</span>
                                            <span class="info-box-number">15.2 GB</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-box">
                                        <span class="info-box-icon bg-danger"><i class="fas fa-clock"></i></span>
                                        <div class="info-box-content">
                                            <span class="info-box-text">Uptime</span>
                                            <span class="info-box-number" style="font-size: 16px;">15д 8г</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-12">
                                    <button class="btn btn-success mr-2" onclick="checkForUpdates()">
                                        <i class="fas fa-sync"></i> Перевірити оновлення
                                    </button>
                                    <button class="btn btn-warning mr-2" onclick="restartSystem()">
                                        <i class="fas fa-power-off"></i> Перезапуск системи
                                    </button>
                                    <button class="btn btn-info mr-2" onclick="exportSettings()">
                                        <i class="fas fa-download"></i> Експорт налаштувань
                                    </button>
                                    <button class="btn btn-secondary" onclick="importSettings()">
                                        <i class="fas fa-upload"></i> Імпорт налаштувань
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
function saveGeneralSettings() {
    toastr.success('Загальні налаштування збережено');
}

function resetGeneralSettings() {
    if(confirm('Скинути всі загальні налаштування до значень за замовчуванням?')) {
        toastr.info('Налаштування скинуто');
    }
}

function saveFeatureSettings() {
    toastr.success('Налаштування функцій збережено');
}

function saveSecuritySettings() {
    toastr.success('Налаштування безпеки збережено');
}

function backupDatabase() {
    toastr.info('Створення бекапу бази даних...');
    setTimeout(() => {
        toastr.success('Бекап створено успішно');
    }, 2000);
}

function optimizeDatabase() {
    toastr.info('Оптимізація бази даних...');
    setTimeout(() => {
        toastr.success('База даних оптимізована');
    }, 3000);
}

function viewDatabaseStats() {
    alert('Перегляд детальної статистики бази даних');
}

function checkForUpdates() {
    toastr.info('Перевірка оновлень...');
    setTimeout(() => {
        toastr.success('Система використовує найновішу версію');
    }, 2000);
}

function restartSystem() {
    if(confirm('Перезапустити систему? Всі користувачі будуть відключені.')) {
        toastr.warning('Система перезапускається...');
    }
}

function exportSettings() {
    toastr.success('Налаштування експортовано');
}

function importSettings() {
    alert('Виберіть файл для імпорту налаштувань');
}
</script>
</body>
</html>
