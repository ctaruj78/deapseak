<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест збереження ліфтів</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
</head>
<body class="hold-transition sidebar-mini">
    <div class="wrapper">
        <div class="content-wrapper" style="margin-left: 0;">
            <div class="content-header">
                <div class="container-fluid">
                    <h1 class="m-0">Тестування збереження ліфтів</h1>
                </div>
            </div>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-primary">
                                    <h3 class="card-title text-white">Тестування функціональності</h3>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <button id="btnTestSave" class="btn btn-success btn-block">
                                            <i class="fas fa-save"></i> Тестувати збереження ліфта
                                        </button>
                                    </div>
                                    <div class="mb-3">
                                        <button id="btnShowStorage" class="btn btn-info btn-block">
                                            <i class="fas fa-database"></i> Показати стан сховища
                                        </button>
                                    </div>
                                    <div class="mb-3">
                                        <button id="btnClearTest" class="btn btn-warning btn-block">
                                            <i class="fas fa-trash"></i> Очистити тестові дані
                                        </button>
                                    </div>
                                    <div class="mb-3">
                                        <button id="btnOpenMainPage" class="btn btn-primary btn-block">
                                            <i class="fas fa-external-link-alt"></i> Відкрити основну сторінку
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-success">
                                    <h3 class="card-title text-white">Результати тестування</h3>
                                </div>
                                <div class="card-body">
                                    <div id="testResults" style="height: 400px; overflow-y: auto; background: #f8f9fa; padding: 15px; border-radius: 5px;">
                                        <em class="text-muted">Результати з'являться тут...</em>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Поточний стан -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header bg-info">
                                    <h3 class="card-title text-white">Поточний стан системи</h3>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="info-box">
                                                <span class="info-box-icon bg-info"><i class="fas fa-elevator"></i></span>
                                                <div class="info-box-content">
                                                    <span class="info-box-text">Ліфтів в пам'яті</span>
                                                    <span class="info-box-number" id="liftsInMemory">0</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="info-box">
                                                <span class="info-box-icon bg-success"><i class="fas fa-database"></i></span>
                                                <div class="info-box-content">
                                                    <span class="info-box-text">Ліфтів у сховищі</span>
                                                    <span class="info-box-number" id="liftsInStorage">0</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="info-box">
                                                <span class="info-box-icon bg-warning"><i class="fas fa-bug"></i></span>
                                                <div class="info-box-content">
                                                    <span class="info-box-text">Тестових ліфтів</span>
                                                    <span class="info-box-number" id="testLifts">0</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    
    <!-- Our scripts -->
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/lift-utils.js"></script>
    <script src="/assets/js/enhanced-lift-modal.js"></script>

    <script>
        function logToResults(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('uk-UA');
            const typeClass = {
                'info': 'text-info',
                'success': 'text-success',
                'error': 'text-danger',
                'warning': 'text-warning'
            }[type] || 'text-info';
            
            const logHtml = `
                <div class="mb-1">
                    <small class="text-muted">[${timestamp}]</small>
                    <span class="${typeClass}">${message}</span>
                </div>
            `;
            
            $('#testResults').prepend(logHtml);
        }

        function updateStats() {
            // Підрахунок ліфтів в пам'яті
            let memoryCount = 0;
            if (typeof allLifts !== 'undefined') {
                memoryCount = allLifts.length;
            }
            $('#liftsInMemory').text(memoryCount);
            
            // Підрахунок ліфтів у сховищі
            let storageCount = 0;
            try {
                const stored = localStorage.getItem('lifts');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    storageCount = parsed.length;
                }
            } catch (error) {
                console.error('Error reading storage:', error);
            }
            $('#liftsInStorage').text(storageCount);
            
            // Підрахунок тестових ліфтів
            let testCount = 0;
            if (typeof allLifts !== 'undefined') {
                testCount = allLifts.filter(lift => 
                    lift.municipalNumber?.startsWith('TEST-') || 
                    lift.id?.startsWith('test_')
                ).length;
            }
            $('#testLifts').text(testCount);
        }

        $(document).ready(function() {
            logToResults('Система ініціалізована', 'success');
            updateStats();
            
            // Оновлюємо статистику кожні 2 секунди
            setInterval(updateStats, 2000);
            
            $('#btnTestSave').on('click', function() {
                logToResults('Початок тестування збереження...', 'info');
                
                // Перевіряємо залежності
                if (typeof allLifts === 'undefined') {
                    logToResults('❌ allLifts не визначено', 'error');
                    return;
                }
                
                if (typeof CommonUtils === 'undefined') {
                    logToResults('❌ CommonUtils не визначено', 'error');
                    return;
                }
                
                if (typeof window.enhancedLiftModal === 'undefined') {
                    logToResults('❌ enhancedLiftModal не визначено', 'error');
                    return;
                }
                
                logToResults('✅ Всі залежності доступні', 'success');
                
                // Створюємо тестові дані
                const testData = {
                    municipalNumber: 'TEST-' + Date.now(),
                    serialNumber: 'SN-TEST-' + Math.random().toString(36).substr(2, 5),
                    brand: 'otis',
                    model: 'Test Model',
                    type: 'passenger',
                    capacity: 8,
                    speed: 1.0,
                    address: 'вул. Тестова, 1, Київ',
                    postcode: '01001',
                    lat: 50.4501,
                    lng: 30.5234,
                    clientName: 'Тестовий клієнт',
                    clientEmail: 'test@example.com',
                    status: 'active'
                };
                
                logToResults('📝 Тестові дані створено: ' + testData.municipalNumber, 'info');
                
                // Конвертуємо та зберігаємо
                try {
                    const convertedData = window.enhancedLiftModal.convertToLiftFormat(testData);
                    logToResults('🔄 Дані конвертовано', 'success');
                    
                    window.enhancedLiftModal.saveLiftData(convertedData)
                        .then(() => {
                            logToResults('✅ Ліфт успішно збережено!', 'success');
                            updateStats();
                        })
                        .catch(error => {
                            logToResults('❌ Помилка збереження: ' + error.message, 'error');
                        });
                } catch (error) {
                    logToResults('❌ Помилка конвертації: ' + error.message, 'error');
                }
            });
            
            $('#btnShowStorage').on('click', function() {
                logToResults('📊 Поточний стан сховища:', 'info');
                
                try {
                    const stored = localStorage.getItem('lifts');
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        logToResults(`📁 У localStorage: ${parsed.length} ліфтів`, 'info');
                        parsed.forEach((lift, index) => {
                            logToResults(`${index + 1}. ${lift.municipalNumber || lift.id} - ${lift.address || 'Без адреси'}`, 'info');
                        });
                    } else {
                        logToResults('📁 localStorage порожній', 'warning');
                    }
                } catch (error) {
                    logToResults('❌ Помилка читання localStorage: ' + error.message, 'error');
                }
                
                if (typeof allLifts !== 'undefined') {
                    logToResults(`💾 У пам'яті: ${allLifts.length} ліфтів`, 'info');
                }
                
                updateStats();
            });
            
            $('#btnClearTest').on('click', function() {
                if (typeof allLifts !== 'undefined') {
                    const originalCount = allLifts.length;
                    const filtered = allLifts.filter(lift => 
                        !lift.municipalNumber?.startsWith('TEST-') && 
                        !lift.id?.startsWith('test_')
                    );
                    
                    // Оновлюємо глобальну змінну
                    allLifts.length = 0;
                    allLifts.push(...filtered);
                    
                    // Зберігаємо
                    if (typeof CommonUtils !== 'undefined' && CommonUtils.saveLifts) {
                        CommonUtils.saveLifts(allLifts);
                    } else {
                        localStorage.setItem('lifts', JSON.stringify(allLifts));
                    }
                    
                    const removedCount = originalCount - allLifts.length;
                    logToResults(`🗑️ Видалено ${removedCount} тестових ліфтів`, 'success');
                    updateStats();
                } else {
                    logToResults('❌ allLifts не доступно', 'error');
                }
            });
            
            $('#btnOpenMainPage').on('click', function() {
                window.open('/pages/admin/lifts.html', '_blank');
            });
        });
    </script>
</body>
</html>
